<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Fairy Fighters</title>
<!-- sdk.js: только для Яндекс Игр -->
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#07070c;color:#e6dfc8;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font:bold 15px/1.25 "Courier New",ui-monospace,monospace;}
  body{position:fixed;inset:0;touch-action:none;overscroll-behavior:none;}
  #c{position:fixed;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;}
  .hide{display:none!important}
  .shadow{text-shadow:2px 2px 0 #000}
  /* панели в пиксельном духе: без скруглений, жёсткие тени */
  .panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#12111c;
    border:3px solid #3b3550;box-shadow:0 0 0 3px #000,8px 8px 0 #000;padding:16px 18px;
    width:min(460px,calc(100vw - 40px));max-height:calc(100vh - 40px);overflow:auto;box-sizing:border-box;z-index:20}
  .panel h1{margin:0 0 2px;font-size:28px;letter-spacing:1px;color:#f0d890;text-align:center}
  /* меню поверх драки ботов: полупрозрачное и прижато вниз, сверху логотип */
  #menu{top:auto;bottom:max(10px,2vh);transform:translateX(-50%);background:rgba(18,17,28,.86);max-height:calc(100vh - min(80vw,520px,52vh) * .4 - 34px)}
  /* логотип ниже по высоте экрана: ширина не больше 52% высоты, иначе меню наезжает на вторую строку */
  #logo{position:fixed;left:50%;top:max(8px,2vh);transform:translateX(-50%);z-index:19;pointer-events:none;
    width:min(80vw,520px,52vh);height:auto;image-rendering:pixelated;animation:bob 2.4s steps(2) infinite}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}
  #menu .row{margin:5px 0}
  #menu .btn{min-height:40px}
  .panel h2{margin:0 0 10px;font-size:20px;color:#f0d890;text-align:center}
  .sub{text-align:center;color:#a99fc0;font-size:13px;margin-bottom:12px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:7px 0}
  .row>span{color:#c8bfd8;font-size:14px}
  .seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .btn{font:inherit;color:#e6dfc8;background:#2c2840;border:2px solid #000;min-height:44px;min-width:44px;
    padding:6px 10px;cursor:pointer;box-shadow:inset -3px -3px 0 #1b1828,inset 3px 3px 0 #48416a;}
  .btn:active{transform:translate(1px,1px)}
  .btn.on{background:#7a4a1c;box-shadow:inset -3px -3px 0 #4a2a0c,inset 3px 3px 0 #b07a3a;color:#fff3cf}
  .btn.big{display:block;width:100%;font-size:20px;min-height:52px;margin-top:12px;background:#8a2222;
    box-shadow:inset -3px -3px 0 #4a0e0e,inset 3px 3px 0 #c45050}
  .ctrl{margin-top:12px;color:#8f86a8;font-size:12px;line-height:1.5}
  #hud{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;justify-content:center;padding:6px;z-index:5;pointer-events:none;flex-wrap:wrap}
  .card{background:rgba(10,9,16,.78);border:2px solid #000;padding:3px 6px;min-width:120px;font-size:12px}
  .card .nm{display:flex;align-items:center;gap:5px;white-space:nowrap}
  .card .nm i{display:inline-block;width:9px;height:9px;border:1px solid #000}
  .hp{height:6px;background:#2a0b0b;border:1px solid #000;margin:3px 0 2px}
  .hp>div{height:100%;background:#c22b2b}
  .card .ln{display:flex;justify-content:space-between;gap:6px;color:#bdb3cf;font-size:11px}
  #roul{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;gap:10px;z-index:15;flex-wrap:wrap;justify-content:center;width:min(760px,96vw)}
  .rc{background:#12111c;border:3px solid #3b3550;box-shadow:0 0 0 2px #000,5px 5px 0 #000;padding:8px 10px;width:150px;text-align:center}
  .rc .who{font-size:12px;margin-bottom:4px}
  .rc .race{font-size:20px;color:#f0d890;min-height:26px}
  .rc .perk{font-size:11px;color:#a99fc0;min-height:28px;margin-top:3px}
  #banner{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:30px;color:#f0d890;z-index:14;pointer-events:none;padding:0 12px}
  #pbtn{position:fixed;right:8px;top:8px;z-index:16;width:44px;height:44px;padding:0}
  #touch{position:fixed;left:0;right:0;bottom:0;z-index:10}
  #stick{position:absolute;left:18px;bottom:18px;width:150px;height:150px;border:3px solid rgba(255,255,255,.18);background:rgba(20,18,30,.35)}
  #knob{position:absolute;width:52px;height:52px;left:49px;top:49px;background:rgba(230,220,200,.35);border:2px solid rgba(0,0,0,.6)}
  #tbtns{position:absolute;right:16px;bottom:16px;display:grid;grid-template-columns:repeat(2,78px);gap:10px}
  #tbtns .btn{height:68px;font-size:14px;opacity:.82}
  #touch.panelmode{background:#0d0c14;border-top:3px solid #3b3550}
  .list{margin:8px 0}
  .list .row{border-bottom:1px solid #2a2640;padding-bottom:4px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<canvas id="logo" class="hide" width="100" height="40" aria-label="Fairy Fighters"></canvas>
<div id="hud"></div>
<button id="pbtn" class="btn hide" aria-label="Пауза">II</button>
<div id="banner" class="shadow"></div>
<div id="roul" class="hide"></div>

<div id="menu" class="panel hide">
  <div class="sub" data-i="sub"></div>
  <div id="opts"></div>
  <button id="play" class="btn big" data-i="play"></button>
  <div class="ctrl" id="ctrlText"></div>
</div>

<div id="pause" class="panel hide">
  <h2 data-i="pause"></h2>
  <button id="resume" class="btn big" data-i="resume"></button>
  <div class="row"><span data-i="sound"></span><div class="seg" id="psound"></div></div>
  <button id="toMenu" class="btn" style="width:100%;margin-top:8px" data-i="menu"></button>
</div>

<div id="over" class="panel hide">
  <h2 id="overTitle"></h2>
  <div class="list" id="overList"></div>
  <button id="again" class="btn big" data-i="again"></button>
  <button id="overMenu" class="btn" style="width:100%;margin-top:8px" data-i="menu"></button>
</div>

<div id="touch" class="hide">
  <div id="stick"><div id="knob"></div></div>
  <div id="tbtns">
    <button class="btn" data-k="sht" data-i="tShoot"></button>
    <button class="btn" data-k="jump" data-i="tJump"></button>
    <button class="btn" data-k="atk" data-i="tAtk"></button>
    <button class="btn" data-k="down" data-i="tDown"></button>
  </div>
</div>

<script src="../shared/sfx.js"></script>
<script src="assets/game/manifest.js"></script>
<script src="game.js"></script>
</body>
</html>
