<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Болтики: Сортировка Гаек</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; overflow: hidden; background: #151726;
    /* п.1.10.2: без swipe-to-refresh и bounce-скролла, без iOS-меню по долгому тапу */
    overscroll-behavior: none; touch-action: none; -webkit-touch-callout: none;
  }
  body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; user-select: none; -webkit-user-select: none; }
  #game { position: fixed; inset: 0; touch-action: none; display: block; }
  .modal {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(10, 12, 24, .75); z-index: 10; backdrop-filter: blur(4px);
  }
  .modal.show { display: flex; }
  .panel {
    background: #232640; border-radius: 20px; padding: 28px 32px; text-align: center;
    color: #fff; box-shadow: 0 12px 40px rgba(0,0,0,.5); max-width: 320px; width: 86%;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .panel h2 { font-size: 26px; margin-bottom: 6px; }
  .panel .sc { font-size: 44px; font-weight: 800; color: #ffd54a; margin: 8px 0 2px; }
  .panel .bs { font-size: 15px; color: #9aa0c3; margin-bottom: 18px; }
  .btn {
    display: block; width: 100%; min-height: 48px; border: 0; border-radius: 14px; padding: 14px 18px;
    font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 10px; color: #fff;
    transition: transform .1s;
  }
  .btn:active { transform: scale(.96); }
  .btn-green { background: linear-gradient(180deg, #4cd964, #2fae4a); }
  .btn-blue  { background: linear-gradient(180deg, #5a9cff, #3a6fe0); }
  .btn small { display: block; font-weight: 400; font-size: 12px; opacity: .85; }
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; gap: 10px; justify-content: center;
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
  }
  .bbtn {
    flex: 1; max-width: 190px; min-height: 48px; border: 0; border-radius: 14px; padding: 10px 8px;
    font-size: 15px; font-weight: 700; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #3d4364, #2a2e48);
    box-shadow: 0 3px 10px rgba(0,0,0,.35); transition: transform .1s;
  }
  .bbtn:active { transform: scale(.96); }
  .bbtn:disabled { opacity: .38; }
  .bbtn small { display: block; font-weight: 400; font-size: 11px; opacity: .8; margin-top: 2px; }
  /* Главное меню */
  #menu {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #242845, #171a2c 55%, #0d0e17);
  }
  #menu.hide { display: none; }
  .menu-inner { text-align: center; color: #fff; width: 86%; max-width: 340px; }
  .menu-logo {
    font-size: 54px; font-weight: 800; letter-spacing: 2px; color: #ffd54a;
    text-shadow: 0 3px 0 #a9791a, 0 7px 20px rgba(0,0,0,.55);
  }
  .menu-sub { font-size: 17px; color: #9aa0c3; margin: 6px 0 44px; }
  .menu-btn {
    display: block; width: 100%; border: 0; border-radius: 16px; padding: 16px;
    font-size: 18px; font-weight: 700; color: #fff; cursor: pointer; margin-top: 14px; transition: transform .1s;
  }
  .menu-btn:active { transform: scale(.95); }
  .menu-btn.play { background: linear-gradient(180deg, #4cd964, #2fae4a); font-size: 22px; }
  .menu-btn.sound { background: linear-gradient(180deg, #5a9cff, #3a6fe0); }
  .menu-ver { margin-top: 30px; color: #565d78; font-size: 12px; }
  #homeBtn {
    position: fixed; top: 12px; left: 12px; z-index: 6; width: 44px; height: 44px;
    border: 0; border-radius: 12px; background: rgba(255,255,255,.09); color: #fff;
    font-size: 20px; cursor: pointer; display: none;
  }
  #homeBtn.show { display: block; }
  #homeBtn:active { transform: scale(.94); }
</style>

<body>
<canvas id="game"></canvas>

<button id="homeBtn" aria-label="Меню">≡</button>

<div id="menu" class="hide">
  <div class="menu-inner">
    <div class="menu-logo">БОЛТИКИ</div>
    <div class="menu-sub">Сортировка Гаек</div>
    <button class="menu-btn play" id="btnPlay">▶ Играть</button>
    <button class="menu-btn sound" id="btnSound">🔊 Звук: вкл</button>

  </div>
</div>

<div id="bar">
  <button class="bbtn" id="btnUndo"><span id="undoLabel">↩ Отменить</span><small id="undoSub">3</small></button>
  <button class="bbtn" id="btnAddBolt"><span id="addLabel">🔩 +1 болт</span><small id="addSub">📺</small></button>
</div>

<div class="modal" id="winModal">
  <div class="panel">
    <h2 id="winTitle">Уровень пройден!</h2>
    <div class="sc" id="winLevel">1</div>
    <div class="bs" id="winMoves">Ходы: 0</div>
    <button class="btn btn-green" id="btnNext">Дальше →</button>
  </div>
</div>

<!-- sdk.js: только для Яндекс Игр -->
<script>
/* ===== Обёртка Yandex SDK (мок-режим локально) ===== */
const YSDK = (() => {
  let ysdk = null, player = null, readySent = false;
  function fireReady() {
    if (readySent) return;
    // флаг ставим только когда ready() реально ушёл: иначе преждевременный вызов
    // (например, из фолбэка по таймеру, пока SDK ещё не ответил) сжёг бы сигнал п.1.19
    try {
      if (ysdk && ysdk.features && ysdk.features.LoadingAPI) { ysdk.features.LoadingAPI.ready(); readySent = true; }
    } catch (e) { readySent = true; }
  }
  async function init() {
    if (typeof YaGames === 'undefined') return;
    try {
      ysdk = await Promise.race([YaGames.init(), new Promise((_, rej) => setTimeout(() => rej(0), 8000))]);
    } catch (e) { ysdk = null; }
    if (ysdk) {
      try { player = await Promise.race([ysdk.getPlayer(), new Promise(r => setTimeout(() => r(null), 3000))]); }
      catch (e) { player = null; }
    }
  }
  // п.4.7: пауза и глушение звука ровно на время показа рекламы
  function pauseForAd() {
    try { Sound.setMuted(true); } catch (e) {}
    try { ysdk && ysdk.features && ysdk.features.GameplayAPI && ysdk.features.GameplayAPI.stop(); } catch (e) {}
  }
  return {
    init,
    get lang() { try { return ysdk ? ysdk.environment.i18n.lang : (navigator.language || 'ru').slice(0, 2); } catch (e) { return 'ru'; } },
    gameReady: fireReady,
    gameplayStart() { ysdk?.features?.GameplayAPI?.start(); },
    gameplayStop() { ysdk?.features?.GameplayAPI?.stop(); },
    showInterstitial(onClose) {
      if (!ysdk) { onClose?.(); return; }
      this.gameplayStop();
      Sound.setMuted(true);
      ysdk.adv.showFullscreenAdv({ callbacks: {
        onOpen: () => { Sound.suspend(); pauseForAd(); },
        onClose: () => { Sound.resume(); Sound.setMuted(false); onClose?.(); },
        onError: () => { Sound.resume(); Sound.setMuted(false); onClose?.(); },
      }});
    },
    showRewarded(onReward, onClose) {
      if (!ysdk) { onReward?.(); onClose?.(true); return; }
      this.gameplayStop();
      Sound.setMuted(true);
      let ok = false;
      ysdk.adv.showRewardedVideo({ callbacks: {
        onOpen: () => { Sound.suspend(); pauseForAd(); },
        onRewarded: () => { ok = true; onReward?.(); },
        onClose: () => { Sound.resume(); Sound.setMuted(false); onClose?.(ok); },
        onError: () => { Sound.resume(); Sound.setMuted(false); onClose?.(false); },
      }});
    },
    async saveData(obj) {
      if (player) { try { await player.setData(obj); return; } catch (e) {} }
      try { localStorage.setItem('screws_save', JSON.stringify(obj)); } catch (e) {}
    },
    async loadData() {
      if (player) { try { const d = await player.getData(); if (d && Object.keys(d).length) return d; } catch (e) {} }
      try { return JSON.parse(localStorage.getItem('screws_save')) || {}; } catch (e) { return {}; }
    },
    setScore(score) {
      if (!ysdk) return;
      try { ysdk.leaderboards?.setScore?.('score', score)?.catch?.(() => {}); } catch (e) {}
    },
  };
})();

/* ===== Локализация ===== */
const I18N = {
  ru: { title: 'Болтики: Сортировка Гаек',
        level: 'Уровень', moves: 'Ходы', win: 'Уровень пройден!', next: 'Дальше →',
        undo: '↩ Отменить', addBolt: '🔩 +1 болт', forAd: '📺 за рекламу', left: 'осталось',
        play: 'Играть', cont: 'Продолжить', soundOn: '🔊 Звук: вкл', soundOff: '🔇 Звук: выкл',
        logo: 'БОЛТИКИ', logoSub: 'Сортировка Гаек', menu: 'Меню' },
  en: { title: 'Bolts: Color Sort',
        level: 'Level', moves: 'Moves', win: 'Level complete!', next: 'Next →',
        undo: '↩ Undo', addBolt: '🔩 +1 bolt', forAd: '📺 watch ad', left: 'left',
        play: 'Play', cont: 'Continue', soundOn: '🔊 Sound: on', soundOff: '🔇 Sound: off',
        logo: 'BOLTS', logoSub: 'Color Sort', menu: 'Menu' },
};
let T = I18N.ru, curLang = null;

/* ===== Звук (WebAudio, без файлов) ===== */
const Sound = (() => {
  let ctx = null, muted = false, enabled = true;
  function ac() { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); return ctx; }
  function beep(freq, dur, type = 'sine', vol = .18, delay = 0) {
    if (!enabled || muted || document.hidden) return;
    try {
      const c = ac(), o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, c.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(.001, c.currentTime + delay + dur);
      o.connect(g); g.connect(c.destination);
      o.start(c.currentTime + delay); o.stop(c.currentTime + delay + dur);
    } catch (e) {}
  }
  return {
    select() { beep(660, .05, 'triangle', .12); },
    clink(i) { beep(950 + (i % 4) * 130, .05, 'square', .09); beep(1900 + (i % 4) * 160, .08, 'sine', .05, .012); },
    deny() { beep(200, .1, 'triangle', .08); }, // мягкий тон: без sawtooth, чтобы не словить 6+ за «резкие звуки» (п. 2.7)
    undo() { beep(440, .06, 'triangle', .1); beep(330, .07, 'triangle', .1, .07); },
    win() { [523, 659, 784, 1047].forEach((f, i) => beep(f, .22, 'triangle', .16, i * .12)); },
    click() { beep(520, .05, 'square', .12); beep(800, .05, 'sine', .06, .02); },
    setMuted(m) { muted = m; },
    setEnabled(v) { enabled = v; },
    unlock() { try { ac().resume(); } catch (e) {} },
    suspend() { try { if (ctx) ctx.suspend(); } catch (e) {} },  // п.4.7
    resume() { try { if (ctx) ctx.resume(); } catch (e) {} },
  };
})();

/* ===== Чистая игровая логика (тестируется в Node без DOM) ===== */
/* LOGIC-START */
const CAP = 4;

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function levelParams(level) {
  const colors = Math.min(3 + Math.floor((level - 1) / 4), 8); // ур.1-4: 3 цвета ... ур.21+: 8
  const shuffle = Math.min(14 + colors * 3 + level * 2, 90);
  return { colors, empty: 2, shuffle };
}

function topRun(st) {
  if (!st.length) return { color: 0, count: 0 };
  const c = st[st.length - 1];
  let n = 1;
  while (n < st.length && st[st.length - 1 - n] === c) n++;
  return { color: c, count: n };
}

/* Сколько гаек переносится ходом from→to по правилам игры (0 = ход запрещён) */
function moveCount(stacks, from, to) {
  if (from === to) return 0;
  const a = stacks[from], b = stacks[to];
  if (!a || !b || !a.length) return 0;
  const free = CAP - b.length;
  if (free <= 0) return 0;
  const run = topRun(a);
  if (b.length && b[b.length - 1] !== run.color) return 0;
  return Math.min(run.count, free);
}

function applyMove(stacks, from, to) {
  const k = moveCount(stacks, from, to);
  for (let i = 0; i < k; i++) stacks[to].push(stacks[from].pop());
  return k;
}

function isSolved(stacks) {
  return stacks.every(st => !st.length || (st.length === CAP && st.every(v => v === st[0])));
}

/* Один ход обратной тасовки s→d(k), построенный так, что обратный ход d→s —
   легальный игровой ход, переносящий ровно k гаек:
   - k < длины верхней группы (низ группы остаётся, класть обратно можно),
     либо снимается весь болт целиком (класть обратно на пустой можно);
   - верх приёмника d не совпадает по цвету (иначе обратный ход унёс бы больше k). */
function reverseShuffleMove(stacks, rng, last) {
  const n = stacks.length;
  for (let attempt = 0; attempt < 80; attempt++) {
    const s = (rng() * n) | 0;
    const st = stacks[s];
    if (!st.length) continue;
    const run = topRun(st);
    const ks = [];
    for (let k = 1; k <= run.count; k++)
      if (k < run.count || st.length === run.count) ks.push(k);
    if (!ks.length) continue;
    const k = ks[(rng() * ks.length) | 0];
    const ds = [];
    for (let d = 0; d < n; d++) {
      if (d === s || CAP - stacks[d].length < k) continue;
      if (stacks[d].length && stacks[d][stacks[d].length - 1] === run.color) continue;
      if (last && s === last.d && d === last.s) continue; // не отменять предыдущий ход тасовки
      ds.push(d);
    }
    if (!ds.length) continue;
    const d = ds[(rng() * ds.length) | 0];
    for (let i = 0; i < k; i++) stacks[d].push(stacks[s].pop());
    return { s, d, k };
  }
  return null;
}

/* Генерация: собранное состояние + N обратных ходов ⇒ гарантированно решаемо.
   solution — легальные игровые ходы, приводящие к победе (для тестов). */
function generateLevel(level, rng) {
  const p = levelParams(level);
  let result = null;
  for (let tries = 0; tries < 30; tries++) {
    const stacks = [];
    for (let c = 1; c <= p.colors; c++) stacks.push([c, c, c, c]);
    for (let e = 0; e < p.empty; e++) stacks.push([]);
    const inv = [];
    let last = null;
    while (inv.length < p.shuffle) {
      const m = reverseShuffleMove(stacks, rng, last);
      if (!m) break;
      inv.push({ from: m.d, to: m.s, k: m.k });
      last = m;
    }
    result = { stacks, solution: inv.slice().reverse() };
    if (!isSolved(stacks) && inv.length >= 8) return result;
  }
  return result;
}
/* LOGIC-END */

/* ===== Константы ===== */
const COLORS = [
  null,
  ['#ff5a5a', '#c73535'], ['#ffa63d', '#d97e14'], ['#ffd54a', '#dbaa16'],
  ['#4cd964', '#2fa04a'], ['#40c8e0', '#1f9cb5'], ['#5a8cff', '#3a5fd0'],
  ['#b06aff', '#8a3fe0'], ['#ff6ac8', '#d03fa0'],
];

/* ===== Состояние ===== */
let level = 1, stacks = null;
let moveHistory = [];
let selected = null, selLift = 0;
let flights = [], particles = [];
let undosLeft = 3, extraBoltUsed = false;
let levelDone = false, celebrated = false, winShown = false;
let lastAdTime = 0;
let soundOn = true;
let inputEnabled = false;        // REQ-1.19: ввод открывается только после LoadingAPI.ready()

function startLevel() {
  const gen = generateLevel(level, Math.random);
  stacks = gen.stacks;
  moveHistory = []; selected = null; selLift = 0;
  flights = []; particles = [];
  undosLeft = 3; extraBoltUsed = false;
  levelDone = false; celebrated = false; winShown = false;
  hideWin();
  relayout();
  updateBar();
  YSDK.gameplayStart();
}

function startMove(from, to, k) {
  const src = layout.bolts[from], dst = layout.bolts[to];
  const lift = (1 - Math.pow(1 - selLift, 3)) * layout.nutH * 1.5;
  const sLen = stacks[from].length, dLen = stacks[to].length;
  for (let j = 0; j < k; j++) {
    const x0 = src.x, y0 = nutY(from, sLen - 1 - j) - lift;
    const x1 = dst.x, y1 = nutY(to, dLen + j);
    flights.push({
      color: stacks[from][sLen - 1 - j],
      x0, y0, x1, y1, bolt: to, idx: dLen + j,
      t: -j * .06, dur: .32,
      arc: Math.max(46, Math.abs(x1 - x0) * .2 + layout.nutH * 2),
      dir: x1 >= x0 ? 1 : -1,
    });
  }
  applyMove(stacks, from, to);
  moveHistory.push({ from, to, k });
  selected = null;
  if (isSolved(stacks)) levelDone = true;
  updateBar();
}

function doUndo() {
  if (!moveHistory.length) return;
  flights = []; selected = null;
  const m = moveHistory.pop();
  for (let i = 0; i < m.k; i++) stacks[m.from].push(stacks[m.to].pop());
  Sound.undo();
  updateBar();
}

function celebrate() {
  Sound.win();
  YSDK.gameplayStop();
  YSDK.setScore(level);
  spawnConfetti();
  setTimeout(showWin, 900);
}

function spawnConfetti() {
  const { w, h } = layout;
  for (let i = 0; i < 150; i++) {
    particles.push({
      x: Math.random() * w, y: -20 - Math.random() * h * .25,
      vx: (Math.random() - .5) * 140, vy: 80 + Math.random() * 180,
      rot: Math.random() * Math.PI * 2, vr: (Math.random() - .5) * 10,
      s: 5 + Math.random() * 6, t: 0, life: 2 + Math.random() * 1.4,
      color: COLORS[1 + ((Math.random() * (COLORS.length - 1)) | 0)][0],
    });
  }
}

/* ===== Сохранение ===== */
function saveProgress() { YSDK.saveData({ level, sound: soundOn }); }
async function loadGame() {
  const d = await YSDK.loadData();
  if (d.level) level = Math.max(1, d.level | 0);
  if (typeof d.sound === 'boolean') soundOn = d.sound;
}

/* ===== Модалка победы ===== */
const winModal = document.getElementById('winModal');
function showWin() {
  winShown = true;
  setLang(YSDK.lang); // сверяем язык перед показом модалки
  document.getElementById('winTitle').textContent = '🏆 ' + T.win;
  document.getElementById('winLevel').textContent = level;
  document.getElementById('winMoves').textContent = `${T.moves}: ${moveHistory.length}`;
  document.getElementById('btnNext').textContent = T.next;
  winModal.classList.add('show');
}
function hideWin() { winModal.classList.remove('show'); }

document.getElementById('btnNext').addEventListener('click', () => {
  Sound.click();
  hideWin();
  level++;
  saveProgress();
  const now = Date.now();
  if (now - lastAdTime > 90000) {
    lastAdTime = now;
    YSDK.showInterstitial(() => startLevel());
  } else startLevel();
});

/* ===== Нижняя панель ===== */
function updateBar() {
  document.getElementById('undoLabel').textContent = T.undo;
  document.getElementById('undoSub').textContent =
    undosLeft > 0 ? `${undosLeft} ${T.left}` : T.forAd;
  document.getElementById('btnUndo').disabled = !moveHistory.length || levelDone;
  const ab = document.getElementById('btnAddBolt');
  ab.style.display = extraBoltUsed ? 'none' : 'block';
  document.getElementById('addLabel').textContent = T.addBolt;
  document.getElementById('addSub').textContent = T.forAd;
}

document.getElementById('btnUndo').addEventListener('click', () => {
  Sound.unlock();
  if (!moveHistory.length || levelDone || winShown) return;
  if (undosLeft > 0) { undosLeft--; doUndo(); }
  else {
    YSDK.showRewarded(() => {
      undosLeft += 3;
      if (moveHistory.length) { undosLeft--; doUndo(); }
      updateBar();
    });
  }
});

document.getElementById('btnAddBolt').addEventListener('click', () => {
  Sound.unlock();
  if (extraBoltUsed || levelDone || winShown) return;
  YSDK.showRewarded(() => {
    extraBoltUsed = true;
    stacks.push([]);
    relayout();
    updateBar();
  });
});

/* ===== Рендер ===== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let layout = { w: 0, h: 0, bolts: [], nutW: 40, nutH: 18, tipH: 20, headH: 15, slotW: 60, rodW: 12 };

function relayout() {
  const w = window.innerWidth, h = window.innerHeight;
  const n = stacks ? stacks.length : 5;
  const landscape = w > h * 1.2;
  // в альбомной ориентации один ряд: болты крупнее и занимают всю ширину, а не узкую колонку по центру
  const rows = n <= 5 || (landscape && n <= 8) ? 1 : 2;
  const perRow = Math.ceil(n / rows);
  const topY = 96, botY = h - 92;
  const rowH = (botY - topY) / rows;
  // потолок слота тянется под высоту ряда: жёсткие 132 оставляли половину большого экрана пустой
  const slotCap = Math.max(132, Math.min(rowH * .42, 240));
  const slotW = Math.min((w - 16) / perRow, slotCap);
  const nutW = slotW * .76;
  const nutH = Math.max(10, Math.min(nutW * .44, (rowH - 40) / (CAP + 2.1)));
  const tipH = nutH * 1.05, headH = nutH * .8;
  const boltH = CAP * nutH + tipH + headH;
  const bolts = [];
  for (let i = 0; i < n; i++) {
    const row = i < perRow ? 0 : 1;
    const idx = row === 0 ? i : i - perRow;
    const cnt = row === 0 ? Math.min(perRow, n) : n - perRow;
    const x = (w - cnt * slotW) / 2 + idx * slotW + slotW / 2;
    const baseY = topY + rowH * row + (rowH + boltH) / 2;
    bolts.push({ x, baseY });
  }
  layout = { w, h, slotW, nutW, nutH, tipH, headH, boltH, bolts, rodW: Math.max(8, nutW * .26) };
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  relayout();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 60)); // п.1.6.1.3

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function nutY(bi, slot) {
  const b = layout.bolts[bi];
  return b.baseY - layout.headH - (slot + .5) * layout.nutH;
}

function nutPath(w2, h2) {
  const ex = w2 * .56;
  ctx.beginPath();
  ctx.moveTo(-w2, 0); ctx.lineTo(-ex, -h2); ctx.lineTo(ex, -h2);
  ctx.lineTo(w2, 0); ctx.lineTo(ex, h2); ctx.lineTo(-ex, h2);
  ctx.closePath();
}

function drawNutShape(x, y, w, h, c1, c2, alpha = 1, rot = 0) {
  const w2 = w / 2, h2 = h / 2, ex = w2 * .56, t = h * .22;
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  const g = ctx.createLinearGradient(0, -h2, 0, h2);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  nutPath(w2, h2);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1; ctx.stroke();
  // фаска сверху
  ctx.beginPath();
  ctx.moveTo(-w2, 0); ctx.lineTo(-ex, -h2); ctx.lineTo(ex, -h2); ctx.lineTo(w2, 0);
  ctx.lineTo(w2 - t, 0); ctx.lineTo(ex - t * .5, -h2 + t); ctx.lineTo(-ex + t * .5, -h2 + t); ctx.lineTo(-w2 + t, 0);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fill();
  // нижняя грань
  ctx.beginPath();
  ctx.moveTo(-w2, 0); ctx.lineTo(-ex, h2); ctx.lineTo(ex, h2); ctx.lineTo(w2, 0);
  ctx.lineTo(w2 - t, 0); ctx.lineTo(ex - t * .5, h2 - t); ctx.lineTo(-ex + t * .5, h2 - t); ctx.lineTo(-w2 + t, 0);
  ctx.closePath();
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fill();
  // блик
  ctx.globalAlpha = alpha * .5;
  ctx.beginPath();
  ctx.ellipse(-w2 * .35, -h2 * .3, w2 * .16, h2 * .32, -.4, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,.65)'; ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawNut(x, y, colorIdx, alpha = 1, rot = 0) {
  const [c1, c2] = COLORS[colorIdx];
  drawNutShape(x, y, layout.nutW, layout.nutH * .94, c1, c2, alpha, rot);
}

function drawBolt(bi) {
  const b = layout.bolts[bi];
  const { nutW, nutH, tipH, headH, rodW } = layout;
  const rodTop = b.baseY - headH - CAP * nutH - tipH;
  const rodH = b.baseY - rodTop - headH * .4;
  const rx = b.x - rodW / 2;
  // тень
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath();
  ctx.ellipse(b.x, b.baseY + headH * .55, nutW * .6, nutH * .26, 0, 0, Math.PI * 2);
  ctx.fill();
  // стержень (металл)
  const g = ctx.createLinearGradient(rx, 0, rx + rodW, 0);
  g.addColorStop(0, '#565d69'); g.addColorStop(.35, '#cbd4e0');
  g.addColorStop(.6, '#98a1af'); g.addColorStop(1, '#454b56');
  ctx.fillStyle = g;
  roundRect(rx, rodTop, rodW, rodH, rodW * .42);
  ctx.fill();
  // резьба штрихами
  ctx.save();
  ctx.beginPath();
  ctx.rect(rx + 1, rodTop + rodW * .55, rodW - 2, rodH - rodW * 1.1);
  ctx.clip();
  ctx.lineWidth = 1;
  for (let y = rodTop + 2; y < rodTop + rodH; y += 4) {
    ctx.strokeStyle = 'rgba(18,22,30,.4)';
    ctx.beginPath(); ctx.moveTo(rx, y + 2.5); ctx.lineTo(rx + rodW, y); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.22)';
    ctx.beginPath(); ctx.moveTo(rx, y + 3.5); ctx.lineTo(rx + rodW, y + 1); ctx.stroke();
  }
  ctx.restore();
  // головка болта снизу
  drawNutShape(b.x, b.baseY - headH / 2, nutW * 1.04, headH, '#a8b1c0', '#5f6773');
}

let lastT = 0;
function frame(t) {
  const dt = Math.min((t - lastT) / 1000, .05); lastT = t;
  const { w, h } = layout;

  // фон
  const bg = ctx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, '#242845'); bg.addColorStop(.55, '#171a2c'); bg.addColorStop(1, '#0d0e17');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

  if (stacks) {
    if (selected !== null) selLift = Math.min(1, selLift + dt * 8);

    // полёты: обновление
    for (let i = flights.length - 1; i >= 0; i--) {
      const f = flights[i]; f.t += dt;
      if (f.t >= f.dur) { Sound.clink(f.idx); flights.splice(i, 1); }
    }
    const hidden = new Set();
    for (const f of flights) hidden.add(f.bolt + ':' + f.idx);

    // болты и гайки
    for (let i = 0; i < stacks.length; i++) {
      drawBolt(i);
      const st = stacks[i];
      const run = selected === i ? topRun(st) : null;
      const lift = run ? (1 - Math.pow(1 - selLift, 3)) * layout.nutH * 1.5 : 0;
      for (let s = 0; s < st.length; s++) {
        if (hidden.has(i + ':' + s)) continue;
        const y = nutY(i, s) - (run && s >= st.length - run.count ? lift : 0);
        drawNut(layout.bolts[i].x, y, st[s]);
      }
    }

    // летящие гайки (дуга + вращение)
    for (const f of flights) {
      const p = Math.max(0, f.t) / f.dur;
      const e = p * p * (3 - 2 * p);
      const x = f.x0 + (f.x1 - f.x0) * e;
      const y = f.y0 + (f.y1 - f.y0) * e - Math.sin(e * Math.PI) * f.arc;
      drawNut(x, y, f.color, 1, Math.sin(e * Math.PI) * .5 * f.dir);
    }

    if (levelDone && !flights.length && !celebrated) { celebrated = true; celebrate(); }
  }

  // HUD: плашка уровня + ходы
  const pw = 190;
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  roundRect(w / 2 - pw / 2, 12, pw, 46, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff'; ctx.font = '800 22px sans-serif';
  ctx.fillText(`${T.level} ${level}`, w / 2, 43);
  ctx.fillStyle = '#9aa0c3'; ctx.font = '600 14px sans-serif';
  ctx.fillText(`${T.moves}: ${moveHistory.length}`, w / 2, 82);

  // конфетти
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.t += dt;
    if (p.t >= p.life) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 160 * dt; p.rot += p.vr * dt;
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, Math.min(1, (p.life - p.t) / (p.life * .3)));
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.s / 2, -p.s * .3, p.s, p.s * .6);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  requestAnimationFrame(frame);
}

/* ===== Ввод ===== */
function hitBolt(px, py) {
  const { bolts, slotW, nutH, tipH, headH } = layout;
  for (let i = 0; i < bolts.length; i++) {
    const b = bolts[i];
    const topY = b.baseY - headH - CAP * nutH - tipH - nutH * 2;
    if (Math.abs(px - b.x) <= slotW / 2 && py >= topY && py <= b.baseY + 14) return i;
  }
  return -1;
}

function handleTap(i) {
  if (selected === null) {
    if (stacks[i].length) { selected = i; selLift = 0; Sound.select(); }
    return;
  }
  if (selected === i) { selected = null; return; }
  const k = moveCount(stacks, selected, i);
  if (k > 0) startMove(selected, i, k);
  else { selected = null; Sound.deny(); }
}

canvas.addEventListener('pointerdown', e => {
  if (!inputEnabled) return;
  Sound.unlock();
  if (winShown || levelDone || !stacks) return;
  const i = hitBolt(e.clientX, e.clientY);
  if (i === -1) { selected = null; return; }
  handleTap(i);
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  const inMenu = menuEl.classList.contains('hide') === false;
  if (document.hidden) YSDK.gameplayStop();
  else if (!winShown && !levelDone && !inMenu) YSDK.gameplayStart();
});

/* ===== Главное меню ===== */
const menuEl = document.getElementById('menu');
const homeBtn = document.getElementById('homeBtn');
function updateSoundBtn() {
  document.getElementById('btnSound').textContent = soundOn ? T.soundOn : T.soundOff;
}
function applyI18nDom() {
  const logoEl = document.querySelector('.menu-logo');
  logoEl.textContent = T.logo;
  logoEl.style.fontSize = T.logo.length > 8 ? '40px' : '54px'; // "NUTS & BOLTS" не влезает в 54px
  document.querySelector('.menu-sub').textContent = T.logoSub;
  homeBtn.setAttribute('aria-label', T.menu);
  document.title = T.title;
  document.documentElement.lang = curLang || 'ru';
  updateSoundBtn();
  updateBar();
}
/* Единая точка смены языка: и тексты в DOM, и <title>, и <html lang> (п. 8.2.3) */
function setLang(lang) {
  const raw = String(lang || 'ru').slice(0, 2).toLowerCase();
  const code = I18N[raw] ? raw : 'en';
  if (code === curLang) return;
  curLang = code; T = I18N[code];
  applyI18nDom();
}
function showMenu() {
  setLang(YSDK.lang); // язык мог определиться позже старта или смениться на лету
  YSDK.gameplayStop();
  hideWin();
  document.getElementById('btnPlay').textContent =
    '▶ ' + (level > 1 ? `${T.cont} · ${T.level} ${level}` : T.play);
  updateSoundBtn();
  menuEl.classList.remove('hide');
  homeBtn.classList.remove('show');
}
function hideMenu() {
  menuEl.classList.add('hide');
  homeBtn.classList.add('show');
}
document.getElementById('btnPlay').addEventListener('click', () => {
  if (!inputEnabled) return;
  Sound.unlock(); Sound.click();
  hideMenu();
  startLevel();
});
document.getElementById('btnSound').addEventListener('click', () => {
  if (!inputEnabled) return;
  Sound.unlock();
  soundOn = !soundOn; Sound.setEnabled(soundOn); Sound.click();
  updateSoundBtn(); saveProgress();
});
homeBtn.addEventListener('click', () => { Sound.click(); showMenu(); });

/* ===== Запуск ===== */
(async function main() {
  resize();
  setLang(navigator.language || 'ru'); // предварительный язык — до ответа SDK
  await YSDK.init();
  setLang(YSDK.lang);                  // окончательный — из окружения платформы
  await loadGame();
  Sound.setEnabled(soundOn);
  applyI18nDom();                      // состояние загружено — обновляем панель и кнопку звука
  lastAdTime = Date.now(); // первые 90 сек после запуска — без interstitial
  // п. 1.19: сигнал готовности — после загрузки, ДО показа меню и старта геймплея
  // п.1.19: ready() уходит после первой отрисовки. Фолбэк по таймеру — на скрытой вкладке
  // requestAnimationFrame не тикает вообще, и без него игра осталась бы без ready() и с закрытым вводом.
  let bootDone = false;
  const finishBoot = () => {
    if (bootDone) return; bootDone = true;
    YSDK.gameReady();
    inputEnabled = true; // REQ-1.19: до ready() игра клики не принимает
    showMenu();
  };
  requestAnimationFrame(t => { lastT = t; frame(t); finishBoot(); });
  setTimeout(finishBoot, 1200);
})();
</script>
</body>
</html>
