  body.touch #vitals{bottom:auto;top:max(10px,env(safe-area-inset-top));width:min(230px,42vw);padding:7px 9px}
  body.touch #tracker{top:calc(max(10px,env(safe-area-inset-top)) + 96px)}
  body.touch .gauge{width:26px;height:26px}
  body.touch #prompt{bottom:auto;top:62%}
  body.touch #lockhint{display:none}
  body.touch .tb.top{display:grid}
  /* портрет: компас уже, трекер короче, кнопки сверху меньше */
  @media (max-aspect-ratio:1/1){
    #scr.scr-hero{align-items:flex-end;justify-content:center;padding-left:12px}
    /* узкий экран: полосы компаса нет (её заменяет миникарта), часы — под миникартой */
    #compass{left:auto;right:max(10px,env(safe-area-inset-right));transform:none;width:clamp(96px,calc(var(--s)*17),132px);
      top:calc(max(10px,env(safe-area-inset-top)) + clamp(96px,calc(var(--s)*17),132px) + 28px);height:18px}
    #compass::before,#cstrip,#cmark{display:none}
    #clock{position:static;transform:none;display:block;text-align:center}
    #vitals{width:46vw}
    #tracker div{font-size:11px}
    body.touch #tMap,body.touch #tPause,body.touch #tInv{top:calc(max(10px,env(safe-area-inset-top)) + clamp(96px,calc(var(--s)*17),132px) + 52px)}
    body.touch #tInv{right:max(10px,env(safe-area-inset-right))}
    body.touch #tMap{right:calc(max(10px,env(safe-area-inset-right)) + 50px)}
    body.touch #tPause{right:calc(max(10px,env(safe-area-inset-right)) + 100px)}
    body.touch #weap{top:calc(max(10px,env(safe-area-inset-top)) + clamp(96px,calc(var(--s)*17),132px) + 104px)}
    .eq{grid-template-columns:repeat(4,1fr)}
    .cols{grid-template-columns:1fr}
    .pane{max-height:32vh}
  }
  @media (max-height:460px){ .card{padding:10px} h2{font-size:17px} .pane{max-height:46vh} #tracker{display:none}
    /* телефон боком: кнопки занимают правый край по высоте, патроны — левее миникарты, под верхними кнопками */
    body.touch #weap{top:calc(max(10px,env(safe-area-inset-top)) + 52px);right:calc(max(10px,env(safe-area-inset-right)) + clamp(96px,calc(var(--s)*17),132px) + 16px)}
    body.touch #wa{font-size:18px} body.touch .gauges{margin-top:5px} }

  /* ===== v2.3: интерфейс в духе PS1 =====
     Пиксельные шрифты (OFL): Press Start 2P — заголовки и цифры, Pixelify Sans — текст.
     Окна как в играх 1997–2000: синевато-серый градиент, двойная рамка (светлая снаружи, тёмная внутри),
     жёсткая тень у текста, без скруглений и плавных анимаций; выбранный пункт меню — с курсором ▶. */
  @font-face{font-family:PS;src:url(assets/fonts/PressStart2P.ttf) format('truetype');font-display:block}
  @font-face{font-family:PX;src:url(assets/fonts/PixelifySans.ttf) format('truetype');font-display:block}
  :root{--box1:#2a3446;--box2:#10151f;--rim:#a9b4c2;--rim2:#05070b;--txt:#e4e2d8;--dim:#9aa0a6;--warm:#e8b04a;--bad:#e05a4a}
  html,body{font:400 16px/1.25 PX,monospace;-webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeSpeed}
  #ui *{text-shadow:2px 2px 0 #000}
  svg{shape-rendering:crispEdges}
  .ps1box,.panel,.card,.toast,#prompt,#crank,#usebar{
    background:linear-gradient(180deg,var(--box1) 0%,var(--box2) 100%)!important;
    border:2px solid var(--rim)!important;border-radius:3px!important;
    box-shadow:inset 0 0 0 2px var(--rim2),4px 4px 0 rgba(0,0,0,.55)!important;backdrop-filter:none!important}
  .scr-menu .card{background:none!important;border:0!important;box-shadow:none!important}
  h1{font-family:PS;font-size:clamp(20px,4.4vw,34px);line-height:1.35;letter-spacing:0;color:#d8d4c8;text-shadow:3px 3px 0 #000,0 0 18px rgba(160,30,20,.35)}
  h1::after{height:4px;width:96px;background:repeating-linear-gradient(90deg,var(--warm) 0 8px,transparent 8px 12px)}
  h2{font-family:PS;font-size:14px;line-height:1.5;letter-spacing:0;color:var(--warm)}
  .sub{font-size:16px}
  button{font:400 16px PX,monospace;border-radius:2px;background:linear-gradient(180deg,#323d50,#151b26);border:2px solid #7d8796;
    box-shadow:inset 0 0 0 1px #000;color:var(--txt);text-shadow:2px 2px 0 #000;transition:none}
  button:hover{background:linear-gradient(180deg,#3d4a62,#1b2230);border-color:#c8d0da}
  button.warm{background:linear-gradient(180deg,#8a5a1c,#4a2e0c);color:#ffe2a8;border-color:var(--warm)}
  .scr-menu .col button,.scr-pause .col button{font-size:18px;padding:10px 16px 10px 34px;position:relative;background:none!important;border:0!important;box-shadow:none!important;transition:none}
  .scr-menu .col button::before,.scr-pause .col button::before{content:'▶';position:absolute;left:8px;color:var(--warm);opacity:0}
  .scr-menu .col button:hover,.scr-pause .col button:hover{padding-left:34px;color:#fff}
  .scr-menu .col button:hover::before,.scr-pause .col button:hover::before,.scr-menu .col button.warm::before,.scr-pause .col button.warm::before{opacity:1}
  .scr-menu .col button.warm,.scr-pause .col button.warm{color:var(--warm)!important;font-weight:400}
  /* показатели: сегментные полосы */
  .bar{border-radius:0;background:#05070b;box-shadow:inset 0 0 0 1px #3a4250}
  .bar i,.bar u{border-radius:0}
  .bar::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,#05070b 9px 11px)}
  .bar.hp i{background:linear-gradient(180deg,#e0604c 0 50%,#a0302a 50%)}
  .bar.st i{background:linear-gradient(180deg,#c8d2da 0 50%,#8a96a0 50%)}
  .vrow em,#wa{font-family:PS;font-size:13px}
  #wa{font-size:22px;line-height:1.3}
  #wa small{font-family:PX;font-size:16px}
  #wn,#tracker b,.gauge,#clock,#mmd{font-family:PX}
  #wn{font-size:14px;letter-spacing:0}
  .gauge{border-radius:0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
  .gauge::before{border-radius:0}
  #slots div{border-radius:0;background:#05070b;box-shadow:inset 0 0 0 1px #3a4250}
  #slots div.on{background:#3a2a10;box-shadow:inset 0 0 0 2px var(--warm)}
  #tracker div{background:linear-gradient(90deg,rgba(16,21,31,.9),rgba(16,21,31,.4));border-left:4px solid var(--warm);border-radius:0;font-size:15px}
  #tracker b{font-size:13px;letter-spacing:0}
  #prompt{font-size:17px;padding:6px 12px 6px 6px}
  #prompt .alt{color:#cfd6dd}
  #tAlt{right:calc(var(--btn)*3.3);bottom:calc(var(--btn)*2.9)}
  #prompt kbd{font-family:PS;font-size:12px;border-radius:0;box-shadow:2px 2px 0 #000;padding:4px 7px}
  .toast{font-size:16px;padding:7px 14px}
  #cstrip i{font-family:PS;font-size:8px}#cstrip i.big{font-size:10px}
  /* после Esc: игра идёт, камера крутится и без захвата; первый клик захватывает мышь (и не стреляет) */
  #lockhint{top:auto;bottom:max(130px,18%);border-radius:0;background:rgba(10,13,16,.6);color:#cfd6dd;border:0;box-shadow:none;font-size:14px;padding:4px 10px;pointer-events:none!important}
  #cmark{border-radius:0;font-family:PX;font-size:13px}
  #mmc{border-radius:0;border:2px solid var(--rim);box-shadow:inset 0 0 0 2px #000,4px 4px 0 rgba(0,0,0,.5)}
  .tb{border-radius:4px;background:linear-gradient(180deg,rgba(50,61,80,.75),rgba(16,21,31,.75));border:2px solid #a9b4c2;box-shadow:inset 0 0 0 1px #000;font:400 11px PX}
  .tb.big{border-radius:50%}
  .cell{border-radius:0;font-size:14px}.cell small{font-family:PS;font-size:9px}
  .qline,.trow,.say{border-radius:0}
  #loading h1{font-size:28px}
  #loading .lbar{border-radius:0;height:10px;border:2px solid var(--rim);background:#05070b}
  #loading .lbar i{background:repeating-linear-gradient(90deg,var(--warm) 0 8px,#8a5a1c 8px 10px)}
  .hname{font-family:PS;font-size:13px;line-height:1.4}
  .herobio{font-size:15px;line-height:1.35;margin:6px 0 4px}
  .scr-hero .card{width:min(380px,100%)}
  #usebar{height:22px;width:260px}
  #usebar span{font-size:14px;line-height:22px}
  #usebar i{background:repeating-linear-gradient(90deg,var(--warm) 0 8px,#8a5a1c 8px 10px)}
  /* в машине: вместо оружия — спидометр, бензин и корпус */
  body.inveh #weap{display:none}
  #veh{background:linear-gradient(180deg,var(--box1),var(--box2));border:2px solid var(--rim);box-shadow:inset 0 0 0 2px var(--rim2),4px 4px 0 rgba(0,0,0,.55);padding:8px 12px;width:min(260px,44vw);left:auto;right:max(14px,env(safe-area-inset-right));transform:none}
  #veh b{font-family:PS;font-size:10px;color:var(--warm)}#veh span{font-family:PS;font-size:16px;margin:6px 0}
  #veh .bar{height:10px;margin-bottom:4px}#veh .bar span{font-size:11px;line-height:10px}
  /* диалог: реплики жителя, ответы героя справа */
  .dlog{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;min-height:90px}
  .dlog .say{margin:0;font-size:17px}
  .dlog .hero{margin:0;align-self:flex-end;color:var(--warm);font-size:16px;max-width:85%;text-align:right}
  .dlog p:not(:last-child){opacity:.6}
  .dopts button{text-align:left;font-size:16px}

  /* окна вещей, обыска, лавки, верстака, карты, заданий — тот же PS1: ячейки с фаской, моноширинные цифры */
  .cell{border-radius:0!important;border:2px solid #7d8796!important;box-shadow:inset 0 0 0 1px #000,inset 2px 2px 0 rgba(255,255,255,.12),inset -2px -2px 0 rgba(0,0,0,.35);
    background:linear-gradient(180deg,color-mix(in srgb,var(--k,#333) 85%,#fff 15%),var(--k,#333))!important;font:400 14px PX,monospace}
  .cell.empty{background:#0b0f15!important;border-color:#2a323d!important}
  .cell.sel{border-color:var(--warm)!important;box-shadow:inset 0 0 0 2px var(--warm)}
  .cell .lbl{font-size:12px}
  .eqs i{font:400 12px PX,monospace;color:var(--dim);text-transform:uppercase}
  .pane>b,.set>b{font-family:PS;font-size:10px;color:var(--warm);letter-spacing:0;margin-bottom:6px}
  .trow{background:linear-gradient(90deg,#1b2230,#10151f)!important;border:1px solid #3a4250;border-radius:0!important;font-size:15px}
  .trow small{font-size:13px}
  .trow button{font-size:14px}
  .qline{background:linear-gradient(90deg,#1b2230,#10151f)!important;border-left:4px solid var(--warm)!important;border-radius:0!important;font-size:15px}
  .qline b{font-family:PS;font-size:10px;color:var(--warm);margin-bottom:4px}
  canvas.map{border-radius:0!important;border:2px solid var(--rim);box-shadow:inset 0 0 0 2px #000;image-rendering:pixelated}
  .iname{font-size:16px}.iname small{font-size:13px}
  .set input[type=range]{accent-color:var(--warm);height:18px}
  .card h2+.sub,.card>.sub{color:var(--dim)}
  /* мини-игра запуска мотора */
  #crank{position:fixed;left:50%;top:30%;transform:translateX(-50%);width:min(420px,90vw);padding:10px 14px;text-align:center}
  #crank b{font-family:PS;font-size:13px;color:var(--warm);display:block;margin-bottom:8px}
  #crank .cbar{position:relative;height:22px;background:#05070b;box-shadow:inset 0 0 0 2px #3a4250;margin-bottom:8px}
  #crank .z{position:absolute;top:2px;bottom:2px;background:repeating-linear-gradient(90deg,#5fbf4a 0 6px,#3a8a2a 6px 8px)}
  #crank .n{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:#fff;box-shadow:2px 0 0 #000}
  #crank span{font-size:15px}
  /* ===== v2.8: рамки PSX Horror UI (heyheythere, CC BY 4.0, assets/ui): 9-slice через border-image,
     картинки крошечные (PS1 1x), растягиваем целым множителем без сглаживания ===== */
  .ps1box,.panel,.card,#crank,#veh{
    border:10px solid transparent!important;border-image:url(assets/ui/panel.png) 5 fill / 10px stretch!important;
    background:none!important;box-shadow:4px 4px 0 rgba(0,0,0,.55)!important;border-radius:0!important;image-rendering:pixelated}
  .card{border-width:15px!important;border-image-width:15px!important;padding:4px!important}
  .panel{border-width:6px!important;border-image-width:6px!important}
  .toast,#prompt{border:6px solid transparent!important;border-image:url(assets/ui/tooltip.png) 4 fill / 8px stretch!important;
    background:none!important;box-shadow:3px 3px 0 rgba(0,0,0,.55)!important;border-radius:0!important}
  .dlog .say{border:8px solid transparent;border-image:url(assets/ui/dialogue.png) 4 12 fill / 8px 24px stretch;padding:2px 4px}
  button{border:8px solid transparent!important;border-image:url(assets/ui/button_normal.png) 7 4 8 4 fill / 14px 8px 16px 8px stretch!important;
    background:none!important;box-shadow:none!important;border-radius:0!important;padding:2px 8px}
  button:hover{border-image-source:url(assets/ui/button_hover.png)!important}
  button:active{border-image-source:url(assets/ui/button_pressed.png)!important}
  /* тёплые кнопки (задания в диалоге, главное действие) остаются жёлтыми, как до рамок */
  button.warm{border:2px solid var(--warm)!important;border-image:none!important;background:linear-gradient(180deg,#8a5a1c,#4a2e0c)!important;color:#ffe2a8!important;box-shadow:inset 0 0 0 1px #000!important;padding:8px 14px}
  button.warm:hover{background:linear-gradient(180deg,#a06a22,#5a3810)!important}
  .scr-menu .col button,.scr-pause .col button{border-image:none!important;border:0!important}
  .cell.sel{border-image:url(assets/ui/slot_selected.png) 5 / 6px stretch!important}
  html,body,button{cursor:url(assets/ui/cursor.png),auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
