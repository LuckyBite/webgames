const YSDK = (() => {
  let ysdk = null, player = null, readySent = false;
  function fireReady() {
    if (readySent) return; readySent = true;
    try { ysdk && ysdk.features && ysdk.features.LoadingAPI && ysdk.features.LoadingAPI.ready(); } catch (e) {}
  }
  async function init() {
    if (typeof YaGames === 'undefined') return;
    try {
      ysdk = await Promise.race([YaGames.init(), new Promise((_, rej) => setTimeout(() => rej(0), 8000))]);
    } catch (e) { ysdk = null; }
    if (ysdk) {
      try { player = await Promise.race([ysdk.getPlayer(), new Promise(r => setTimeout(() => r(null), 3000))]); }
      catch (e) { player = null; }
    }
  }
  const unmute = () => Sound.setMuted(!!(state && state.muted));
  return {
    init,
    get lang() { try { return ysdk ? ysdk.environment.i18n.lang : (navigator.language || 'ru').slice(0, 2); } catch (e) { return 'ru'; } },
    gameReady: fireReady,
    gameplayStart() { ysdk?.features?.GameplayAPI?.start(); },
    gameplayStop() { ysdk?.features?.GameplayAPI?.stop(); },
    showInterstitial(onClose) {
      if (!ysdk) { onClose?.(); return; }
      this.gameplayStop(); Sound.setMuted(true);
      ysdk.adv.showFullscreenAdv({ callbacks: {
        onClose: () => { unmute(); onClose?.(); },
        onError: () => { unmute(); onClose?.(); },
      }});
    },
    showRewarded(onReward, onClose) {
      if (!ysdk) { onReward?.(); onClose?.(true); return; }
      this.gameplayStop(); Sound.setMuted(true);
      let ok = false;
      ysdk.adv.showRewardedVideo({ callbacks: {
        onRewarded: () => { ok = true; onReward?.(); },
        onClose: () => { unmute(); onClose?.(ok); },
        onError: () => { unmute(); onClose?.(false); },
      }});
    },
    async saveData(obj) {
      if (player) { try { await player.setData(obj); return; } catch (e) {} }
      try { localStorage.setItem('farm_save', JSON.stringify(obj)); } catch (e) {}
    },
    async loadData() {
      if (player) { try { const d = await player.getData(); if (d && Object.keys(d).length) return d; } catch (e) {} }
      try { return JSON.parse(localStorage.getItem('farm_save')) || {}; } catch (e) { return {}; }
    },
  };
})();

function mk(rows, pal) {
  const h = rows.length, w = rows[0].length;
  if (rows.some(r => r.length !== w)) console.error('bad sprite matrix', w, rows);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  rows.forEach((row, y) => { for (let i = 0; i < row.length; i++) { const col = pal[row[i]]; if (col) { x.fillStyle = col; x.fillRect(i, y, 1, 1); } } });
  return c;
}
// тёмный контур по краю силуэта — главный приём «дорогого» пиксель-арта
function outline(src, col = '#2b1d12') {
  const w = src.width + 2, h = src.height + 2;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.drawImage(src, 1, 1);
  const d = x.getImageData(0, 0, w, h), a = d.data;
  const solid = (i, j) => i >= 0 && j >= 0 && i < w && j < h && a[(j * w + i) * 4 + 3] > 0;
  x.fillStyle = col;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++)
    if (a[(j * w + i) * 4 + 3] === 0 && (solid(i + 1, j) || solid(i - 1, j) || solid(i, j + 1) || solid(i, j - 1)))
      x.fillRect(i, j, 1, 1);
  return c;
}

const FONT = {};   // символ → {cols: [битовые маски по колонкам], w}
const FONT_H = 7, SPACE_W = 3, LETTER_SP = 1;
function buildFont() {
  for (const ch in GLYPHS) {
    const rows = GLYPHS[ch].split('|');
    let lo = 5, hi = -1;
    for (let c = 0; c < 5; c++) for (let r = 0; r < FONT_H; r++)
      if (rows[r][c] === '#') { if (c < lo) lo = c; if (c > hi) hi = c; }
    if (hi < 0) { FONT[ch] = { rows: [], w: SPACE_W }; continue; }
    FONT[ch] = { rows: rows.map(r => r.slice(lo, hi + 1)), w: hi - lo + 1 };
  }
  FONT[' '] = { rows: [], w: SPACE_W };
}
function textW(s) {
  s = String(s).toUpperCase();
  let w = 0;
  for (const ch of s) { const g = FONT[ch] || FONT[' ']; w += g.w + LETTER_SP; }
  return Math.max(0, w - LETTER_SP);
}
function paintText(s, x, y, col) {
  ctx.fillStyle = col;
  let cx = x;
  for (const ch of String(s).toUpperCase()) {
    const g = FONT[ch] || FONT[' '];
    for (let r = 0; r < g.rows.length; r++) {
      const row = g.rows[r];
      for (let c = 0; c < row.length; c++) if (row[c] === '#') ctx.fillRect(cx + c, y + r, 1, 1);
    }
    cx += g.w + LETTER_SP;
  }
}
// текст с пиксельной тенью в один пиксель — читается на любом фоне
function text(s, x, y, col, shadow = '#2b1d12') {
  x = Math.round(x); y = Math.round(y);
  if (shadow) paintText(s, x + 1, y + 1, shadow);
  paintText(s, x, y, col);
}
const textC = (s, cx, y, col, sh) => text(s, Math.round(cx - textW(s) / 2), y, col, sh);
const textR = (s, rx, y, col, sh) => text(s, Math.round(rx - textW(s)), y, col, sh);
// обрезает строку под доступную ширину — длинные названия не наезжают на цену
function fitText(s, maxW) {
  s = String(s);
  if (textW(s) <= maxW) return s;
  while (s.length > 1 && textW(s + '.') > maxW) s = s.slice(0, -1);
  return s + '.';
}
function wrapText(s, maxW) {
  const words = String(s).split(' '), lines = [];
  let cur = '';
  for (const wd of words) {
    const t = cur ? cur + ' ' + wd : wd;
    if (textW(t) > maxW && cur) { lines.push(cur); cur = wd; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

/* ═══════════════ Состояние ═══════════════ */
let state = null;
const now = () => Date.now();

function newGame() {
  return {
    v: 3, coins: 20, level: 1, xp: 0,
    plots: Array.from({ length: START_PLOTS }, () => ({ c: -1, at: 0, wet: 0 })),
    animals: Array.from({ length: ANIMAL_SLOTS }, () => ({ id: -1, fedAt: 0 })),
    inv: {},                       // 'c0'..'c7' культуры, 'p0'..'p3' продукты
    up: { plot: 0, pen: 0, house: 0 },
    orders: [], daily: { day: -1, streak: 0 },
    tut: 0, muted: false, adsAt: 0, seenAt: now(),
  };
}
// номер календарного дня по локальному времени игрока
const dayIndex = t => Math.floor((t - new Date(t).getTimezoneOffset() * 60000) / 86400e3);
// эффекты улучшений
const growMs = c => Math.round(CROPS[c].grow * (1 - UPG.plot.step * state.up.plot));
const prodMs = a => Math.round(ANIMALS[a].time * (1 - UPG.pen.step * state.up.pen));
const sellCrop = i => Math.round(CROPS[i].sell * (1 + UPG.house.step * state.up.house));
const sellProd = i => Math.round(ANIMALS[i].sell * (1 + UPG.house.step * state.up.house));

const plotGrowing = (p, t) => p.c >= 0 && t - p.at < growMs(p.c);
const plotReady   = (p, t) => p.c >= 0 && t - p.at >= growMs(p.c);
const plotLeft    = (p, t) => Math.max(0, growMs(p.c) - (t - p.at));
const animReady   = (a, t) => a.id >= 0 && a.fedAt > 0 && t - a.fedAt >= prodMs(a.id);
const animBusy    = (a, t) => a.id >= 0 && a.fedAt > 0 && t - a.fedAt < prodMs(a.id);

function offlineSummary() {
  const t = now(), from = Math.max(state.seenAt, t - 24 * 3600e3);
  if (t - state.seenAt < MIN) return null;
  const ripe = {}, made = {};
  for (const p of state.plots) if (p.c >= 0) {
    const at = p.at + growMs(p.c);
    if (at > from && at <= t) ripe[p.c] = (ripe[p.c] || 0) + 1;
  }
  for (const a of state.animals) if (a.id >= 0 && a.fedAt > 0) {
    const at = a.fedAt + prodMs(a.id);
    if (at > from && at <= t) made[a.id] = (made[a.id] || 0) + 1;
  }
  if (!Object.keys(ripe).length && !Object.keys(made).length) return null;
  return { ripe, made };
}

let dirty = false, lastSaveAt = 0;
function save() { dirty = true; }
function flushSave() {
  if (!dirty) return;
  dirty = false; lastSaveAt = now();
  state.seenAt = now();
  YSDK.saveData(state);
}
setInterval(() => { if (dirty && now() - lastSaveAt > 5000) flushSave(); }, 1000);

async function loadGame() {
  const d = await YSDK.loadData();
  if (d && d.v >= 1 && d.v <= 3 && Array.isArray(d.plots)) {
    state = Object.assign(newGame(), d);
    state.v = 3;
    delete state.water;                                   // легаси: заряды лейки убраны
    state.up = Object.assign({ plot: 0, pen: 0, house: 0 }, d.up);
    state.daily = Object.assign({ day: -1, streak: 0 }, d.daily);
    if (!Array.isArray(state.orders)) state.orders = [];
  } else state = newGame();
  Sound.setMuted(!!state.muted);
}

/* ═══════════════ Раскладка ═══════════════ */
let L = {};
function mulberry32(seed) {                               // детерминированные декорации
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const hitR = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const devW = Math.round(window.innerWidth * dpr), devH = Math.round(window.innerHeight * dpr);
  const land = window.innerWidth > window.innerHeight * 1.15;
  const maxCols = land ? 6 : 4, maxRows = Math.ceil(MAX_PLOTS / maxCols);

  // масштаб считаем по максимальному размеру фермы — чтобы он не менялся по ходу игры
  const wantW = maxCols * TILE + 40;
  const wantH = HUD_H + 6 + 30 + 12 + maxRows * TILE + 10 + BAR_H + 6;
  S = Math.max(1, Math.min(Math.floor(devW / wantW), Math.floor(devH / wantH)));
  LW = Math.floor(devW / S); LH = Math.floor(devH / S);
  buf.width = LW; buf.height = LH;
  screenCv.width = LW * S; screenCv.height = LH * S;
  screenCv.style.width = (LW * S / dpr) + 'px';
  screenCv.style.height = (LH * S / dpr) + 'px';
  sctx.imageSmoothingEnabled = false; ctx.imageSmoothingEnabled = false;

  const penH = 26, penW = Math.min(LW - 8, ANIMAL_SLOTS * (TILE + 6) + 6);
  const penX = Math.floor((LW - penW) / 2), penY = HUD_H + 8;

  // поле растёт вместе с фермой: показываем купленные грядки и одну на покупку
  const shown = Math.min(MAX_PLOTS, (state ? state.plots.length : START_PLOTS) + 1);
  const cols = Math.max(2, Math.min(maxCols, Math.ceil(Math.sqrt(shown * (land ? 1.7 : 0.9)))));
  const rows = Math.ceil(shown / cols);
  const fw = cols * TILE, fh = rows * TILE;
  const fx = Math.floor((LW - fw) / 2);
  const top = penY + penH + 14, bot = LH - BAR_H - 8;
  const fy = top + Math.max(0, Math.floor((bot - top - fh) / 2));

  L = { land, cols, rows, fx, fy, fw, fh,
        pen: { x: penX, y: penY, w: penW, h: penH },
        plots: [], slots: [], decor: [], path: null,
        snd: { x: LW - 15, y: 3, w: 12, h: 12 } };
  for (let i = 0; i < MAX_PLOTS; i++)
    L.plots.push({ x: fx + (i % cols) * TILE, y: fy + ((i / cols) | 0) * TILE, w: TILE, h: TILE });
  const sw = TILE + 6;
  for (let i = 0; i < ANIMAL_SLOTS; i++)
    L.slots.push({ x: penX + Math.floor((penW - ANIMAL_SLOTS * sw) / 2) + i * sw, y: penY, w: sw, h: penH });

  if (fy - (penY + penH) >= 10)
    L.path = { x: fx + Math.floor(fw / 2) - 5, y: penY + penH - 2, w: 10, h: fy - (penY + penH) + 4 };

  /* ── декорации ── */
  const blocked = [
    { x: fx - 4, y: fy - 8, w: fw + 8, h: fh + 16 },
    { x: penX - 6, y: penY - 14, w: penW + 12, h: penH + 22 },
    { x: 0, y: 0, w: LW, h: HUD_H + 4 },
    { x: 0, y: LH - BAR_H - 4, w: LW, h: BAR_H + 4 },
  ];
  if (L.path) blocked.push(L.path);
  const place = (name, x, y) => {
    x = Math.round(x); y = Math.round(y);
    const r = { x, y, w: SW(name), h: SH(name) };
    if (x < 1 || y < HUD_H + 2 || r.x + r.w > LW - 1 || r.y + r.h > LH - BAR_H - 3) return false;
    if (blocked.some(b => hitR(r, b))) return false;
    L.decor.push({ n: name, x, y }); blocked.push({ x: x - 2, y: y - 2, w: r.w + 4, h: r.h + 4 });
    return true;
  };
  // дом фермера — главный объект двора, ступень задаёт спрайт
  const hs = 'house' + state.up.house;
  place(hs, penX - SW(hs) - 10, penY + penH - SH(hs) + 6) ||
    place(hs, penX + penW + 10, penY + penH - SH(hs) + 6) ||
    place(hs, 3, LH - BAR_H - SH(hs) - 4) ||
    place(hs, LW - SW(hs) - 3, LH - BAR_H - SH(hs) - 4);
  place('barn', penX + penW + 10, penY + penH - SH('barn') + 6) ||
    place('barn', penX - SW('barn') - 10, penY + penH - SH('barn') + 6) ||
    place('barn', LW - SW('barn') - 3, LH - BAR_H - SH('barn') - 4);
  place('well', penX + penW + 8, penY - 4) || place('well', penX - SW('well') - 8, penY - 4);
  place('hay', fx + fw + 8, fy + fh - SH('hay')) || place('hay', fx - SW('hay') - 8, fy + fh - SH('hay'));
  place('scarecrow', fx + fw + 6, fy - 6) || place('scarecrow', fx - SW('scarecrow') - 6, fy - 6);
  place('pond', 4, LH - BAR_H - SH('pond') - 6) || place('pond', LW - SW('pond') - 4, LH - BAR_H - SH('pond') - 6);
  place('crate', fx - SW('crate') - 6, fy + 2) || place('crate', fx + fw + 6, fy + 2);

  // зелень по опушке: чем ближе к центру двора, тем реже
  const rnd = mulberry32(0x5EED);
  const cxm = LW / 2, cym = (HUD_H + LH - BAR_H) / 2;
  const FILL = ['tree', 'tree2', 'tree', 'treeSm', 'treeSm', 'shrub', 'shrub', 'stump', 'stone'];
  for (let gy = HUD_H + 2; gy < LH - BAR_H - 10; gy += 13)
    for (let gx = 1; gx < LW - 8; gx += 13) {
      const x = gx + (rnd() - .5) * 8, y = gy + (rnd() - .5) * 7;
      const edge = Math.min(1, Math.max(Math.abs(x - cxm) / cxm, Math.abs(y - cym) / Math.max(1, cym - HUD_H)));
      const r = rnd(), dense = .16 + .5 * edge * edge;   // немного зелени и в середине двора
      if (r < dense) place(FILL[rnd() * FILL.length | 0], x, y);
      else if (r < dense + .14) place('flower' + (rnd() * 3 | 0), x, y);
      else if (r < dense + .17) place('stoneSm', x, y);
    }
  const hEnt = L.decor.find(d => d.n.startsWith('house'));      // куда фермер уходит ночевать
  L.home = hEnt ? { x: hEnt.x, y: hEnt.y, w: SW(hEnt.n), h: SH(hEnt.n) } : null;
  L.decor.sort((a, b) => (a.y + SH(a.n)) - (b.y + SH(b.n)));   // порядок по глубине
  farmerInit();
  buildVignette();
}

/* ═══════════════ Эффекты ═══════════════ */
let floats = [], drops = [], sparks = [], flys = [], pops = [];
function addFloat(kind, val, x, y, col) { floats.push({ kind, val, x: Math.round(x), y: Math.round(y), t: 0, col }); }
function addDrops(x, y) {
  for (let i = 0; i < 9; i++) drops.push({ x: Math.round(x + rndi(-7, 7)), y: Math.round(y + rndi(-4, 3)), v: 20 + rndi(0, 26), t: 0 });
}
function addSparks(x, y) {
  for (let i = 0; i < 9; i++) {
    const a = Math.random() * Math.PI * 2, sp = 14 + Math.random() * 34;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 18, t: 0, life: .35 + Math.random() * .25 });
  }
}
function addFly(name, x, y) { flys.push({ n: name, sx: x, sy: y, t: 0 }); }
function addPop(name, x, y) { pops.push({ n: name, x: Math.round(x), y: Math.round(y), t: 0 }); }
const rndi = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const SPARK_RAMP = ['#fff6dd', '#ffd54a', '#e08a1c'];

/* ═══════════════ Общие рисовалки ═══════════════ */
function groundPatch(x, y, w, h, seed) {   // вытоптанная земля с рваной кромкой
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  for (let py = y; py < y + h; py += TILE) for (let px = x; px < x + w; px += TILE) spr('dirt', px, py);
  ctx.restore();
  const r = mulberry32(seed);
  ctx.fillStyle = GRASS_COL;
  for (let i = 0; i < w; i++) {
    ctx.fillRect(x + i, y, 1, 1 + (r() * 2 | 0));
    const b = 1 + (r() * 2 | 0); ctx.fillRect(x + i, y + h - b, 1, b);
  }
  for (let j = 0; j < h; j++) {
    ctx.fillRect(x, y + j, 1 + (r() * 2 | 0), 1);
    const e = 1 + (r() * 2 | 0); ctx.fillRect(x + w - e, y + j, e, 1);
  }
}
function panel(x, y, w, h) {               // деревянная плашка HUD
  ctx.fillStyle = '#2b1d12'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#7a4a22'; ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  ctx.fillStyle = '#96602e'; ctx.fillRect(x + 1, y + 1, w - 2, 1);
  ctx.fillStyle = '#563518'; ctx.fillRect(x + 1, y + h - 2, w - 2, 1);
}
function meter(x, y, w, p, col) {
  p = Math.max(0, Math.min(1, p));
  ctx.fillStyle = '#2b1d12'; ctx.fillRect(x, y, w, 3);
  ctx.fillStyle = '#9a8a70'; ctx.fillRect(x + 1, y + 1, w - 2, 1);
  const fill = Math.round((w - 2) * p);
  if (fill > 0) { ctx.fillStyle = col; ctx.fillRect(x + 1, y + 1, fill, 1); }
}
function iconNum(icon, str, x, y, col, shadow) {
  spr(icon, x, y);
  text(str, x + SW(icon) + 2, y + Math.floor((SH(icon) - FONT_H) / 2), col,
       shadow === undefined ? '#2b1d12' : shadow);
}
const iconNumW = (icon, str) => SW(icon) + 2 + textW(str);
function fmtN(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function clockStr(ms) {                    // «2:30» — без слов, одинаково на любом языке
  const t = Math.max(0, Math.ceil(ms / 1000));
  if (t < 3600) return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  return Math.floor(t / 3600) + ':' + String(Math.floor(t % 3600 / 60)).padStart(2, '0');
}

/* рамка грядки: материал зависит от ступени улучшения */
const BED_FRAME = [
  { l: '#a8703a', d: '#8a5a2e' },   // 0 — грубое дерево
  { l: '#c9924e', d: '#a06a33' },   // 1 — струганая доска
  { l: '#b8bec6', d: '#8a9098' },   // 2 — камень
  { l: '#d9b06a', d: '#a8874a' },   // 3 — камень с деревом
  { l: '#ffd54a', d: '#c9971d' },   // 4 — с золотой отделкой
];
function drawBed(x, y, wet, tier) {
  const f = BED_FRAME[Math.min(tier, BED_FRAME.length - 1)];
  ctx.fillStyle = '#2b1d12';                                  // тёмный контур отделяет грядки друг от друга
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = f.d; ctx.fillRect(x + 1, y + 1, TILE - 2, TILE - 2);
  ctx.fillStyle = f.l; ctx.fillRect(x + 1, y + 1, TILE - 2, 1);
  ctx.fillStyle = '#2b1d12'; ctx.fillRect(x + 2, y + 3, TILE - 4, TILE - 5);
  ctx.save(); ctx.beginPath(); ctx.rect(x + 3, y + 4, TILE - 6, TILE - 7); ctx.clip();
  spr(wet ? 'bedWet' : 'bed', x, y);
  ctx.restore();
  if (tier >= 3) { ctx.fillStyle = f.l;                       // угловые столбики
    ctx.fillRect(x + 1, y + 1, 2, 2); ctx.fillRect(x + TILE - 3, y + 1, 2, 2);
    ctx.fillRect(x + 1, y + TILE - 3, 2, 2); ctx.fillRect(x + TILE - 3, y + TILE - 3, 2, 2); }
}

/* ═══════════════ Сутки: заводная ферма ═══════════════
   За DAY_MS солнце обходит двор целиком. Только картинка: тон кадра ступенями, поворот
   теней, ночью тёплые окна и светлячки над спелым. Рост и экономику не трогает. */
const DAY_MS = 8 * 60e3;
const dayPhase = tm => (tm % DAY_MS) / DAY_MS;              // 0 — рассвет, .25 — полдень, ~.7 — закат
const TONES = [                                              // [фаза, множитель цвета], между узлами линейно
  [0.00, [232, 184, 160]], [0.08, [255, 244, 224]], [0.22, [255, 255, 255]], [0.52, [255, 248, 228]],
  [0.64, [244, 176, 120]], [0.74, [186, 166, 214]], [0.82, [150, 160, 205]], [0.92, [142, 154, 200]],
  [1.00, [232, 184, 160]],
];
function dayTone(ph) {
  ph = Math.floor(ph * 96) / 96;                             // 96 ступеней: тон меняется щелчками, как часы
  for (let i = 1; i < TONES.length; i++) if (ph <= TONES[i][0]) {
    const [p0, a] = TONES[i - 1], [p1, b] = TONES[i], k = (ph - p0) / (p1 - p0);
    const c = a.map((v, j) => Math.round(v + (b[j] - v) * k));
    // почти белое не множим вовсе — лишний проход по кадру
    return c[0] > 250 && c[1] > 250 && c[2] > 250 ? null : 'rgb(' + c.join(',') + ')';
  }
  return null;
}
const isNight = ph => ph > .78 || ph < .04;
const sunShadow = ph => isNight(ph) ? null : Math.round(-Math.cos(ph * Math.PI * 2) * 3);  // утро — тень влево, вечер — вправо

function drawSway(nm, x, y) {                 // крона качается на 1 px, ствол стоит на месте
  const img = SPRITES[nm], cut = Math.floor(img.height * .6);
  const sx = Math.round(Math.sin(animT * .7 + x * .31) * 1.2);
  ctx.drawImage(img, 0, cut, img.width, img.height - cut, x, y + cut, img.width, img.height - cut);
  ctx.drawImage(img, 0, 0, img.width, cut, x + sx, y, img.width, cut);
}

let birds = null, nextBirds = 6;
function drawBirds(dt, ph, F4) {              // стайка из трёх раз в полминуты, днём
  if (!birds) {
    if (animT > nextBirds && !isNight(ph)) birds = { x: -14, y: HUD_H + 4 + rndi(0, 10), v: 22 + rndi(0, 10) };
    else return;
  }
  birds.x += birds.v * dt;
  if (birds.x > LW + 16) { birds = null; nextBirds = animT + 18 + rndi(0, 26); return; }
  const f = (F4 % 2) ? 'bird1' : 'bird0';
  spr(f, birds.x, birds.y); spr(f, birds.x - 7, birds.y + 3); spr(f, birds.x - 6, birds.y - 3);
}

function drawNight(ph, F8) {                  // поверх вечернего тона: окна и светлячки не темнеют
  if (!isNight(ph)) return;
  for (const d of L.decor) if (SPRITES[d.n + 'Win']) spr(d.n + 'Win', d.x, d.y);
  const tm = now();
  state.plots.forEach((p, i) => {
    if (p.c < 0 || !plotReady(p, tm)) return;
    const r = L.plots[i];
    for (let k = 0; k < 2; k++) {
      if ((F8 + i + k * 3) % 7 === 0) continue;                 // мигание вместо альфы
      const t = animT * (.7 + k * .3) + i * 1.7 + k * 2.1;
      ctx.fillStyle = k ? '#fff3b0' : '#ffd54a';
      ctx.fillRect(r.x + 3 + Math.round((Math.sin(t) + 1) * 5), r.y - 3 - Math.round((Math.cos(t * 1.3) + 1) * 3), 1, 1);
    }
  });
}

/* ═══════════════ Фермер ═══════════════
   Живёт по распорядку: находит дело, идёт к нему, отрабатывает, отдыхает. Ночью уходит
   в дом — тогда и горят окна.

   ВАЖНО: дела он делает ЖЕСТОМ, состояние фермы не меняется. Подходит к неполитой грядке,
   поливает на вид — лейка, капли, звук, — и уходит к следующей. Решено 2026-08-13: полив
   с настоящим эффектом ускорял рост примерно на треть тому, кто просто держит игру
   открытой, и сдвигал соотношение активного и казуального игрока из симулятора
   docs/superpowers/sim/pixel-farm-economy.js. Сбор урожая и кормёжка — тем более только
   игрока: это его деньги и инвентарь.

   Отсюда ротация: без эффекта грядка остаётся сухой, и без обхода по кругу фермер
   поливал бы первую вечно. */
let farmer = null;
const FARM_W = 14, FARM_H = 18, FARM_SPD = 15, FARM_WORK = 1.2;

function farmerBounds() {
  return { x0: 3, x1: Math.max(3, LW - FARM_W - 3), y0: L.pen.y + L.pen.h + 4,
           y1: Math.max(L.pen.y + L.pen.h + 4, LH - BAR_H - FARM_H - 4) };
}
/* Проходимость считаем по ногам, а не по шляпе: сверху фермер может заходить за крону.
   Препятствие у декорации — тоже только её основание, иначе он не пройдёт под ветками. */
function farmerFeet(x, y) { return { x: x + 2, y: y + FARM_H - 5, w: FARM_W - 4, h: 5 }; }
function farmerFree(x, y) {
  const f = farmerFeet(x, y);
  if (hitR(f, { x: L.fx - 2, y: L.fy - 2, w: L.fw + 4, h: L.fh + 4 })) return false;
  for (const d of L.decor) {
    const w = SW(d.n), h = SH(d.n);
    if (hitR(f, { x: d.x + 1, y: d.y + h - 5, w: w - 2, h: 5 })) return false;
  }
  return true;
}
/* Ходит он по прямой, поэтому мало проверить цель — надо проверить и дорогу до неё,
   иначе фермер срезает сквозь пень и выглядит как баг. */
function farmerPath(x0, y0, x1, y1) {
  const d = Math.hypot(x1 - x0, y1 - y0), steps = Math.max(1, Math.ceil(d / 2));   // 2 px: основание декорации всего 5 px, шаг в 4 px её проскакивал
  for (let i = 1; i <= steps; i++)
    if (!farmerFree(x0 + (x1 - x0) * i / steps, y0 + (y1 - y0) * i / steps)) return false;
  return true;
}
const farmerClampX = x => Math.max(farmerBounds().x0, Math.min(farmerBounds().x1, x));
const farmerClampY = y => Math.max(farmerBounds().y0, Math.min(farmerBounds().y1, y));

/* дело: первая растущая неполитая грядка. Стоим сбоку от неё, а не на ней */
function farmerJob(tm) {
  const total = state.plots.length;
  for (let k = 0; k < total; k++) {
    const i = (farmer.scan + k) % total;                     // обход по кругу, а не всегда с нуля
    const p = state.plots[i];
    if (p.c < 0 || p.wet || !plotGrowing(p, tm)) continue;
    const r = L.plots[i];
    const y = farmerClampY(r.y + TILE - FARM_H + 5);
    const near = farmer.x > r.x, sides = near ? [r.x + TILE - 5, r.x - FARM_W + 5]
                                              : [r.x - FARM_W + 5, r.x + TILE - 5];
    for (const sx of sides) {                                // подходим с той стороны, куда есть дорога
      const x = farmerClampX(sx);
      if (farmerFree(x, y) && farmerPath(farmer.x, farmer.y, x, y)) {
        farmer.scan = i + 1;
        return { kind: 'water', i, x, y };
      }
    }
  }
  return null;
}
function farmerHomeSpot() {
  return L.home ? { x: farmerClampX(L.home.x + Math.floor((L.home.w - FARM_W) / 2)),
                    y: farmerClampY(L.home.y + L.home.h - FARM_H + 4) } : null;
}
function farmerPick() {
  const tm = now();
  if (isNight(dayPhase(tm))) {
    const h = farmerHomeSpot();
    farmer.job = { kind: 'home' };
    farmer.tx = h ? h.x : farmer.x; farmer.ty = h ? h.y : farmer.y;
    return;
  }
  const j = farmerJob(tm);
  if (j) { farmer.job = j; farmer.tx = j.x; farmer.ty = j.y; return; }
  farmer.job = null;                                 // дел нет — обход двора
  const b = farmerBounds();
  for (let i = 0; i < 30; i++) {
    const x = b.x0 + Math.random() * (b.x1 - b.x0), y = b.y0 + Math.random() * (b.y1 - b.y0);
    if (farmerFree(x, y) && farmerPath(farmer.x, farmer.y, x, y)) { farmer.tx = x; farmer.ty = y; return; }
  }
  farmer.tx = farmer.x; farmer.ty = farmer.y;
}
function farmerInit() {
  const b = farmerBounds();
  farmer = { x: farmerClampX(L.fx - FARM_W - 6), y: b.y0, tx: 0, ty: 0,
             st: 'wait', wait: .4, workT: 0, job: null, flip: false, phase: 0, scan: 0 };
  if (!farmerFree(farmer.x, farmer.y))                       // на старте могли поставить в куст
    for (let i = 0; i < 60; i++) {
      const x = b.x0 + Math.random() * (b.x1 - b.x0), y = b.y0 + Math.random() * (b.y1 - b.y0);
      if (farmerFree(x, y)) { farmer.x = x; farmer.y = y; break; }
    }
  farmerPick();
}
/* конец работы: только капли и звук. Состояние грядки не трогаем — см. шапку блока */
function farmerFinish(tm) {
  const j = farmer.job;
  if (!j || j.kind !== 'water') return;
  const p = state.plots[j.i];
  if (!p || p.c < 0 || !plotGrowing(p, tm)) return;           // грядку успели собрать — лить не по чему
  const r = L.plots[j.i];
  Sound.water(); addDrops(r.x + TILE / 2, r.y + 6);
}
function farmerStep(dt) {
  const tm = now(), night = isNight(dayPhase(tm));

  if (farmer.st === 'home') {                        // спит; на рассвете выходит на порог
    if (night) return;
    const h = farmerHomeSpot();
    if (h) { farmer.x = h.x; farmer.y = h.y; }
    farmer.st = 'wait'; farmer.wait = .6; farmer.job = null;
    return;
  }
  farmer.x = farmerClampX(farmer.x); farmer.y = farmerClampY(farmer.y);

  if (farmer.st === 'work') {
    farmer.workT -= dt;
    if (farmer.workT <= 0) { farmerFinish(tm); farmer.st = 'wait'; farmer.wait = 2.5 + Math.random() * 2.5; }
    return;
  }
  if (farmer.st === 'wait') {
    farmer.wait -= dt;
    if (farmer.wait <= 0) { farmerPick(); farmer.st = 'go'; }
    return;
  }
  if (night && (!farmer.job || farmer.job.kind !== 'home')) { farmerPick(); return; }  // застал закат в пути

  const dx = farmer.tx - farmer.x, dy = farmer.ty - farmer.y, d = Math.hypot(dx, dy);
  if (d < 1.2) {
    const k = farmer.job && farmer.job.kind;
    if (k === 'home') { farmer.st = 'home'; return; }
    if (k === 'water') {
      const r = L.plots[farmer.job.i];
      farmer.flip = farmer.x + FARM_W / 2 > r.x + TILE / 2;   // разворачиваемся к грядке
      farmer.st = 'work'; farmer.workT = FARM_WORK; return;
    }
    farmer.st = 'wait'; farmer.wait = 1.2 + Math.random() * 2.4; return;
  }
  const k = FARM_SPD * dt / d;
  farmer.x += dx * k; farmer.y += dy * k;
  if (Math.abs(dx) > .5) farmer.flip = dx < 0;
  farmer.phase += dt * 6;
}
function drawFarmer(shx, F4) {
  const st = farmer.st;
  const nm = st === 'work' ? (F4 % 4 < 2 ? 'farmWk' : 'farmI0')
           : st === 'go'   ? (Math.floor(farmer.phase) % 2 ? 'farmW1' : 'farmW0')
           :                 (F4 % 8 < 4 ? 'farmI0' : 'farmI1');
  const x = Math.round(farmer.x), y = Math.round(farmer.y);
  if (shx !== null) spr('shadow', x + shx + 2, y + FARM_H - 4);
  if (farmer.flip) {                                 // зеркалим целым пикселем, без дробного масштаба
    ctx.save(); ctx.translate(x * 2 + FARM_W, 0); ctx.scale(-1, 1); spr(nm, x, y); ctx.restore();
  } else spr(nm, x, y);
  if (st === 'work' && farmer.job && farmer.job.kind === 'water')   // лейка в вытянутой руке
    spr('can', farmer.flip ? x - SW('can') + 4 : x + FARM_W - 4, y + 7);
}

let vign = null;
function buildVignette() {                   // затемнение углов дизерингом, печётся один раз на размер
  const c = document.createElement('canvas'); c.width = LW; c.height = LH;
  const x = c.getContext('2d'); x.fillStyle = '#161008';
  const B = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
  const cx = LW / 2, cy = LH / 2;
  for (let j = 0; j < LH; j++) for (let i = 0; i < LW; i++) {
    const r = Math.hypot((i - cx) / cx, (j - cy) / cy);
    const dark = Math.max(0, Math.min(1, (r - 1.02) / .45)) * .42;   // только самая кромка кадра
    if (dark * 16 > B[j & 3][i & 3]) x.fillRect(i, j, 1, 1);
  }
  vign = c;
}

/* ═══════════════ Рендер мира ═══════════════ */
const CLOUDS = [{ n: 'cshadow0', x0: 10, y: 34, v: 3.5 }, { n: 'cshadow1', x0: 130, y: 96, v: 2.6 },
                { n: 'cshadow2', x0: 250, y: 142, v: 4.4 }];
const BFLY = [{ x: 0, y: 0, a: .6, p: 0, sp: 9 }, { x: 0, y: 0, a: 2.4, p: 1, sp: 7 }];
let animT = 0;

function drawWorld(dt, tm, F4, F8) {
  const ph = dayPhase(tm), shx = sunShadow(ph);
  /* трава: вариант тайла по хэшу, чтобы не читалась регулярная решётка */
  for (let y = 0, ry = 0; y < LH; y += TILE, ry++)
    for (let x = 0, rx = 0; x < LW; x += TILE, rx++) {
      let h = (rx * 374761393 + ry * 668265263) | 0;
      h = (h ^ (h >> 13)) * 1274126177 | 0;
      const v = ((h ^ (h >> 16)) >>> 0) % 10;
      spr(v === 0 ? 'grass1' : v === 1 ? 'grass2' : 'grass0', x, y);
    }
  for (const c of CLOUDS)                                  // тени облаков ползут по земле
    spr(c.n, ((c.x0 + animT * c.v) % (LW + 60)) - SW(c.n) - 20, c.y);
  if (L.path) groundPatch(L.path.x, L.path.y, L.path.w, L.path.h, 0xA7C3);

  /* загон */
  const pen = L.pen;
  groundPatch(pen.x, pen.y, pen.w, pen.h, 0xD117);
  if (state.up.pen >= 4) spr('shelter', pen.x + Math.floor((pen.w - SW('shelter')) / 2), pen.y - 12);
  for (let x = pen.x; x < pen.x + pen.w; x += TILE) spr('fence', x, pen.y - 6);
  ctx.fillStyle = '#6b4423';
  ctx.fillRect(pen.x - 1, pen.y - 4, 2, 9); ctx.fillRect(pen.x + pen.w - 1, pen.y - 4, 2, 9);
  if (state.up.pen >= 1) spr('trough', pen.x + 2, pen.y + pen.h - SH('trough') - 1);
  if (state.up.pen >= 2) { for (let x = pen.x; x < pen.x + pen.w; x += TILE) spr('fence', x, pen.y + pen.h - 4); }
  if (state.up.pen >= 3) spr('trough', pen.x + pen.w - SW('trough') - 2, pen.y + pen.h - SH('trough') - 1);

  for (let i = 0; i < ANIMAL_SLOTS; i++) {
    const a = state.animals[i], s = L.slots[i];
    const ax = s.x + Math.floor((s.w - 14) / 2), ay = s.y + s.h - 16;
    if (a.id < 0) {
      const open = ANIMALS.some(an => an.unlock <= state.level);
      const mx = ax - 1, my = ay - 1, ms = 16;
      ctx.fillStyle = 'rgba(255,246,221,.12)'; ctx.fillRect(mx, my, ms, ms);
      ctx.fillStyle = 'rgba(255,246,221,.5)';
      for (let k = 0; k < ms; k += 2) { ctx.fillRect(mx + k, my, 1, 1); ctx.fillRect(mx + k, my + ms - 1, 1, 1); }
      for (let k = 0; k < ms; k += 2) { ctx.fillRect(mx, my + k, 1, 1); ctx.fillRect(mx + ms - 1, my + k, 1, 1); }
      spr(open ? 'plus' : 'lock', mx + 3, my + 3);
    } else {
      const ph = animT * .5 + i * 1.9;
      const step = Math.round(Math.sin(ph) * 3);             // шаг в целых пикселях
      const flip = Math.cos(ph) < 0;
      const hop = (F4 + i) % 6 === 0 ? -1 : 0;
      const x = ax + step;
      if (shx !== null) spr('shadow', x + 2 + shx, ay + 13);
      if (flip) { ctx.save(); ctx.translate(x * 2 + 16, 0); ctx.scale(-1, 1); }
      spr('anim' + a.id, x, ay + hop);
      if (flip) ctx.restore();
      const bub = ay - 11 + ((F4 + i) % 4 < 2 ? 0 : 1);
      if (animReady(a, tm)) spr('mp' + a.id, x + 3, bub);
      else if (animBusy(a, tm)) meter(x + 1, ay + 15, 14, (tm - a.fedAt) / prodMs(a.id), '#ffd54a');
      else spr(miniFeed(ANIMALS[a.id].feed), x + 3, bub);
    }
  }

  /* декорации */
  farmerStep(dt);
  let fDrawn = farmer.st === 'home', fBase = farmer.y + FARM_H;   // дома — не рисуем, горят окна
  for (const d of L.decor) {
    if (!fDrawn && fBase <= d.y + SH(d.n)) { drawFarmer(shx, F4); fDrawn = true; }
    if (shx !== null) {                                      // тень уходит вслед за солнцем, ночью её нет
      if (d.n === 'tree' || d.n === 'tree2') spr('shadowL', d.x + shx + Math.floor((SW(d.n) - SW('shadowL')) / 2), d.y + SH(d.n) - 5);
      else if (d.n === 'treeSm' || d.n.startsWith('house') || d.n === 'barn' || d.n === 'hay')
        spr('shadow', d.x + shx + Math.floor((SW(d.n) - SW('shadow')) / 2), d.y + SH(d.n) - 4);
    }
    if (d.n === 'tree' || d.n === 'tree2' || d.n === 'treeSm') drawSway(d.n, d.x, d.y);
    else spr(d.n, d.x, d.y);
  }
  if (!fDrawn) drawFarmer(shx, F4);
  drawBirds(dt, ph, F4);

  /* поле */
  const owned = state.plots.length;
  for (let i = 0; i < MAX_PLOTS && i <= owned; i++) {
    const r = L.plots[i];
    if (i < owned) {
      const p = state.plots[i];
      drawBed(r.x, r.y, p.c >= 0 && p.wet, state.up.plot);
      if (p.c >= 0) {
        const cs = 'crop' + p.c, cx = r.x + Math.floor((TILE - SW(cs)) / 2);
        if (plotReady(p, tm)) {
          spr('bush', r.x, r.y);
          spr(cs, cx, r.y + 1 + ((F4 + i) % 6 < 3 ? 0 : 1));
        } else {
          const pr = (tm - p.at) / growMs(p.c);
          spr(pr < .5 ? 'sprout' : 'bush', r.x, r.y);
          meter(r.x + 2, r.y + TILE - 5, TILE - 4, pr, '#7ecbe0');
        }
      }
    } else {                                                 // размеченное место под новую грядку
      ctx.fillStyle = '#6f8f3e'; ctx.fillRect(r.x + 1, r.y + 1, TILE - 2, TILE - 2);
      ctx.fillStyle = '#7d5a33';
      for (let k = 1; k < TILE - 1; k += 3) {
        ctx.fillRect(r.x + k, r.y + 1, 2, 1); ctx.fillRect(r.x + k, r.y + TILE - 2, 2, 1);
        ctx.fillRect(r.x + 1, r.y + k, 1, 2); ctx.fillRect(r.x + TILE - 2, r.y + k, 1, 2);
      }
      spr('plus', r.x + 3, r.y + 3);
      const price = fmtN(PLOT_PRICES[i]), pw = iconNumW('coin', price);
      const px = Math.max(1, Math.min(LW - pw - 2, r.x + Math.floor((TILE - pw) / 2))), py = r.y + TILE - 1;
      ctx.fillStyle = '#2b1d12'; ctx.fillRect(px - 2, py - 1, pw + 4, 12);
      ctx.fillStyle = '#4a3520'; ctx.fillRect(px - 1, py, pw + 2, 10);
      iconNum('coin', price, px, py, state.coins >= PLOT_PRICES[i] ? '#ffe066' : '#ff9a86');
    }
  }

  /* подсказка туториала */
  if (state.tut < 3) {
    let idx = state.tut === 0 ? state.plots.findIndex(p => p.c < 0) : state.plots.findIndex(p => p.c >= 0);
    if (idx < 0) idx = 0;
    const r = L.plots[idx];
    spr('arrow', r.x + 4, r.y - 11 + (F4 % 2 ? 0 : 1));
  }

  /* эффекты */
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i]; d.t += dt;
    if (d.t > .45) { drops.splice(i, 1); continue; }
    ctx.fillStyle = '#8fd8f0'; ctx.fillRect(Math.round(d.x), Math.round(d.y + d.v * d.t), 1, 2);
  }
  for (let i = pops.length - 1; i >= 0; i--) {               // всплывающий спрайт (лейка при поливе)
    const p = pops[i]; p.t += dt;
    if (p.t > .5) { pops.splice(i, 1); continue; }
    spr(p.n, p.x, p.y - Math.floor(p.t * 8));
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.t += dt;
    if (s.t >= s.life) { sparks.splice(i, 1); continue; }
    s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 90 * dt;
    ctx.fillStyle = SPARK_RAMP[Math.min(2, Math.floor(s.t / s.life * 3))];
    ctx.fillRect(Math.round(s.x), Math.round(s.y), 2, 2);
  }
  for (let i = flys.length - 1; i >= 0; i--) {
    const f = flys[i]; f.t += dt * 1.7;
    if (f.t >= 1) { flys.splice(i, 1); continue; }
    const e = f.t * f.t;
    spr(f.n, f.sx + (10 - f.sx) * e, f.sy + (LH - BAR_H / 2 - 4 - f.sy) * e);
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i]; f.t += dt;
    if (f.t >= 1.15) { floats.splice(i, 1); continue; }
    if (f.t > .8 && F8 % 2) continue;                        // мигание вместо альфы
    const y = f.y - Math.floor(f.t * 14);
    const w = f.kind ? iconNumW(f.kind, f.val) : textW(f.val);
    const x = Math.round(f.x - w / 2);
    if (f.kind) iconNum(f.kind, f.val, x, y, f.col); else text(f.val, x, y, f.col);
  }

  /* бабочки */
  for (const b of BFLY) {
    if (!b.x) { b.x = L.fx + 8 + b.p * 20; b.y = L.fy - 12; }
    b.a += (Math.sin(animT * .9 + b.p * 3) + Math.sin(animT * .27 + b.p)) * dt * 1.6;
    b.x += Math.cos(b.a) * b.sp * dt; b.y += Math.sin(b.a) * b.sp * dt * .7;
    if (b.x < 4) { b.x = 4; b.a = 0; } if (b.x > LW - 12) { b.x = LW - 12; b.a = Math.PI; }
    if (b.y < HUD_H + 4) { b.y = HUD_H + 4; b.a = 1.2; }
    if (b.y > LH - BAR_H - 12) { b.y = LH - BAR_H - 12; b.a = -1.2; }
    spr('bfly' + b.p + (F8 % 2 ? 'a' : 'b'), b.x, b.y);
  }
}

/* ═══════════════ Интерфейс: рисуется тем же буфером и тем же шрифтом ═══════════════
   Кликабельные области собираются каждый кадр в hits и разбираются в onTap.        */
let ui = null;                 // null | {kind:'seed'|'animals'|'market'|'shop'|'popup', ...}
let hits = [];
const pushHit = (x, y, w, h, fn) => hits.push({ x, y, w, h, fn });
let ditherPat = null;
function buildDither() {
  const dc = document.createElement('canvas'); dc.width = dc.height = 2;
  const dx = dc.getContext('2d');
  dx.fillStyle = '#161008'; dx.fillRect(0, 0, 1, 1); dx.fillRect(1, 1, 1, 1);
  ditherPat = ctx.createPattern(dc, 'repeat');
}
function openUI(o) { o.at = animT; ui = o; Sound.open(); YSDK.gameplayStop(); }
function closeUI() { if (ui) Sound.close(); ui = null; if (!document.hidden) YSDK.gameplayStart(); }

/* ── коробки и кнопки ── */
function box(x, y, w, h) {                       // пергаментная табличка
  ctx.fillStyle = '#2b1d12'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#cbab74'; ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  ctx.fillStyle = '#f2e0b4'; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
}
function slab(x, y, w, h, col, lo, hi) {         // выпуклая плашка/кнопка
  ctx.fillStyle = '#2b1d12'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = col; ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  ctx.fillStyle = hi; ctx.fillRect(x + 1, y + 1, w - 2, 1);
  ctx.fillStyle = lo; ctx.fillRect(x + 1, y + h - 2, w - 2, 1);
}
const BTN = {
  green: ['#3fae52', '#237a32', '#6ed67f'], blue: ['#4a86e8', '#2a56a8', '#7db0ff'],
  ad: ['#9053d8', '#63329c', '#b788ee'], wood: ['#7a4a22', '#563518', '#96602e'],
  grey: ['#6b6f76', '#4a4d52', '#93989f'],
};
let pressed = null;                                              // {x,y,w,h,at} — какую область нажали и когда
function button(x, y, w, h, label, kind, fn, icon) {
  const c = BTN[kind] || BTN.wood;
  const down = pressed && pressed.x === x && pressed.y === y && animT - pressed.at < .12;
  const oy = down ? 1 : 0;
  slab(x, y + oy, w, h - oy, down ? c[1] : c[0], c[1], down ? c[1] : c[2]);
  label = fitText(label, w - 6 - (icon ? SW(icon) + 2 : 0));    // подпись не вылезает за кнопку
  let tx = x + Math.floor((w - (textW(label) + (icon ? SW(icon) + 2 : 0))) / 2);
  if (icon) { spr(icon, tx, y + oy + Math.floor((h - SH(icon)) / 2)); tx += SW(icon) + 2; }
  text(label, tx, y + oy + Math.floor((h - FONT_H) / 2), fn ? '#ffffff' : '#c9c4b8');
  if (fn) pushHit(x, y, w, h, fn);
}

/* ── HUD ── */
let shownCoins = null;
function drawHUD() {
  if (shownCoins === null) shownCoins = state.coins;
  const dc = state.coins - shownCoins;                             // счётчик догоняет целыми шагами
  if (dc) shownCoins += Math.sign(dc) * Math.max(1, Math.ceil(Math.abs(dc) * .2));
  const coins = fmtN(shownCoins), cw = iconNumW('coin', coins) + 8;
  panel(2, 2, cw, 13); iconNum('coin', coins, 6, 4, '#ffe066');
  const lvl = String(state.level);
  const lw = Math.max(24, Math.min(46, L.snd.x - (cw + 5) - 3));   // не наезжаем на кнопку звука
  panel(cw + 5, 2, lw, 13);
  iconNum('star', lvl, cw + 9, 3, '#fff6dd');
  const bx = cw + 9 + 11 + textW(lvl) + 4;
  meter(bx, 6, Math.max(6, cw + 5 + lw - bx - 5), state.xp / xpNeed(state.level), '#5ddc6e');
  panel(L.snd.x, L.snd.y - 1, L.snd.w, L.snd.h);
  spr(state.muted ? 'spkOff' : 'spkOn', L.snd.x + 1, L.snd.y + 1);
  pushHit(L.snd.x, L.snd.y - 1, L.snd.w, L.snd.h, () => {
    state.muted = !state.muted; Sound.setMuted(state.muted); save();
  });
}

/* ── нижняя панель: инвентарь и кнопки ── */
function invEntries() {
  const out = [];
  CROPS.forEach((c, i) => { const n = state.inv['c' + i] || 0; if (n > 0) out.push({ key: 'c' + i, spr: 'crop' + i, name: T.crops[i], n, price: sellCrop(i) }); });
  ANIMALS.forEach((a, i) => { const n = state.inv['p' + i] || 0; if (n > 0) out.push({ key: 'p' + i, spr: 'prod' + i, name: T.products[i], n, price: sellProd(i) }); });
  return out;
}
function drawBar(tm) {
  const y = LH - BAR_H;
  ctx.fillStyle = '#2b1d12'; ctx.fillRect(0, y, LW, BAR_H);
  ctx.fillStyle = '#7a4a22'; ctx.fillRect(0, y + 2, LW, BAR_H - 2);
  for (let x = 0; x < LW; x += 22) { ctx.fillStyle = '#6b4020'; ctx.fillRect(x, y + 2, 1, BAR_H - 2); }
  ctx.fillStyle = '#96602e'; ctx.fillRect(0, y + 2, LW, 1);

  // кнопки справа
  const busy = state.plots.some(p => plotGrowing(p, tm)) || state.animals.some(a => animBusy(a, tm));
  // порядок важен: первая кнопка встаёт правее всех, а рынок нужен чаще прочего.
  // «Ускорить» приходит и уходит, поэтому стоит последней — постоянные кнопки не прыгают.
  const btns = [];
  btns.push(['basket', 'green', () => openUI({ kind: 'market' })]);
  btns.push(['scroll', state.orders.some(orderReady) ? 'green' : 'wood', () => openUI({ kind: 'orders' })]);
  btns.push(['hammer', 'wood', () => openUI({ kind: 'shop' })]);
  if (busy && state.tut >= 4) btns.push(['bolt', 'ad', () => YSDK.showRewarded(() => {
    const cut = 5 * MIN;
    for (const p of state.plots) if (p.c >= 0) p.at -= cut;
    for (const a of state.animals) if (a.id >= 0 && a.fedAt > 0) a.fedAt -= cut;
    save(); Sound.coins(2);
  }, () => {})]);
  let bx = LW - 2;
  const pad = LW < 160 ? 4 : 6;                                // на узком экране кнопки поджимаем
  for (const [icon, kind, fn] of btns) {
    const w = SW(icon) + pad; bx -= w + 2;
    const c = BTN[kind];
    slab(bx, y + 2, w, BAR_H - 4, c[0], c[1], c[2]);
    spr(icon, bx + Math.floor((w - SW(icon)) / 2), y + 2 + Math.floor((BAR_H - 4 - SH(icon)) / 2));
    pushHit(bx, y + 2, w, BAR_H - 4, fn);
  }
  if (state.tut === 3) {                                       // подсветка «Рынка»
    const p = LW - 2 - (SW('basket') + 8);
    ctx.fillStyle = (Math.floor(animT * 3) % 2) ? '#ffe066' : '#2b1d12';
    ctx.fillRect(p - 1, y + 1, SW('basket') + 8, 1); ctx.fillRect(p - 1, y + BAR_H - 2, SW('basket') + 8, 1);
  }

  // инвентарь слева. На узком экране убираем «×» и зазоры — иначе не влезает ни одной иконки
  const items = invEntries();
  const tight = LW < 160;
  let x = 3;
  for (let i = 0; i < items.length; i++) {
    const it = items[i], cnt = (tight ? '' : '×') + it.n;
    const w = SW(it.spr) + 1 + textW(cnt) + (tight ? 2 : 4);
    const rest = items.length - i, mark = '+' + rest, mw = textW(mark) + 3;
    // на широком экране резервируем место под счётчик остатка, на узком он съел бы саму иконку
    if (x + w + (!tight && rest > 1 ? mw : 0) > bx - 4) {
      if (!tight && x + mw <= bx - 2) text(mark, x + 1, y + 7, '#ffe066');
      break;
    }
    spr(it.spr, x, y + Math.floor((BAR_H - SH(it.spr)) / 2));
    text(cnt, x + SW(it.spr) + 1, y + 7, '#ffe066');
    x += w;
  }
  if (!items.length) text(fitText(T.empty, bx - 10), 4, y + 7, '#c9ab74');
}

/* ── туториал ── */
function drawTutorial() {
  if (state.tut >= 4) return;
  const maxW = Math.min(LW - 16, 180);
  const lines = wrapText(T.tut[state.tut], maxW - 8);
  const h = lines.length * 9 + 7, w = maxW;
  const x = Math.floor((LW - w) / 2), y = LH - BAR_H - h - 4;
  box(x, y, w, h);
  lines.forEach((l, i) => textC(l, x + w / 2, y + 4 + i * 9, '#4a3520', null));
}

/* ── каркас модального экрана ── */
function screenBox(titleStr, contentH, opts) {
  opts = opts || {};
  const onClose = opts.onClose || closeUI;
  ctx.fillStyle = ditherPat; ctx.fillRect(0, 0, LW, LH);
  const w = Math.min(LW - 6, 230);
  const h = Math.min(LH - 8, contentH + 20);
  const k = Math.min(3, Math.floor((animT - (ui && ui.at || 0)) / .035));   // выезд снизу за 4 кадра, целыми пикселями
  const x = Math.floor((LW - w) / 2), y = Math.floor((LH - h) / 2) + (3 - k) * 2;
  box(x, y, w, h);
  ctx.fillStyle = '#cbab74'; ctx.fillRect(x + 3, y + 13, w - 6, 1);
  const titleW = opts.noClose ? w - 10 : w - 36;               // у попапов крестика нет — заголовку больше места
  textC(fitText(titleStr, titleW), x + (opts.noClose ? w : w - 16) / 2, y + 4, '#4a3520', null);
  pushHit(0, 0, LW, LH, onClose);                              // тап мимо окна — закрыть
  if (!opts.noClose) {
    spr('close', x + w - 13, y + 3);                           // крестик добавлен позже → он выше фона
    pushHit(x + w - 15, y + 1, 14, 14, onClose);
  }
  return { x, y, w, h, cx: x + 3, cy: y + 16, cw: w - 6, ch: h - 19 };
}
// сетка строк: колонки подбираются так, чтобы всё поместилось без прокрутки
function gridCols(n, availH, rowH) {
  let cols = 1;
  while (Math.ceil(n / cols) * rowH > availH && cols < 4) cols++;
  return cols;
}

/* ═══════════════ Игровая логика ═══════════════ */
function gainXP(v, x, y) {
  state.xp += v;
  if (x !== undefined) addFloat('star', '+' + v, x, y, '#a8e8ff');
  let leveled = false;
  while (state.xp >= xpNeed(state.level)) { state.xp -= xpNeed(state.level); state.level++; leveled = true; }
  if (leveled) {
    Sound.levelUp();
    const chips = [];
    CROPS.forEach((c, i) => { if (c.unlock === state.level) chips.push({ spr: 'crop' + i, n: 1 }); });
    ANIMALS.forEach((a, i) => { if (a.unlock === state.level) chips.push({ spr: 'anim' + i, n: 1 }); });
    showPopup({ title: T.levelUp, lines: [T.level + ' ' + state.level].concat(chips.length ? [T.unlocked] : []),
                chips, onClose: maybeInterstitial });
  }
  save();
}
/* ═══════════════ Заказы ═══════════════
   Постоянная цель помимо уровней и денежный сток для тех, кто уже всё улучшил. */
const priceOfKey = k => k[0] === 'c' ? sellCrop(+k.slice(1)) : sellProd(+k.slice(1));
const sprOfKey = k => (k[0] === 'c' ? 'crop' : 'prod') + k.slice(1);
const nameOfKey = k => k[0] === 'c' ? T.crops[+k.slice(1)] : T.products[+k.slice(1)];

function makeOrder() {
  const pool = [];
  CROPS.forEach((c, i) => { if (c.unlock <= state.level) pool.push('c' + i); });
  // продукты просим только у тех животных, которые у игрока есть — иначе заказ невыполним
  ANIMALS.forEach((a, i) => { if (state.animals.some(x => x.id === i)) pool.push('p' + i); });
  if (!pool.length) return null;
  const want = 1 + Math.floor(Math.random() * Math.min(3, pool.length));
  const items = [], used = {};
  for (let k = 0; k < want * 3 && items.length < want; k++) {
    const key = pool[Math.floor(Math.random() * pool.length)];
    if (used[key]) continue;
    used[key] = 1;
    // продукты животных идут медленно (до получаса за штуку) — их просим меньше, чем урожая
    items.push({ key, n: key[0] === 'p' ? 1 + Math.floor(Math.random() * 2) : 2 + Math.floor(Math.random() * 4) });
  }
  const value = items.reduce((s, it) => s + it.n * priceOfKey(it.key), 0);
  return { items, coins: Math.round(value * ORDER_REWARD_MULT), xp: Math.max(5, Math.round(value / 12)) };
}
function refillOrders() {
  if (!Array.isArray(state.orders)) state.orders = [];
  while (state.orders.length < ORDER_SLOTS) {
    const o = makeOrder();
    if (!o) break;
    state.orders.push(o);
  }
}
const orderReady = o => o.items.every(it => (state.inv[it.key] || 0) >= it.n);
function completeOrder(idx) {
  const o = state.orders[idx];
  if (!o || !orderReady(o)) { Sound.error(); return; }
  o.items.forEach(it => {
    state.inv[it.key] -= it.n;
    if (state.inv[it.key] <= 0) delete state.inv[it.key];
  });
  state.coins += o.coins;
  Sound.coins(4);
  state.orders.splice(idx, 1);
  refillOrders();
  gainXP(o.xp);
  save();
}

/* ═══════════════ Ежедневный бонус ═══════════════ */
function checkDaily() {
  const d = dayIndex(now());
  if (state.daily.day === d) return;                       // сегодня уже получал
  state.daily.streak = state.daily.day === d - 1 ? Math.min(DAILY_MAX_STREAK, state.daily.streak + 1) : 1;
  state.daily.day = d;
  const reward = Math.round(40 * state.level * (1 + .25 * (state.daily.streak - 1)));
  state.coins += reward;
  save();
  showPopup({ title: T.dailyTitle, lines: [T.dailyStreak(state.daily.streak)],
              sections: [{ chips: [{ spr: 'coin', label: '+' + fmtN(reward) }] }],
              adX2: reward });                             // кнопка «×2 за рекламу»
}

let bootAt = 0;
function maybeInterstitial() {
  const t = now();
  if (t - state.adsAt < 3 * MIN || t - bootAt < MIN) return;
  state.adsAt = t; save();
  YSDK.showInterstitial(() => {});
}
function setTut(step) { state.tut = step; save(); }

function onWorldTap(lx, ly) {
  const tm = now();
  const inside = r => lx >= r.x && lx < r.x + r.w && ly >= r.y && ly < r.y + r.h;

  for (let i = 0; i < ANIMAL_SLOTS; i++) {
    const s = L.slots[i];
    if (!inside(s)) continue;
    const a = state.animals[i], cx = s.x + s.w / 2;
    if (a.id < 0) {
      if (ANIMALS.some(an => an.unlock <= state.level)) openUI({ kind: 'animals', slot: i });
      else { Sound.error(); addFloat('lock', String(ANIMALS[0].unlock), cx, s.y, '#ff9a86'); }
      return;
    }
    const spec = ANIMALS[a.id];
    if (animReady(a, tm)) {
      a.fedAt = 0;
      state.inv['p' + a.id] = (state.inv['p' + a.id] || 0) + 1;
      Sound.collect(); addSparks(cx, s.y + s.h / 2); addFly('prod' + a.id, cx - 7, s.y + 6);
      gainXP(spec.xp, cx, s.y);
      save();
    } else if (animBusy(a, tm)) {
      addFloat('clk', clockStr(prodMs(a.id) - (tm - a.fedAt)), cx, s.y, '#fff6dd');
    } else {
      const key = 'c' + spec.feed;
      if ((state.inv[key] || 0) > 0) {
        state.inv[key]--; if (!state.inv[key]) delete state.inv[key];
        a.fedAt = tm; Sound.feed(); save();
      } else { Sound.error(); addFloat(miniFeed(spec.feed), '×', cx, s.y, '#ff9a86'); }
    }
    return;
  }

  const owned = state.plots.length;
  for (let i = 0; i < Math.min(owned + 1, MAX_PLOTS); i++) {
    const r = L.plots[i];
    if (!inside(r)) continue;
    const cx = r.x + TILE / 2;
    if (i === owned) {
      const price = PLOT_PRICES[i];
      if (state.coins >= price) {
        state.coins -= price;
        state.plots.push({ c: -1, at: 0, wet: 0 });
        Sound.buy(); addSparks(cx, r.y + TILE / 2); save();
        resize();                                            // поле подросло — пересобрать сцену
      } else { Sound.error(); addFloat('coin', fmtN(price), cx, r.y, '#ff9a86'); }
      return;
    }
    const p = state.plots[i];
    if (p.c < 0) { openUI({ kind: 'seed', plot: i }); return; }
    if (plotReady(p, tm)) {
      const c = CROPS[p.c];
      state.inv['c' + p.c] = (state.inv['c' + p.c] || 0) + 1;
      addSparks(cx, r.y + TILE / 2); addFly('crop' + p.c, r.x, r.y);
      Sound.harvest();
      gainXP(c.xp, cx, r.y);
      state.plots[i] = { c: -1, at: 0, wet: 0 };
      save();
      if (state.tut === 1 || state.tut === 2) setTut(3);
      return;
    }
    // растёт: полив бесплатный, но один раз на грядку. Никаких цифр — только лейка и капли
    if (!p.wet) {
      p.at -= plotLeft(p, tm) * WATER_CUT; p.wet = 1;
      Sound.water(); addDrops(cx, r.y + 6); addPop('can', cx - 7, r.y - 10);
      save();
      if (state.tut === 1) setTut(2);
    }
    return;
  }
}

});

/* ═══════════════ Кадр ═══════════════ */
let lastT = 0, readySignaled = false;
function frame(t) {
  const dt = Math.min((t - lastT) / 1000, .05); lastT = t; animT += dt;
  if (LW < 1 || LH < 1) { requestAnimationFrame(frame); return; }   // окно ещё не имеет размера
  const tm = now(), F4 = Math.floor(animT * 4), F8 = Math.floor(animT * 8);
  drawWorld(dt, tm, F4, F8);
  const ph = dayPhase(tm), tone = dayTone(ph);
  if (tone) {                                                  // тон дня одним умножением на весь мир
    ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = tone; ctx.fillRect(0, 0, LW, LH);
    ctx.globalCompositeOperation = 'source-over';
  }
  drawNight(ph, F8);
  if (vign) ctx.drawImage(vign, 0, 0);
  drawUI(tm);
  sctx.drawImage(buf, 0, 0, LW, LH, 0, 0, LW * S, LH * S);    // вывод целым множителем
  if (!readySignaled) { readySignaled = true; YSDK.gameReady(); YSDK.gameplayStart(); }
  requestAnimationFrame(frame);
}

/* ═══════════════ Запуск ═══════════════ */
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { dirty = true; flushSave(); YSDK.gameplayStop(); }
  else if (!ui) YSDK.gameplayStart();
});

(async function main() {
  await YSDK.init();
  T = I18N[YSDK.lang === 'ru' ? 'ru' : 'en'] || I18N.en;
  document.title = T.title;
  buildFont(); buildSprites();
  await loadGame();
  bootAt = now();
  resize();
  buildDither();

  refillOrders();

  const sum = offlineSummary();
  if (sum) {
    const sections = [];
    const ripe = Object.entries(sum.ripe), made = Object.entries(sum.made);
    let value = 0;
    if (ripe.length) {
      sections.push({ label: T.ripened, chips: ripe.map(([i, n]) => ({ spr: 'crop' + i, n })) });
      ripe.forEach(([i, n]) => { value += sellCrop(+i) * n; });
    }
    if (made.length) {
      sections.push({ label: T.producedT, chips: made.map(([i, n]) => ({ spr: 'prod' + i, n })) });
      made.forEach(([i, n]) => { value += sellProd(+i) * n; });
    }
    // «×2 за рекламу» — удваиваем ценность того, что вызрело без игрока
    showPopup({ title: T.offline, sections, adX2: value > 0 ? value : 0 });
  }
  checkDaily();
  requestAnimationFrame(t => { lastT = t; frame(t); });
})();

</script>
