const YSDK = (() => {
  let ysdk = null, player = null, readySent = false;
  function fireReady() {
    if (readySent) return; readySent = true;
    try { ysdk && ysdk.features && ysdk.features.LoadingAPI && ysdk.features.LoadingAPI.ready(); } catch (e) {}
  }
  async function init() {
    if (typeof YaGames === 'undefined') return;
    try { ysdk = await Promise.race([YaGames.init(), new Promise((_, rej) => setTimeout(() => rej(0), 8000))]); }
    catch (e) { ysdk = null; }
    if (ysdk) {
      try { player = await Promise.race([ysdk.getPlayer(), new Promise(r => setTimeout(() => r(null), 3000))]); }
      catch (e) { player = null; }
    }
  }
  const unmute = () => Sound.setMuted(!!(st && st.muted));
  return {
    init,
    get lang() { try { return ysdk ? ysdk.environment.i18n.lang : (navigator.language || 'ru').slice(0, 2); } catch (e) { return 'ru'; } },
    gameReady: fireReady,
    gameplayStart() { try { ysdk && ysdk.features && ysdk.features.GameplayAPI && ysdk.features.GameplayAPI.start(); } catch (e) {} },
    gameplayStop() { try { ysdk && ysdk.features && ysdk.features.GameplayAPI && ysdk.features.GameplayAPI.stop(); } catch (e) {} },
    showInterstitial(onClose) {
      if (!ysdk) { onClose && onClose(); return; }
      this.gameplayStop(); Sound.setMuted(true);
      ysdk.adv.showFullscreenAdv({ callbacks: {
        onClose: () => { unmute(); onClose && onClose(); },
        onError: () => { unmute(); onClose && onClose(); },
      }});
    },
    showRewarded(onReward, onClose) {
      if (!ysdk) { onReward && onReward(); onClose && onClose(true); return; }
      this.gameplayStop(); Sound.setMuted(true);
      let ok = false;
      ysdk.adv.showRewardedVideo({ callbacks: {
        onRewarded: () => { ok = true; onReward && onReward(); },
        onClose: () => { unmute(); onClose && onClose(ok); },
        onError: () => { unmute(); onClose && onClose(false); },
      }});
    },
    async saveData(obj) {
      if (player) { try { await player.setData(obj); return; } catch (e) {} }
      try { localStorage.setItem('dwarves_save', JSON.stringify(obj)); } catch (e) {}
    },
    async loadData() {
      if (player) { try { const d = await player.getData(); if (d && Object.keys(d).length) return d; } catch (e) {} }
      try { return JSON.parse(localStorage.getItem('dwarves_save')) || {}; } catch (e) { return {}; }
    },
  };
})();

/* ═══════════════ Звук ═══════════════ */
const Sound = (() => {
  let actx = null, muted = false;
  function ac() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; }
  function beep(freq, dur, type = 'square', vol = .12, delay = 0) {
    if (muted || document.hidden) return;
    try {
      const c = ac(), o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, c.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(.001, c.currentTime + delay + dur);
      o.connect(g); g.connect(c.destination);
      o.start(c.currentTime + delay); o.stop(c.currentTime + delay + dur);
    } catch (e) {}
  }
  return {
    hit() { beep(150 + Math.random() * 40, .05, 'square', .07); },
    crack() { beep(220, .07, 'square', .1); beep(160, .09, 'square', .08, .05); },
    breakthrough() { [180, 240, 320].forEach((f, i) => beep(f, .13, 'square', .12, i * .07)); },
    stratum() { [262, 330, 392, 523].forEach((f, i) => beep(f, .18, 'square', .12, i * .1)); },
    build() { beep(300, .08, 'square', .11); beep(450, .1, 'square', .1, .08); },
    coins(n) { for (let i = 0; i < Math.min(n, 4); i++) beep(880 + i * 150, .06, 'square', .09, i * .05); },
    gem() { [700, 950, 1250].forEach((f, i) => beep(f, .1, 'sine', .1, i * .06)); },
    upgrade() { [440, 660, 880].forEach((f, i) => beep(f, .12, 'square', .12, i * .08)); },
    error() { beep(140, .12, 'sawtooth', .06); },
    setMuted(m) { muted = m; },
    unlock() { try { ac().resume(); } catch (e) {} },
  };
})();

/* ── формулы ── */
const E = n => Math.pow(CFG.GROWTH, n - 1);
const pickTier = n => { let t = 0; CFG.PICK_YARUS.forEach((y, i) => { if (n >= y) t = i; }); return t; };
const pickStart = n => CFG.PICK_YARUS[pickTier(n)];
const pickDmg = t => CFG.PICK_D0 * Math.pow(CFG.PICK_STEP, t);
const rowsOf = n => { let r = 1; for (const [y, v] of CFG.ROWS_AT) if (n >= y) r = v; return r; };
const slotsOf = n => rowsOf(n) === 1 ? 0 : 2;
const expFace = n => Math.max(2, Math.min(CFG.BLOCK_W, Math.round(2 + n / 8)));
const expLevel = n => Math.min(CFG.LEVEL_MAX, 1 + n / 15);
const levelM = l => 1 + CFG.LEVEL_STEP * (l - 1);
const dwarfM = n => CFG.UPTIME_FULL * levelM(expLevel(n)) * 1.03;
const REF = n => pickDmg(pickTier(n)) * (1 + CFG.FACE_W * (expFace(n) - 1) * dwarfM(n));
function Tcurve(n) {
  const k = Math.min(1, (n - 1) / (CFG.T_RAMP - 1));
  const base = CFG.T_START + (CFG.T_PLATO - CFG.T_START) * k;
  const drift = 1 + (CFG.T_DRIFT - 1) * Math.max(0, n - CFG.T_RAMP) / 90;
  return base * drift * Math.pow(CFG.GROWTH, (n - pickStart(n)) * CFG.PILA_POW);
}
const hpOf = n => REF(n) * Tcurve(n) * rowsOf(n) / 3;
const blockHpBase = n => hpOf(n) / (CFG.BLOCK_W * rowsOf(n));
const stoneOf = n => CFG.STONE0 * E(n);
const goldRate = n => CFG.GOLD0 * E(n);
const orePrice = oi => {
  const s = STRATA.find(x => x.ore === oi);
  const mid = Math.round((s.from + (STRATA[STRATA.indexOf(s) + 1] ? STRATA[STRATA.indexOf(s) + 1].from - 1 : s.from + 30)) / 2);
  return goldRate(mid) / (CFG.ORE_RATE * 2);
};

function blockType(y, row, col) {
  const s = stratum(y), r = hash(y * 9973 + row * 331 + col * 17 + 7);

  if (r < 0.20) return 'cave';
  if (s.ore > 0 && r < 0.46) return 'vein';
  return 'rock';
}

function mk(rows, pal) {
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  rows.forEach((row, y) => { for (let i = 0; i < row.length; i++) { const col = pal[row[i]]; if (col) { x.fillStyle = col; x.fillRect(i, y, 1, 1); } } });
  return c;
}
function outline(src, col = '#1a1220') {
  const w = src.width + 2, h = src.height + 2;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.drawImage(src, 1, 1);
  const d = x.getImageData(0, 0, w, h), a = d.data;
  const solid = (i, j) => i >= 0 && j >= 0 && i < w && j < h && a[(j * w + i) * 4 + 3] > 0;
  x.fillStyle = col;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++)
    if (a[(j * w + i) * 4 + 3] === 0 && (solid(i + 1, j) || solid(i - 1, j) || solid(i, j + 1) || solid(i, j - 1)))
      x.fillRect(i, j, 1, 1);
  return c;
}

/* ═══════════════ Правила выбора дела ═══════════════ */
// Сколько дварфов колония держит в забое. Половина города, как заложено в
// симуляторе: без этого правила при девяти штреках в забое оставалось двое,
// и глубина упиралась в один тап игрока.
const wantDiggers = () => Math.max(CFG.MIN_DIGGERS, Math.min(CFG.BLOCK_W, Math.ceil(st.dwarves.length / 2)));
const busyIn = (kind, y, slot) => st.dwarves.filter(d => d.task && d.task.kind === kind && d.task.y === y && d.task.slot === slot).length;

   перебор шёл по ключам, поэтому тридцать штреков забирали всех, а ферма с
   пивоварней стояли пустыми: эль нулевой, настроение у всех ноль, вся колония
   работала на ×0,7 и никто об этом не знал. */
function roomNeedingHands() {
  let best = null, bv = -Infinity;
  for (const o of roomList()) {
    const def = roomDef(o.r.t);
    if (!def.hands) continue;
    if (busyIn('room', o.y, o.slot) >= def.hands) continue;
    if (o.r.t === 'brew' && st.mush < 1) continue;
    if (o.r.t === 'smelt' && !st.ore.some(v => v >= 1)) continue;
    let score;
    if (o.r.t === 'farm') score = st.mush < 40 ? 300 : 40;
    else if (o.r.t === 'brew') score = st.ale < 25 ? 320 : 50;
    else if (o.r.t === 'smelt') score = 140;
    else score = 100 + o.y * 0.5;            // из штреков — глубокий доходнее
    if (score > bv) { bv = score; best = o; }
  }
  return best;
}
function freeBlock() {
  let best = -1, bv = -Infinity;
  for (let c = 0; c < CFG.BLOCK_W; c++) {
    if (st.blocks[c] <= 0) continue;
    const crowd = st.dwarves.filter(d => d.task && d.task.kind === 'dig' && d.task.col === c).length;
    const score = (st.prio[c] ? 1000 : 0) - crowd * 100 + st.blocks[c] / 1e6;
    if (score > bv) { bv = score; best = c; }
  }
  return best;
}
function chooseTask(d) {
  if (d.fat >= CFG.FAT_SLEEP && has('bed')) {
    const r = roomsOf('bed').find(x => busyIn('sleep', x.y, x.slot) < 2 * x.r.lvl) || roomsOf('bed')[0];
    return { kind: 'sleep', bed: freeBedCount() > 0, y: r.y, slot: r.slot, ofs: busyIn('sleep', r.y, r.slot) * 13 };
  }
  if (d.fat >= CFG.FAT_SLEEP) return { kind: 'sleep', bed: false, y: Math.max(1, st.yarus - 1), slot: 0 };
  if (d.mood <= CFG.MOOD_DRINK && st.ale >= 1 && has('tavern')) {
    const t = roomsOf('tavern')[0];
    return { kind: 'drink', y: t.y, slot: t.slot, t: 0, ofs: busyIn('drink', t.y, t.slot) * 11 };
  }
  const prio = st.prio.findIndex((p, c) => p && st.blocks[c] > 0);
  if (prio >= 0) return { kind: 'dig', col: prio };
  const diggers = st.dwarves.filter(x => x.task && x.task.kind === 'dig').length;
  if (diggers >= wantDiggers()) {
    const r = roomNeedingHands();
    if (r) return { kind: 'room', y: r.y, slot: r.slot, rt: r.r.t, ofs: busyIn('room', r.y, r.slot) * 12 };
  }
  const c = freeBlock();
  return c >= 0 ? { kind: 'dig', col: c } : { kind: 'idle' };
}
function taskSpot(t) {
  if (t.kind === 'dig') return { x: colX(t.col), y: rowY() - 9 };
  if (t.kind === 'idle') return { x: L.shaftX + 8, y: rowY() - 9 };
  const ofs = t.ofs || 0;
  const hx = t.slot === 0 ? L.x0 + 6 + ofs : L.shaftX + L.shaft + L.hall - 17 - ofs;
  return { x: hx, y: worldTop(t.y) + yarusH(t.y) - 11 };

  const d = drag.y - toBuf(e).y;
  if (Math.abs(d) > 3) {
    drag.moved = 1; press = null;
    if (ui) scrollY = Math.max(0, drag.scroll + d);
    else { st.camFree = true; st.camY = Math.max(camMin(), Math.min(camMax(), Math.round(drag.cam + d))); }
  }
});
const endDrag = () => { drag = null; press = null; };
screenCv.addEventListener('pointerup', endDrag);
screenCv.addEventListener('pointercancel', endDrag);
screenCv.addEventListener('contextmenu', e => e.preventDefault());

function openUI(o) { ui = o; scrollY = 0; YSDK.gameplayStop(); }
function closeUI() { ui = null; if (!document.hidden) YSDK.gameplayStart(); if (popupQ.length) openUI(popupQ.shift()); }
function showPopup(o) { o.kind = 'popup'; if (ui) popupQ.push(o); else openUI(o); }
function say(s) { hint = s; hintT = 2.5; }

/* ═══════════════ Копание ═══════════════ */
function addChips(sx, sy, n) {
  for (let i = 0; i < n; i++) chips.push({ x: sx, y: sy, vx: (Math.random() - .5) * 60, vy: -25 - Math.random() * 40, t: 0 });
}
function capped(v) { return Math.min(v, storeCap()); }
function damage(col, amount, sx, sy) {
  if (st.blocks[col] === undefined || st.blocks[col] <= 0) return;
  st.blocks[col] -= amount;
  if (st.blocks[col] > 0) return;
  st.blocks[col] = 0; st.prio[col] = false;
  const type = st.types[col], si = stratumIdx(st.yarus), s = STRATA[si];
  if (type === 'vein' && s.ore > 0) {
    const got = CFG.ORE_RATE * 260;
    st.ore[s.ore] = capped(st.ore[s.ore] + got);
    floats.push({ s: '+' + fmt(got), ic: 'iOre', x: sx, y: sy, t: 0, col: s.oreCol });
    Sound.coins(2);
  } else if (type === 'crystal') {
    const g = 2 + Math.floor(rnd() * 2);
    st.gems += g;
    floats.push({ s: '+' + g, ic: 'iGem', x: sx, y: sy, t: 0, col: '#7fd8e8' });
    Sound.gem();
  } else Sound.crack();
  addChips(sx, sy, 8);
  shake = Math.max(shake, 3);
  st.dwarves.forEach(d => { if (d.task && d.task.kind === 'dig' && d.task.col === col) d.task = null; });
  if (st.blocks.every(v => v <= 0)) rowDone();
  dirty = true;
}
function rowDone() {
  st.row++;
  if (st.row >= rowsOf(st.yarus)) {
    const got = stoneOf(st.yarus);
    st.stone = capped(st.stone + got);
    floats.push({ s: '+' + fmt(got), ic: 'iStone', x: L.shaftX + L.shaft / 2, y: worldTop(st.yarus) + 8, t: 0, col: '#e8dcc8' });
    const before = stratumIdx(st.yarus);
    st.yarus++; st.row = 0;
    st.deepest = Math.max(st.deepest, st.yarus);
    if (stratumIdx(st.yarus) !== before) {
      shake = 10; Sound.stratum();
      say(T.newStratum + ': ' + T.strata[stratumIdx(st.yarus)]);
      tryInterstitial();
    } else { shake = 6; Sound.breakthrough(); }
    if (st.tut === 1) nextTut();
  }
  newRow();
}
function tapDamage(col, sx, sy) {
  const mult = st.rage > 0 ? CFG.RAGE_MULT : 1;
  damage(col, pickDmg(st.pick) * gearM() * mult, sx, sy);
  Sound.hit();
  if (st.tut === 0) nextTut();
}

/* ═══════════════ Постройка и апгрейды ═══════════════ */
function availableRooms(y) {
  return ROOMDEF.filter(d => st.deepest >= d.at && (d.t !== 'mine' || stratum(y).ore > 0)
    && (d.t !== 'tavern' || !has('tavern')) && (d.t !== 'forge' || !has('forge')));
}
function doBuild(t, y, slot) {
  const cost = roomCost(t, y);
  if (st.stone < cost) { Sound.error(); return false; }
  st.stone -= cost;
  st.rooms[y + ':' + slot] = { t, lvl: 1 };
  Sound.build(); dirty = true;
  st.dwarves.forEach(d => { if (d.task && (d.task.kind === 'dig' || d.task.kind === 'idle')) d.task = null; });
  if (st.tut === 2) nextTut();
  return true;
}
function doUpgradeRoom(o) {
  if (o.r.lvl >= CFG.ROOM_LVL_MAX) return;
  const cost = roomLvlCost(o.y, o.r.lvl);
  if (st.stone < cost) { Sound.error(); return; }
  st.stone -= cost; o.r.lvl++; Sound.upgrade(); dirty = true;
}
const pickCost = () => CFG.C_PICK * E(CFG.PICK_YARUS[Math.min(st.pick + 1, CFG.PICK_YARUS.length - 1)]);
const canPick = () => st.pick < pickTier(st.deepest);
const gearCost = () => CFG.C_GEAR * E(st.deepest) * Math.pow(CFG.GEAR_COST_STEP, st.gear);
const cartCost = () => CFG.C_CART * E(st.deepest) * Math.pow(CFG.CART_COST_STEP, st.cart);

/* ═══════════════ Караван и контракты ═══════════════ */
const ORE_NAMES = () => T.ores;
function stockValue() {
  let v = 0;
  for (let i = 1; i <= 5; i++) { v += st.ore[i] * orePrice(i); v += st.ingot[i] * orePrice(i) * CFG.INGOT_MULT; }
  return v;
}
function sellAll(mult) {
  const v = stockValue();
  if (v <= 0) { Sound.error(); return; }
  st.gold += v * mult;
  for (let i = 1; i <= 5; i++) { st.ore[i] = 0; st.ingot[i] = 0; }
  Sound.coins(4); dirty = true;
  st.caravanT = CFG.CARAVAN_EVERY;
  if (st.tut === 4) nextTut();
  tryInterstitial();
}
function makeContract() {
  const items = [];
  const avail = [];
  for (let i = 1; i <= 5; i++) if (stratumIdx(st.deepest) >= i) avail.push({ kind: 'ore', i });
  if (has('smelt')) for (let i = 1; i <= 5; i++) if (stratumIdx(st.deepest) >= i) avail.push({ kind: 'ingot', i });
  if (has('brew')) avail.push({ kind: 'ale' });
  if (!avail.length) avail.push({ kind: 'ore', i: 1 });
  const n = 1 + Math.floor(rnd() * 2);
  for (let k = 0; k < n; k++) {
    const a = avail[Math.floor(rnd() * avail.length)];
    const base = a.kind === 'ale' ? 6 : a.kind === 'ingot' ? 4 : 12;
    items.push(Object.assign({ q: Math.max(1, Math.round(base * (0.6 + rnd()))) }, a));
  }
  let val = 0;
  items.forEach(it => {
    val += it.kind === 'ale' ? it.q * goldRate(st.deepest) * 8
      : it.kind === 'ingot' ? it.q * orePrice(it.i) * CFG.INGOT_MULT : it.q * orePrice(it.i);
  });
  return { items, gold: val * 1.6, gems: 1 + Math.floor(rnd() * 2) };
}
function refillContracts() { while (st.contracts.length < 3) st.contracts.push(makeContract()); }
function canDeliver(c) {
  return c.items.every(it => it.kind === 'ale' ? st.ale >= it.q : it.kind === 'ingot' ? st.ingot[it.i] >= it.q : st.ore[it.i] >= it.q);
}
function deliver(idx) {
  const c = st.contracts[idx];
  if (!canDeliver(c)) { Sound.error(); return; }
  c.items.forEach(it => { if (it.kind === 'ale') st.ale -= it.q; else if (it.kind === 'ingot') st.ingot[it.i] -= it.q; else st.ore[it.i] -= it.q; });
  st.gold += c.gold; st.gems += c.gems;
  st.contracts.splice(idx, 1); refillContracts();
  Sound.coins(4); dirty = true;
}

/* ═══════════════ Реклама ═══════════════ */
function tryInterstitial() {
  if (st.interT > 0) return;
  st.interT = CFG.INTER_CD;
  YSDK.showInterstitial();
}
function rewarded(onOk) { YSDK.showRewarded(() => { onOk(); dirty = true; }); }

/* ═══════════════ Туториал ═══════════════ */
const TUT_MAX = 5;
function nextTut() { if (st.tut < TUT_MAX) { st.tut++; dirty = true; } }

/* ═══════════════ Оффлайн ═══════════════ */
function offlineCatchUp(sec) {
  sec = Math.min(sec, Math.min(offWindow(), CFG.OFF_CAP));
  if (sec < 60) return null;
  const before = { yarus: st.yarus, gold: st.gold, ore: st.ore.slice(), ale: st.ale, stone: st.stone };
  const k = offProd(), avgP = levelM(expLevel(st.deepest)) * 1.0 * gearM();
  // комнаты
  roomList().forEach(o => {
    const hands = roomDef(o.r.t).hands;
    if (!hands) return;
    const rate = roomOut(o.r.lvl) * avgP * k * hands / 2;
    if (o.r.t === 'mine') { const oi = stratum(o.y).ore; if (oi > 0) st.ore[oi] = capped(st.ore[oi] + CFG.ORE_RATE * 2 * rate * sec); }
    else if (o.r.t === 'farm') st.mush = capped(st.mush + CFG.MUSH_RATE * 2 * rate * sec);
    else if (o.r.t === 'brew') { const made = Math.min(CFG.ALE_RATE * 2 * rate * sec, st.mush / CFG.ALE_IN);
      st.ale = capped(st.ale + made); st.mush = Math.max(0, st.mush - made * CFG.ALE_IN); }
    else if (o.r.t === 'smelt') { for (let i = 5; i >= 1; i--) {
      const can = Math.min(st.ore[i], sec / CFG.SMELT_TIME * rate);
      if (can > 0) { st.ore[i] -= can; st.ingot[i] = capped(st.ingot[i] + can); break; } } }
  });
  // забой на ночной смене
  const diggers = Math.min(CFG.BLOCK_W, Math.max(0, st.dwarves.length - roomList().filter(o => roomDef(o.r.t).hands).length * 2));
  let dmg = diggers * CFG.DIGGER * pickDmg(st.pick) * gearM() * avgP * CFG.OFF_DIG * sec;
  let guard = 0;
  while (dmg > 0 && guard++ < 4000) {
    const c = st.blocks.findIndex(v => v > 0);
    if (c < 0) { rowDone(); continue; }
    const take = Math.min(dmg, st.blocks[c]);
    st.blocks[c] -= take; dmg -= take;
    if (st.blocks[c] <= 0) { st.blocks[c] = 0; if (st.blocks.every(v => v <= 0)) rowDone(); }
  }
  st.dwarves.forEach(d => { d.fat = Math.max(0, d.fat - 30); d.mood = Math.max(10, d.mood - sec / CFG.MOOD_SPAN * 40); });
  const dOre = st.ore.map((v, i) => v - before.ore[i]);
  return { yarus: st.yarus - before.yarus, gold: st.gold - before.gold, stone: st.stone - before.stone,
           ale: st.ale - before.ale, ore: dOre, sec };
}

/* ═══════════════ Сейв ═══════════════ */
function save() { dirty = true; }
async function flushSave() {
  if (!dirty) return; dirty = false;
  st.tSave = Date.now();
  const o = Object.assign({}, st);
  delete o.camY; delete o.camFree;
  await YSDK.saveData(o);
}
setInterval(flushSave, 5000);
document.addEventListener('visibilitychange', () => {
  Sound.setMuted(document.hidden || st.muted);
  if (document.hidden) { flushSave(); YSDK.gameplayStop(); } else if (!ui) YSDK.gameplayStart();
});

async function loadGame() {
  const d = await YSDK.loadData();
  st = newGame();
  if (d && d.v === CFG.SAVE_V && d.yarus) {
    Object.assign(st, d);
    st.camFree = false;
    if (!st.blocks || !st.blocks.length) newRow();
  } else newRow();
  refillContracts();
  if (!st.dwarves.length) {
    for (let i = 0; i < 2; i++) { const dw = makeDwarf(); dw.x = L.shaftX + 8 + i * 10; dw.y = rowY() - 9; st.dwarves.push(dw); }
  }
  const away = (Date.now() - (d && d.tSave ? d.tSave : Date.now())) / 1000;
  if (away > 60) {
    const sum = offlineCatchUp(away);
    if (sum) showPopup({ title: T.offline, sum });
  }
}

/* ═══════════════ Цикл ═══════════════ */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  frame++;
  update(dt); draw();
  requestAnimationFrame(loop);
}
function update(dt) {
  if (st.interT > 0) st.interT -= dt;
  if (st.rage > 0) st.rage -= dt;
  if (st.caravanCD > 0) st.caravanCD -= dt;
  if (st.caravanT > 0) st.caravanT -= dt;
  if (hintT > 0) { hintT -= dt; if (hintT <= 0) hint = null; }
  if (press && performance.now() - press.t0 > 380) {
    st.prio[press.col] = !st.prio[press.col];
    say(st.prio[press.col] ? T.order : T.mark); Sound.build();
    st.dwarves.forEach(d => { if (d.task && d.task.kind === 'dig' && !trait(d).stubborn) d.task = null; });
    press = null;
  }

  // иммиграция
  st.lastImm += dt;
  if (st.lastImm >= CFG.IMMIGRATE && st.dwarves.length < Math.max(2, bedsTotal()) && st.dwarves.length < CFG.POP_CAP) {
    st.lastImm = 0;
    const dw = makeDwarf();
    dw.x = L.shaftX + 8; dw.y = -SURFACE_H + 30;
    st.dwarves.push(dw); dirty = true;
    if (st.tut === 3) nextTut();
  }

  const aura = st.dwarves.reduce((a, d) => a + (trait(d).aura || 0), 0) / Math.max(1, st.dwarves.length);
  const P = pickDmg(st.pick) * gearM();

  for (const d of st.dwarves) {
    if (d.task && d.task.kind !== 'sleep' && d.fat >= CFG.FAT_SLEEP) d.task = null;
    if (d.task && d.task.kind !== 'sleep' && d.task.kind !== 'drink'
        && d.mood <= CFG.MOOD_DRINK && st.ale >= 1 && has('tavern')) d.task = null;
    if (!d.task) d.task = chooseTask(d);

    const t = d.task, spot = taskSpot(t), step = CFG.WALK * dt, vstep = step * CFG.SHAFT_SPEED;
    const atY = Math.abs(d.y - spot.y) <= vstep;
    const tx = atY ? spot.x : L.shaftX + L.shaft / 2 - 3;
    if (Math.abs(d.x - tx) > step) { d.dir = Math.sign(tx - d.x); d.x += d.dir * step; d.moving = true; }
    else { d.x = tx; if (!atY) { d.y += Math.sign(spot.y - d.y) * vstep; d.moving = true; } else { d.y = spot.y; d.moving = false; } }
    if (d.moving) { d.fat = Math.min(100, d.fat + 100 / CFG.WORK_SPAN * dt * .3 * (trait(d).fat || 1)); continue; }

    if (t.kind === 'sleep') {
      d.fat -= 100 / (t.bed ? CFG.SLEEP_BED : CFG.SLEEP_FLOOR) * dt;
      if (d.fat <= 0) { d.fat = 0; d.task = null; }
    } else if (t.kind === 'drink') {
      t.t += dt;
      d.mood = Math.min(100, d.mood + 100 / CFG.DRINK_SPAN * dt * (trait(d).drink || 1));
      if (t.t >= 1) { if (st.ale >= 1) { st.ale -= 1; t.t = 0; } else { d.task = null; } }
      if (d.mood >= 95) d.task = null;
    } else if (t.kind === 'dig') {
      if (st.blocks[t.col] === undefined || st.blocks[t.col] <= 0) { d.task = null; continue; }
      damage(t.col, CFG.DIGGER * P * power(d) / gearM() * dt, colX(t.col) + 4, rowY() + 8);
      wear(d, dt, aura);
    } else if (t.kind === 'room') {
      const room = st.rooms[t.y + ':' + t.slot];
      if (!room) { d.task = null; continue; }
      const out = roomOut(room.lvl) * power(d) * dt;
      if (t.rt === 'mine') { const oi = stratum(t.y).ore;
        if (oi > 0) st.ore[oi] = capped(st.ore[oi] + CFG.ORE_RATE * out * (trait(d).ore || 1)); }
      else if (t.rt === 'farm') st.mush = capped(st.mush + CFG.MUSH_RATE * out);
      else if (t.rt === 'brew') { const made = Math.min(CFG.ALE_RATE * out, st.mush / CFG.ALE_IN);
        if (made > 0) { st.ale = capped(st.ale + made); st.mush -= made * CFG.ALE_IN; } else d.task = null; }
      else if (t.rt === 'smelt') { st.smeltT += out;
        if (st.smeltT >= CFG.SMELT_TIME) { st.smeltT = 0;
          for (let i = 5; i >= 1; i--) if (st.ore[i] >= 1) { st.ore[i] -= 1; st.ingot[i] = capped(st.ingot[i] + 1); break; } } }
      wear(d, dt, aura);
    } else { wear(d, dt * .3, aura); if (frame % 90 === 0) d.task = null; }
  }

  if (!st.camFree) st.camY += (camTarget() - st.camY) * Math.min(1, dt * 6);
  if (shake > 0) shake = Math.max(0, shake - dt * 26);
  chips = chips.filter(c => { c.t += dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 150 * dt; return c.t < .9; });
  floats = floats.filter(f => { f.t += dt; return f.t < 1.4; });
}
function wear(d, dt, aura) {
  d.fat = Math.min(100, d.fat + 100 / CFG.WORK_SPAN * dt * (trait(d).fat || 1));
  d.mood = Math.max(0, Math.min(100, d.mood - 100 / CFG.MOOD_SPAN * dt * (trait(d).moodRate || 1) + aura * dt * .02));
  d.xp += dt;
  if (d.xp > 120 * d.lvl && d.lvl < CFG.LEVEL_MAX) { d.xp = 0; d.lvl++; dirty = true; }
}

/* ═══════════════ Рендер мира ═══════════════ */
function draw() {
  hits = [];
  const cam = Math.round(st.camY) + (shake > 0 ? Math.round((Math.random() - .5) * shake) : 0);
  const F2 = (frame >> 4) & 1, F4 = (frame >> 3) & 1;
  R(0, 0, LW, LH, '#0d0a12');
  ctx.save(); ctx.beginPath(); ctx.rect(0, L.view.y, LW, L.view.h); ctx.clip();
  drawSurface(cam);
  for (let n = 1; n <= st.yarus; n++) {
    const top = worldTop(n), h = yarusH(n);
    if (top + h - cam < -20 || top - cam > L.view.h) continue;
    const sy = L.view.y + top - cam;
    if (n < st.yarus) drawHall(n, sy, h, F2, cam);
    else drawFace(n, sy);
  }
  const bot = L.view.y + worldBottom() - cam;
  if (bot < L.view.y + L.view.h) {
    const s = stratum(st.yarus);
    R(0, bot, LW, L.view.y + L.view.h - bot, s.dark);
    R(L.x0 - 4, bot, L.colW + 8, L.view.y + L.view.h - bot, s.rock);
  }
  st.dwarves.forEach(d => drawDwarf(d, cam, F4));
  chips.forEach(c => R(c.x, L.view.y + c.y - cam, 2, 2, '#efe4d0'));
  floats.forEach(f => {
    if (f.t > 1.1 && (frame >> 2) % 2 === 0) return;
    const y = L.view.y + f.y - cam - f.t * 12;
    const w = textW(f.s) + (f.ic ? 7 : 0);
    if (f.ic) spr(f.ic, f.x - w / 2, y + 1);
    text(f.s, f.x - w / 2 + (f.ic ? 7 : 0), y, f.col);
  });
  ctx.restore();
  drawMinimap(); drawHUD(); drawBar();
  drawStrip();
  if (build) drawBuildPanel();
  if (ui) drawUI();
  sctx.clearRect(0, 0, screenCv.width, screenCv.height);
  sctx.drawImage(buf, 0, 0, LW, LH, 0, 0, LW * S, LH * S);
}

function drawSurface(cam) {
  const sy = L.view.y - SURFACE_H - cam;
  if (sy > L.view.y + L.view.h || sy + SURFACE_H < L.view.y) return;
  R(0, sy, LW, SURFACE_H, '#2a3a55');
  for (let i = 0; i < 14; i++) R((i * 37) % LW, sy + 4 + (i * 13) % 20, 1, 1, '#4a5c7a');
  R(0, sy + SURFACE_H - 10, LW, 10, '#3d5a2e');
  R(0, sy + SURFACE_H - 10, LW, 2, '#5c8a42');
  spr('gate', L.shaftX + L.shaft / 2 - SW('gate') / 2, sy + SURFACE_H - 10 - SH('gate') + 2);
  if (st.caravanT <= 0) spr('wagon', L.x0 + 6, sy + SURFACE_H - 10 - SH('wagon') + 2);
  textC(T.caravan.toUpperCase(), L.shaftX + L.shaft / 2, sy + 5, st.caravanT <= 0 ? '#e8c34c' : '#7a8ba8', null);
}

function roomProps(o, hx, floorY, F4) {
  const s = stratum(o.y);
  const t = o.r.t;
  if (t === 'bed') { for (let i = 0; i < Math.min(3, o.r.lvl); i++) spr('bed', hx + 5, floorY - SH('bed') - i * 9); }
  else if (t === 'mine') { spr('cart', hx + 3, floorY - SH('cart'));
    for (let i = 0; i < Math.min(4, o.r.lvl + 1); i++) R(hx + L.hall - 10 + (i % 2) * 4, floorY - 7 - ((i / 2) | 0) * 5, 3, 3, s.oreCol); }
  else if (t === 'farm') { for (let i = 0; i < Math.min(4, o.r.lvl + 1); i++) spr('mush', hx + 5 + i * 7, floorY - SH('mush')); }
  else if (t === 'brew') { spr('barrel', hx + 4, floorY - SH('barrel')); spr('barrel', hx + 13, floorY - SH('barrel'));
    if (o.r.lvl > 1) spr('barrel', hx + 8, floorY - SH('barrel') * 2 + 1); }
  else if (t === 'tavern') { spr('barrel', hx + L.hall - 12, floorY - SH('barrel'));
    R(hx + 5, floorY - 7, 16, 2, '#7a5230'); R(hx + 7, floorY - 5, 2, 5, '#5a3a20'); R(hx + 17, floorY - 5, 2, 5, '#5a3a20');
    spr('mug', hx + 8, floorY - 12); }
  else if (t === 'store') { for (let i = 0; i < Math.min(4, o.r.lvl + 1); i++) spr('crate', hx + 4 + (i % 2) * 8, floorY - SH('crate') - ((i / 2) | 0) * 6); }
  else if (t === 'forge') { spr('anvil', hx + 5, floorY - SH('anvil')); spr('furnace', hx + 16, floorY - SH('furnace')); }
  else if (t === 'smelt') { spr('furnace', hx + 5, floorY - SH('furnace'));
    if (F4) R(hx + 8, floorY - 12, 4, 3, '#ff8a2b'); spr('cart', hx + 16, floorY - SH('cart')); }
}

function drawHall(n, sy, h, F2, cam) {
  const s = stratum(n);
  R(L.x0 - 4, sy, L.colW + 8, h, s.rock);
  R(L.shaftX, sy, L.shaft, h, '#1d1626');
  for (let ry = sy + 1; ry < sy + h; ry += 5) R(L.shaftX + 3, ry, L.shaft - 6, 1, '#6b4a2a');
  R(L.shaftX + 3, sy, 1, h, '#3a2d18'); R(L.shaftX + L.shaft - 4, sy, 1, h, '#3a2d18');
  if (rowsOf(n) === 1) { R(L.x0 - 4, sy, L.colW + 8, 1, s.dark); return; }
  for (let slot = 0; slot < 2; slot++) {
    const hx = slot === 0 ? L.x0 : L.shaftX + L.shaft;
    R(hx, sy + 1, L.hall, h - 3, s.hall);
    R(hx, sy + h - 3, L.hall, 2, s.dark);
    R(hx, sy, L.hall, 1, s.dark);
    spr(F2 ? 'torch' : 'torch2', slot === 0 ? hx + L.hall - 5 : hx + 2, sy + 4);
    const key = n + ':' + slot, room = st.rooms[key], floorY = sy + h - 3;
    if (!room) {
      // ЯВНАЯ плашка постройки. Слово не влезает в зал 44 px, поэтому крупный «+»
      // в рамке: понятно без языка, а названия комнат — уже в панели по тапу.
      const avail = availableRooms(n), any = avail.some(d => st.stone >= roomCost(d.t, n));
      const bs = 15, bx = hx + Math.floor((L.hall - bs) / 2), by = sy + Math.floor(h / 2) - 8;
      R(bx, by, bs, bs, any ? '#3d6b3a' : '#2f2a3f');
      R(bx, by, bs, 1, any ? '#5c9455' : '#413a55');
      R(bx, by + bs - 1, bs, 1, '#1a1424');
      spr('plus', bx + 5, by + 5);
      if (!any) R(bx + 1, by + 1, bs - 2, bs - 2, '#2f2a3f66');
      if (any && (frame >> 4) % 2) {
        R(bx - 2, by - 2, bs + 4, 1, '#8fd48a'); R(bx - 2, by + bs + 1, bs + 4, 1, '#8fd48a');
        R(bx - 2, by - 2, 1, bs + 4, '#8fd48a'); R(bx + bs + 1, by - 2, 1, bs + 4, '#8fd48a');
      }
      if (st.tut === 2 && n === st.yarus - 1 && slot === 0)
        text('↓', bx + 6, by - 10 + ((frame >> 3) % 2), '#ffd24a');
      hits.push({ r: { x: hx, y: sy, w: L.hall, h }, fn: () => { build = { y: n, slot }; Sound.build(); } });
    } else {
      roomProps({ y: n, slot, r: room }, hx, floorY, (frame >> 3) & 1);
      if (room.lvl > 1) text(String(room.lvl), hx + 2, sy + 3, '#e8c34c', null);
      hits.push({ r: { x: hx, y: sy, w: L.hall, h }, fn: () => openUI({ kind: 'room', y: n, slot }) });
    }
  }
}

function drawFace(n, sy) {
  const s = stratum(n), rows = rowsOf(n);
  R(L.x0 - 4, sy, L.colW + 8, rows * BLOCK, s.rock);
  if (st.row > 0) {
    R(L.x0, sy, L.colW, st.row * BLOCK, '#1d1626');
    for (let ry = sy + 1; ry < sy + st.row * BLOCK; ry += 5) R(L.shaftX + 3, ry, L.shaft - 6, 1, '#6b4a2a');
  }
  const ry = sy + st.row * BLOCK;
  R(L.x0 - 4, ry - 1, L.colW + 8, 1, '#e8a33c');
  for (let c = 0; c < CFG.BLOCK_W; c++) {
    const bx = L.x0 + c * BLOCK, type = st.types[c] || 'rock';
    const full = blockHp(n, type), left = st.blocks[c] === undefined ? full : st.blocks[c];
    if (left <= 0) { R(bx, ry, BLOCK, BLOCK, '#1d1626'); continue; }
    R(bx, ry, BLOCK, BLOCK, type === 'cave' ? s.dark : s.rock);
    R(bx, ry, BLOCK, 1, s.dark); R(bx, ry, 1, BLOCK, s.dark);
    if (type === 'vein') for (let i = 0; i < 5; i++)
      R(bx + 2 + ((c * 5 + i * 7) % 12), ry + 2 + ((i * 5 + c) % 12), 2, 2, s.oreCol);
    if (type === 'crystal') { const cc = '#7fd8e8';
      R(bx + 7, ry + 3, 2, 10, cc); R(bx + 5, ry + 6, 2, 6, cc); R(bx + 9, ry + 5, 2, 7, cc); R(bx + 6, ry + 5, 1, 1, '#dffaff'); }
    if (type === 'water') for (let i = 0; i < 4; i++) R(bx + 2, ry + 3 + i * 3, 12, 2, i % 2 ? '#2f6aa8' : '#3f86c8');
    if (type === 'cave') R(bx + 3, ry + 4, 10, 8, '#120d18');
    const stage = Math.min(3, Math.floor((1 - left / full) * 4));
    for (let i = 0; i < stage * 3; i++) {
      const a = (c * 7 + i * 31) % 360 * Math.PI / 180;
      let px = bx + 8, py = ry + 8;
      for (let s2 = 0; s2 < 3 + i % 3; s2++) { px += Math.cos(a) * 1.5; py += Math.sin(a) * 1.5; R(px, py, 1, 1, s.dark); }
    }
    if (st.prio[c]) {
      R(bx, ry, BLOCK, 1, '#ffd24a'); R(bx, ry + BLOCK - 1, BLOCK, 1, '#ffd24a');
      R(bx, ry, 1, BLOCK, '#ffd24a'); R(bx + BLOCK - 1, ry, 1, BLOCK, '#ffd24a');
      text('*', bx + 6, ry + 5, '#ffd24a', null);
    }
    const scrY = L.view.y + worldTop(n) + st.row * BLOCK - Math.round(st.camY);
    hits.push({ r: { x: bx, y: scrY, w: BLOCK, h: BLOCK }, fn: () => {
      tapDamage(c, bx + 8, worldTop(n) + st.row * BLOCK + 8);
      press = { col: c, t0: performance.now() };
    } });
  }
  if (st.row + 1 < rows) {
    const uy = ry + BLOCK, uh = (rows - st.row - 1) * BLOCK;
    R(L.x0, uy, L.colW, uh, s.dark);
    for (let c = 1; c < CFG.BLOCK_W; c++) R(L.x0 + c * BLOCK, uy, 1, uh, '#00000033');
    for (let r2 = 0; r2 < rows - st.row - 1; r2++) R(L.x0, uy + r2 * BLOCK, L.colW, 1, '#00000033');
  }
}

function drawDwarf(d, cam, F4) {
  const sy = L.view.y + Math.round(d.y) - cam;
  if (sy < L.view.y - 12 || sy > L.view.y + L.view.h) return;
  const x = Math.round(d.x), k = d.task ? d.task.kind : 'idle';
  if (k === 'sleep' && !d.moving) { spr('sleep', x, sy + 2); if ((frame >> 5) % 2) text('Z', x + 8, sy - 3, '#9ec4e8', null); }
  else if (k === 'drink' && !d.moving) { spr(F4 ? 'dwarf' : 'dwarf2', x, sy); spr('mug', x + 7, sy + 2); }
  else if (d.moving) spr(F4 ? 'dwarf' : 'dwarf2', x, sy);
  else spr(F4 ? 'miner' : 'miner2', x, sy);
  if (d.mood <= CFG.MOOD_DRINK) R(x + 3, sy - 4, 3, 3, '#e05a5a');
  else if (d.fat >= CFG.FAT_SLEEP) R(x + 3, sy - 4, 3, 3, '#e8c34c');
}

function drawMinimap() {
  const m = L.map, total = worldBottom() + SURFACE_H;
  R(m.x - 1, m.y - 1, m.w + 2, m.h + 2, '#1a1424');
  const toMap = wy => m.y + Math.round((wy + SURFACE_H) / total * m.h);
  R(m.x, m.y, m.w, 2, '#3d5a2e');
  const COL = { mine: '#c07a3a', bed: '#9ec4e8', brew: '#c98a3a', tavern: '#e8a33c',
                farm: '#7fc46a', store: '#c8b090', forge: '#8a8f96', smelt: '#ff8a2b' };
  roomList().forEach(o => R(m.x, toMap(worldTop(o.y)), m.w, 1, COL[o.r.t] || '#888'));
  R(m.x, toMap(worldBottom()) - 1, m.w, 2, '#e8a33c');
  const v0 = toMap(st.camY), v1 = toMap(st.camY + L.view.h);
  R(m.x - 1, v0, 1, Math.max(2, v1 - v0), '#f0e6d2');
  R(m.x + m.w, v0, 1, Math.max(2, v1 - v0), '#f0e6d2');
  hits.push({ r: { x: m.x - 2, y: m.y - 1, w: m.w + 4, h: m.h + 2 }, fn: p => {
    st.camFree = true;
    st.camY = Math.max(camMin(), Math.min(camMax(), Math.round((p.y - m.y) / m.h * total - SURFACE_H - L.view.h / 2)));
  } });
}

/* ── HUD с иконками и подписями ── */
function chip(ic, val, x, y, col, warn) {
  spr(ic, x, y + 1);
  text(val, x + 7, y, warn ? '#e05a5a' : col, '#140e1c');
  return x + 7 + textW(val) + 6;
}
function drawHUD() {
  R(0, 0, LW, HUD_H, '#1a1424');
  R(0, HUD_H - 1, LW, 1, '#0d0a12');
  const s = stratum(st.yarus);
  text(fmt(st.yarus * 4) + ' ' + T.depth, 4, 3, '#f0e6d2');
  textR(fitText(T.strata[stratumIdx(st.yarus)], LW - 60), LW - 4, 3, s.oreCol, null);
  // Чипы влезают только пока хватает места: при LW=125 их было пять и они
  // наезжали и друг на друга, и на счётчик дварфов. Рисуем, пока есть запас.
  const pop = st.dwarves.length, beds = bedsTotal(), cap = storeCap();
  const dw = pop + '/' + beds, dwX = LW - 8 - textW(dw) - 7;
  const warn = pop >= Math.max(2, beds);
  spr('iDwarf', dwX, 15);
  textR(dw, LW - 4, 14, warn ? '#e05a5a' : '#9ec4e8');
  const list = [['iStone', fmt(st.stone), '#d8cfc0', st.stone >= cap * .98], ['iGold', fmt(st.gold), '#e8c34c', false]];
  if (st.gems > 0) list.push(['iGem', fmt(st.gems), '#7fd8e8', false]);
  if (has('tavern')) list.push(['iAle', fmt(st.ale), '#c98a3a', st.ale < 1]);
  let x = 4;
  for (const [ic, v, col, w] of list) {
    if (x + 7 + textW(v) > dwX - 4) break;
    x = chip(ic, v, x, 14, col, w);   // сдвиг вправо на ширину чипа
  }
  if (st.rage > 0) { R(0, HUD_H - 3, Math.round(LW * st.rage / CFG.RAGE_TIME), 2, '#ff8a2b'); }
}
/* Одна полоса под HUD на три вида сообщений, по приоритету: свежая подсказка,
   шаг туториала, беда колонии. Иначе туториал вообще не показывался, а падение
   настроения до нуля было видно только красной точкой над дварфом. */
function drawStrip() {
  let s = null, bg = '#241d33', fg = '#e8dcc8';
  if (hint) s = hint;
  else if (st.tut < TUT_MAX) { s = T.tut[st.tut]; bg = '#2a3a55'; fg = '#cfe0f0'; }
  else {
    const avgMood = st.dwarves.reduce((a, d) => a + d.mood, 0) / Math.max(1, st.dwarves.length);
    if (st.dwarves.length >= Math.max(2, bedsTotal())) { s = T.noBeds; bg = '#4a2430'; fg = '#ffb0b0'; }
    else if (avgMood < 40 && (!has('tavern') || st.ale < 1)) { s = T.noAle; bg = '#4a3a24'; fg = '#ffd8a0'; }
    else if (st.stone >= storeCap() * .98) { s = T.full; bg = '#4a3a24'; fg = '#ffd8a0'; }
  }
  if (!s) return;
  const w = Math.min(LW - 12, textW(s) + 10);
  const x = Math.floor((LW - w) / 2), y = HUD_H + 3;
  R(x, y, w, 11, bg); R(x, y, w, 1, '#00000044');
  textC(fitText(s, w - 6), x + w / 2, y + 2, fg, null);
}

/* ── нижний бар ── */
// Кнопки бара — иконками, а не словами: четыре подписи в 118 px обрезались
// до «КУ. КА. КО. ДВ.» и не читались ни на одном языке.
function barButtons() {
  return [
    { k: 'forge', ic: 'anvil', on: has('forge'), col: '#4a4a6b' },
    { k: 'caravan', ic: 'wagon', on: st.deepest >= 4, col: st.caravanT <= 0 ? '#6b5a2a' : '#4a4436' },
    { k: 'contracts', ic: 'scroll', on: st.deepest >= 6, col: '#4a3a6b' },
    { k: 'dwarves', ic: 'iDwarf', on: true, col: '#3a3358' },
  ].filter(x => x.on);
}
function drawBar() {
  const y = LH - BAR_H;
  R(0, y, LW, BAR_H, '#1a1424'); R(0, y, LW, 1, '#0d0a12');
  const bs = barButtons();
  const back = st.camFree, backW = 16;
  const total = LW - 6 - (back ? backW + 3 : 0);
  const bw = Math.floor((total - (bs.length - 1) * 3) / bs.length);
  bs.forEach((b, i) => {
    const bx = 3 + i * (bw + 3);
    R(bx, y + 4, bw, BAR_H - 8, b.col); R(bx, y + 4, bw, 1, '#6b619c');
    spr(b.ic, bx + Math.floor((bw - SW(b.ic)) / 2), y + 6);
    let sub = '';
    if (b.k === 'caravan') sub = st.caravanT > 0 ? clock(st.caravanT) : '!';
    else if (b.k === 'dwarves') sub = String(st.dwarves.length);
    else if (b.k === 'contracts') sub = st.contracts.filter(canDeliver).length + '/3';
    else if (b.k === 'forge') sub = (canPick() && st.gold >= pickCost()) ? '!' : '';
    if (sub) textC(sub, bx + bw / 2, y + 15, sub === '!' ? '#ffd24a' : '#a99fc0', null);
    hits.push({ r: { x: bx, y: y + 4, w: bw, h: BAR_H - 8 }, fn: () => openUI({ kind: b.k }) });
  });
  if (back) {
    const bx = LW - backW - 3;
    R(bx, y + 4, backW, BAR_H - 8, '#4a3a6b'); R(bx, y + 4, backW, 1, '#6b569c');
    textC('↓', bx + backW / 2, y + 9, '#ded0ff');
    hits.push({ r: { x: bx, y: y + 4, w: backW, h: BAR_H - 8 }, fn: () => { st.camFree = false; } });
  }
}

/* ═══════════════ Экраны ═══════════════ */
function panel(titleStr, h) {
  const w = Math.min(112, LW - 6);
  const x = Math.floor((LW - w) / 2), y = Math.max(HUD_H + 2, Math.floor((LH - h) / 2));
  R(x - 1, y - 1, w + 2, h + 2, '#0d0a12'); R(x, y, w, h, '#241d33'); R(x, y, w, 1, '#3d3352');
  textC(titleStr.toUpperCase(), x + w / 2, y + 3, '#c8bfe0', null);
  R(x + 4, y + 11, w - 8, 1, '#3d3352');
  return { x, y, w, h };
}
function btn(p, label, sub, y, enabled, fn, col) {
  const bx = p.x + 4, bw = p.w - 8;
  R(bx, y, bw, 14, enabled ? (col || '#3d6b3a') : '#2a2436');
  R(bx, y, bw, 1, enabled ? '#5c9455' : '#3a3248');
  text(fitText(label, bw - textW(sub) - 8), bx + 4, y + 4, enabled ? '#eaffea' : '#6b6280', null);
  if (sub) textR(sub, bx + bw - 4, y + 4, enabled ? '#d8cfc0' : '#6b6280', null);
  if (enabled) hits.push({ r: { x: bx, y, w: bw, h: 14 }, fn });
  return y + 16;
}
function closeAt(p) {
  hits.push({ r: { x: 0, y: 0, w: LW, h: LH }, fn: closeUI });
  const s = 9;
  R(p.x + p.w - s - 2, p.y + 2, s, s, '#4a3a4a');
  textC('×', p.x + p.w - s / 2 - 2, p.y + 3, '#e8c8c8', null);
  hits.push({ r: { x: p.x + p.w - s - 4, y: p.y, w: s + 4, h: s + 4 }, fn: closeUI });
}
function drawUI() {
  hits.push({ r: { x: 0, y: 0, w: LW, h: LH }, fn: () => {} });
  if (ui.kind === 'dwarves') return drawDwarvesScreen();
  if (ui.kind === 'forge') return drawForge();
  if (ui.kind === 'caravan') return drawCaravan();
  if (ui.kind === 'contracts') return drawContracts();
  if (ui.kind === 'room') return drawRoomScreen();
  if (ui.kind === 'popup') return drawPopup();
}

function drawBuildPanel() {
  const avail = availableRooms(build.y);
  const p = panel(T.build + ' — ' + T.lvl + ' ' + build.y, 16 + avail.length * 16 + 4);
  hits.push({ r: { x: 0, y: 0, w: LW, h: LH }, fn: () => { build = null; } });
  let y = p.y + 14;
  avail.forEach(d => {
    const cost = roomCost(d.t, build.y);
    y = btn(p, T.rooms[d.t], fmt(cost), y, st.stone >= cost, () => { if (doBuild(d.t, build.y, build.slot)) build = null; });
  });
  const s = 9;
  R(p.x + p.w - s - 2, p.y + 2, s, s, '#4a3a4a');
  textC('×', p.x + p.w - s / 2 - 2, p.y + 3, '#e8c8c8', null);
  hits.push({ r: { x: p.x + p.w - s - 4, y: p.y, w: s + 4, h: s + 4 }, fn: () => { build = null; } });
}

function drawRoomScreen() {
  const o = { y: ui.y, slot: ui.slot, r: st.rooms[ui.y + ':' + ui.slot] };
  if (!o.r) { closeUI(); return; }
  const p = panel(T.rooms[o.r.t], 78);
  closeAt(p);
  text(fitText(T.roomWhat[o.r.t], p.w - 8), p.x + 4, p.y + 14, '#a99fc0', null);
  text(T.lvl + ' ' + o.r.lvl + '/' + CFG.ROOM_LVL_MAX + '   ×' + roomOut(o.r.lvl).toFixed(2), p.x + 4, p.y + 24, '#e8c34c', null);
  const maxed = o.r.lvl >= CFG.ROOM_LVL_MAX;
  const cost = maxed ? 0 : roomLvlCost(o.y, o.r.lvl);
  const bump = () => { o.r.lvl = Math.min(CFG.ROOM_LVL_MAX, o.r.lvl + 1); Sound.upgrade(); };
  let y = btn(p, maxed ? T.maxed : T.upgrade, maxed ? '' : fmt(cost), p.y + 34, !maxed && st.stone >= cost, () => doUpgradeRoom(o));
  y = btn(p, T.instant, T.ad, y, !maxed, () => rewarded(bump), '#5a4a2a');
  y = btn(p, T.instant, CFG.GEM_INSTANT + '*', y, !maxed && st.gems >= CFG.GEM_INSTANT,
    () => { st.gems -= CFG.GEM_INSTANT; bump(); dirty = true; }, '#2a4a5a');
}

function drawForge() {
  const p = panel(T.forgeT, 94);
  closeAt(p);
  let y = p.y + 14;
  const pc = pickCost(), nextY = CFG.PICK_YARUS[Math.min(st.pick + 1, CFG.PICK_YARUS.length - 1)];
  y = btn(p, T.pick + ' ' + (st.pick + 2), canPick() ? fmt(pc) : (T.lvl + ' ' + nextY),
    y, canPick() && st.gold >= pc, () => { st.gold -= pc; st.pick++; Sound.upgrade(); dirty = true; });
  const gc = gearCost();
  y = btn(p, T.gear + ' ' + (st.gear + 1), fmt(gc), y, st.gold >= gc,
    () => { st.gold -= gc; st.gear++; Sound.upgrade(); dirty = true; });
  const cc = cartCost();
  y = btn(p, T.cart + ' ' + (st.cart + 1), st.cart >= CFG.CART_MAX ? T.maxed : fmt(cc),
    y, st.cart < CFG.CART_MAX && st.gold >= cc, () => { st.gold -= cc; st.cart++; Sound.upgrade(); dirty = true; });
  // подписи эффектов отдельной строкой: в кнопку они не влезали и обрезались в мусор
  text('×' + gearM().toFixed(2), p.x + 4, y + 1, '#8f86a8', null);
  textR(Math.round(offProd() * 100) + '%', p.x + p.w - 4, y + 1, '#8f86a8', null);
  y += 9;
  const rage = () => { st.rage = CFG.RAGE_TIME; say(T.rageOn); Sound.upgrade(); };
  y = btn(p, T.rage + ' ×' + CFG.RAGE_MULT, T.ad, y, st.rage <= 0, () => rewarded(rage), '#5a4a2a');
  y = btn(p, T.rage + ' ×' + CFG.RAGE_MULT, CFG.GEM_RAGE + '*', y, st.rage <= 0 && st.gems >= CFG.GEM_RAGE,
    () => { st.gems -= CFG.GEM_RAGE; rage(); dirty = true; }, '#2a4a5a');
}

function drawCaravan() {
  const rows = [];
  for (let i = 1; i <= 5; i++) {
    if (st.ore[i] > 0) rows.push({ n: T.ores[i], q: st.ore[i], v: st.ore[i] * orePrice(i) });
    if (st.ingot[i] > 0) rows.push({ n: T.ores[i] + '+', q: st.ingot[i], v: st.ingot[i] * orePrice(i) * CFG.INGOT_MULT });
  }
  const p = panel(T.caravan, 20 + Math.max(1, rows.length) * 9 + 38);
  closeAt(p);
  let y = p.y + 14;
  if (!rows.length) { text('—', p.x + 4, y, '#6b6280', null); y += 9; }
  rows.forEach(r => {
    text(fitText(r.n, 40), p.x + 4, y, '#d8cfc0', null);
    text('×' + fmt(r.q), p.x + 48, y, '#a99fc0', null);
    textR(fmt(r.v), p.x + p.w - 4, y, '#e8c34c', null);
    y += 9;
  });
  y += 4;
  const v = stockValue();
  y = btn(p, T.sellAll, fmt(v), y, v > 0, () => { sellAll(1); closeUI(); });
  y = btn(p, T.sellX2, fmt(v * 2), y, v > 0, () => rewarded(() => { sellAll(2); closeUI(); }), '#5a4a2a');
}

function drawContracts() {
  const p = panel(T.contracts, 16 + st.contracts.length * 30 + 18);
  closeAt(p);
  let y = p.y + 14;
  st.contracts.forEach((c, i) => {
    const ok = canDeliver(c);
    R(p.x + 4, y, p.w - 8, 27, i % 2 ? '#1f1a2e' : '#2a2340');
    let tx = p.x + 7;
    c.items.forEach(it => {
      const nm = it.kind === 'ale' ? T.ale : (T.ores[it.i] + (it.kind === 'ingot' ? '+' : ''));
      const have = it.kind === 'ale' ? st.ale : it.kind === 'ingot' ? st.ingot[it.i] : st.ore[it.i];
      const s2 = fitText(nm, 40) + ' ' + fmt(it.q);
      text(s2, tx, y + 3, have >= it.q ? '#8fd48a' : '#e0a05a', null);
      tx += textW(s2) + 6;
    });
    text(T.reward + ': ' + fmt(c.gold), p.x + 7, y + 12, '#e8c34c', null);
    text('+' + c.gems, p.x + 7 + textW(T.reward + ': ' + fmt(c.gold)) + 5, y + 12, '#7fd8e8', null);
    const bw = 34;
    R(p.x + p.w - bw - 6, y + 10, bw, 12, ok ? '#3d6b3a' : '#2a2436');
    textC(T.deliver, p.x + p.w - bw / 2 - 6, y + 13, ok ? '#eaffea' : '#6b6280', null);
    if (ok) hits.push({ r: { x: p.x + p.w - bw - 6, y: y + 10, w: bw, h: 12 }, fn: () => deliver(i) });
    hits.push({ r: { x: p.x + 4, y, w: p.w - bw - 12, h: 27 }, fn: () => rewarded(() => { st.contracts[i] = makeContract(); }) });
    y += 30;
  });
  textC(T.reroll + ' — ' + T.x2, p.x + p.w / 2, y + 2, '#8f86a8', null);
}

function drawDwarvesScreen() {
  R(0, HUD_H, LW, LH - HUD_H - BAR_H, '#181322');
  // отдельная шапка со счётчиком и крестиком: раньше крестик садился прямо
  // на статус первой карточки
  const HD = 12;
  R(0, HUD_H, LW, HD, '#241d33');
  text(T.dwarves + ' ' + st.dwarves.length + '/' + bedsTotal(), 4, HUD_H + 3, '#c8bfe0', null);
  const CH = 26, top = HUD_H + HD + 2;
  const maxScroll = Math.max(0, st.dwarves.length * CH - (L.view.h - HD - 20));
  scrollY = Math.min(scrollY, maxScroll);
  ctx.save(); ctx.beginPath(); ctx.rect(0, HUD_H + HD, LW, LH - HUD_H - BAR_H - HD - 16); ctx.clip();
  st.dwarves.forEach((d, i) => {
    const cy = top + i * CH - Math.round(scrollY);
    if (cy > LH - BAR_H || cy + CH < HUD_H) return;
    const cw = LW - 4;
    R(2, cy, cw, CH - 2, i % 2 ? '#1f1a2e' : '#241d33');
    spr(d.moving ? 'dwarf' : 'miner', 4, cy + 5);
    const k = d.moving ? 'walk' : (d.task ? d.task.kind : 'idle');
    text(dName(d), 15, cy + 2, '#f0e6d2', null);
    textR(T.task[k] || '', cw - 2, cy + 2, '#a99fc0', null);
    text(fitText(dSur(d), 58), 15, cy + 10, '#8f86a8', null);
    text(d.lvl + ' ' + T.traits[d.ti], 15, cy + 18, '#c9a227', null);
    const bw = 26, bx = cw - bw - 2;
    R(bx, cy + 11, bw, 3, '#3a3248'); R(bx, cy + 11, Math.round(bw * d.mood / 100), 3, d.mood <= CFG.MOOD_DRINK ? '#e05a5a' : '#5cc46a');
    R(bx, cy + 18, bw, 3, '#3a3248'); R(bx, cy + 18, Math.round(bw * d.fat / 100), 3, d.fat >= CFG.FAT_SLEEP ? '#e8c34c' : '#7a6f8c');
    hits.push({ r: { x: 2, y: Math.max(HUD_H, cy), w: cw, h: CH - 2 }, fn: () => {
      closeUI(); st.camFree = true;
      st.camY = Math.max(camMin(), Math.min(camMax(), Math.round(d.y - L.view.h / 2)));
    } });
  });
  ctx.restore();
  R(0, HUD_H, LW, 1, '#0d0a12');
  const pop = st.dwarves.length, beds = bedsTotal();
  const room = pop < Math.min(CFG.POP_CAP, beds);
  const call = () => { const dw = makeDwarf(); dw.x = L.shaftX + 8; dw.y = -SURFACE_H + 30; st.dwarves.push(dw); Sound.build(); dirty = true; };
  // короткие подписи: «позвать дварфа» дважды в 118 px не влезает даже усечённым
  const by = LH - BAR_H - 15, hw = Math.floor((LW - 12) / 2);
  R(4, by, hw, 13, room ? '#5a4a2a' : '#2a2436');
  textC('+1  ' + T.ad, 4 + hw / 2, by + 3, room ? '#ffe0a0' : '#6b6280', null);
  if (room) hits.push({ r: { x: 4, y: by, w: hw, h: 13 }, fn: () => rewarded(call) });
  const okG = room && st.gems >= CFG.GEM_DWARF;
  R(8 + hw, by, hw, 13, okG ? '#2a4a5a' : '#2a2436');
  textC('+1  ' + CFG.GEM_DWARF + '*', 8 + hw + hw / 2, by + 3, okG ? '#a0e0ff' : '#6b6280', null);
  if (okG) hits.push({ r: { x: 8 + hw, y: by, w: hw, h: 13 }, fn: () => { st.gems -= CFG.GEM_DWARF; call(); } });
  if (pop >= Math.max(2, beds)) textR(T.noBeds, LW - 16, HUD_H + 3, '#ffb0b0', null);
  else if (has('tavern') && st.ale < 1) textR(T.noAle, LW - 16, HUD_H + 3, '#ffd8a0', null);
  const cs = 9;
  R(LW - cs - 3, HUD_H + 2, cs, cs, '#4a3a4a');
  textC('×', LW - cs / 2 - 3, HUD_H + 3, '#e8c8c8', null);
  hits.push({ r: { x: LW - cs - 5, y: HUD_H, w: cs + 5, h: cs + 4 }, fn: closeUI });
}

function drawPopup() {
  const s = ui.sum;
  const rows = [];
  if (s) {
    if (s.yarus > 0) rows.push([T.depth.toUpperCase(), '+' + s.yarus]);
    if (s.stone > 1) rows.push([T.stone, '+' + fmt(s.stone)]);
    for (let i = 1; i <= 5; i++) if (s.ore[i] > 1) rows.push([T.ores[i], '+' + fmt(s.ore[i])]);
    if (s.ale > 1) rows.push([T.ale, '+' + fmt(s.ale)]);
  }
  const p = panel(ui.title, 20 + Math.max(1, rows.length) * 9 + 36);
  let y = p.y + 14;
  if (!rows.length) { text('—', p.x + 4, y, '#6b6280', null); y += 9; }
  rows.forEach(r => { text(r[0], p.x + 4, y, '#d8cfc0', null); textR(r[1], p.x + p.w - 4, y, '#e8c34c', null); y += 9; });
  y += 4;
  y = btn(p, T.x2, '', y, true, () => rewarded(() => {
    if (s) { st.stone = capped(st.stone + s.stone); for (let i = 1; i <= 5; i++) st.ore[i] = capped(st.ore[i] + s.ore[i]); }
    closeUI();
  }), '#5a4a2a');
  y = btn(p, T.ok, '', y, true, closeUI, '#3d3a6b');
}

/* ═══════════════ Старт ═══════════════ */
(async function main() {
  buildSprites();
  await YSDK.init();
  T = (YSDK.lang === 'ru' || YSDK.lang === 'be' || YSDK.lang === 'kk' || YSDK.lang === 'uk') ? I18N.ru : I18N.en;
  document.documentElement.lang = T === I18N.ru ? 'ru' : 'en';
  resize();
  await loadGame();
  st.camY = camTarget();
  draw();
  YSDK.gameReady();
  YSDK.gameplayStart();
  requestAnimationFrame(loop);
})();
</script>
