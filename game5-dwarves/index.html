/* ═══════════════════════════════════════════════════════════════════════════
   «Дварфы-копатели» v2 (game5-dwarves; v1 заморожена в v1/)
   Пиксельный подгорный город, растущий вниз: кликер + идл + лёгкий симулятор
   колонии. Дварфы автономны — игрок их не расставляет, а создаёт условия.

   Арт-тезис:  «Камень старше нас; свет мы принесли с собой».
               Свет существует только там, куда его принесли: построенный зал
               получает факел и градиент яркости от него, пустой стоит тёмным
               силуэтом, края кадра гаснут холодной виньеткой, в столбах света
               оседает пыль. Порода за пределами города — сплошная и старая.

   Спека:      docs/superpowers/specs/2026-08-10-dwarves-design.md
   Симулятор:  docs/superpowers/sim/deep-city-economy.js  — все числа оттуда,
               меняя любое, прогонять симулятор заново.
   Звук:       shared/sfx.js (копия рядом) — слоёный синтез, музыка mood
               «mine», эмбиент «cave». Бипов v1 больше нет.
   Канон:      весь рендер в буфер 1:1, вывод целым множителем, целые координаты.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ═══════════════ Обёртка Yandex SDK (мок-режим локально) ═══════════════ */
const YSDK = (() => {
  let ysdk = null, player = null, readySent = false;
  function fireReady() {
    if (readySent) return; readySent = true;
    try { ysdk && ysdk.features && ysdk.features.LoadingAPI && ysdk.features.LoadingAPI.ready(); } catch (e) {}
  }
  async function init() {
    if (typeof YaGames === 'undefined') return;
    try { ysdk = await Promise.race([YaGames.init(), new Promise((_, rej) => setTimeout(() => rej(0), 8000))]); }
    catch (e) { ysdk = null; }
    if (ysdk) {
      try { player = await Promise.race([ysdk.getPlayer(), new Promise(r => setTimeout(() => r(null), 3000))]); }
      catch (e) { player = null; }
    }
  }
  const unmute = () => Sound.setMuted(!!(st && st.muted));
  return {
    init,
    get lang() { try { return ysdk ? ysdk.environment.i18n.lang : (navigator.language || 'ru').slice(0, 2); } catch (e) { return 'ru'; } },
    gameReady: fireReady,
    gameplayStart() { try { ysdk && ysdk.features && ysdk.features.GameplayAPI && ysdk.features.GameplayAPI.start(); } catch (e) {} },
    gameplayStop() { try { ysdk && ysdk.features && ysdk.features.GameplayAPI && ysdk.features.GameplayAPI.stop(); } catch (e) {} },
    showInterstitial(onClose) {
      if (!ysdk) { onClose && onClose(); return; }
      this.gameplayStop(); Sound.setMuted(true);
      ysdk.adv.showFullscreenAdv({ callbacks: {
        onClose: () => { unmute(); onClose && onClose(); },
        onError: () => { unmute(); onClose && onClose(); },
      }});
    },
    showRewarded(onReward, onClose) {
      if (!ysdk) { onReward && onReward(); onClose && onClose(true); return; }
      this.gameplayStop(); Sound.setMuted(true);
      let ok = false;
      ysdk.adv.showRewardedVideo({ callbacks: {
        onRewarded: () => { ok = true; onReward && onReward(); },
        onClose: () => { unmute(); onClose && onClose(ok); },
        onError: () => { unmute(); onClose && onClose(false); },
      }});
    },
    async saveData(obj) {
      if (player) { try { await player.setData(obj); return; } catch (e) {} }
      try { localStorage.setItem('dwarves_save', JSON.stringify(obj)); } catch (e) {}
    },
    async loadData() {
      if (player) { try { const d = await player.getData(); if (d && Object.keys(d).length) return d; } catch (e) {} }
      try { return JSON.parse(localStorage.getItem('dwarves_save')) || {}; } catch (e) { return {}; }
    },
  };
})();

/* ═══════════════ Звук ═══════════════
   Фасад над shared/sfx.js: слоёные рецепты вместо одноосцилляторных бипов,
   генеративная музыка «mine» и пещерный эмбиент. Музыка стартует после
   первого жеста (мобильные браузеры) и глушится вместе со всем остальным. */
const Sound = (() => {
  let started = false;
  const wantAudio = () => !(st && st.muted);
  function startBeds() { SFX.music.start('mine', .4); SFX.amb.start('cave'); }
  return {
    unlock() {
      SFX.unlock();
      if (!started && wantAudio()) { started = true; startBeds(); }
    },
    setMuted(m) {
      SFX.setMuted(m);                       // true гасит и музыку с эмбиентом
      if (!m && started) startBeds();        // после рекламы/возврата — поднять
    },
    intensity(i) { SFX.music.set(i); },      // накал музыки от жизни колонии
    hit() { SFX.play('pick', { v: .75 }); },
    scav() { SFX.play('dig', { v: .55 }); },
    crack() { SFX.play('thud', { v: .85 }); SFX.play('dig', { v: .3, t: .02 }); },
    breakthrough() { SFX.play('reveal', { v: .85 }); },
    stratum() { SFX.play('fanfare', { v: .65 }); },
    build() { SFX.play('chop', { v: .85 }); SFX.play('thud', { v: .55, t: .09 }); },
    open() { SFX.play('open', { v: .7 }); },
    close() { SFX.play('close', { v: .6 }); },
    coins(n) { SFX.play('coins', { n: Math.min(n || 3, 6), v: .8 }); },
    gem() { SFX.play('spark', { v: .85 }); },
    upgrade() { SFX.play('levelup', { v: .6 }); },
    clang() { SFX.play('clang', { v: .75 }); },
    error() { SFX.play('error', { v: .6 }); },
    found() { SFX.play('reveal', { v: .7 }); SFX.play('combo', { n: 4, t: .15, v: .8 }); },

    daily() { SFX.play('fanfare', { v: .75 }); },
    mark(on) { SFX.play('toggle', { on: !!on, v: .9 }); },
    mile() { SFX.play('levelup', { v: .7 }); },

/* ═══════════════ Числа (из симулятора) ═══════════════ */
const CFG = {
  GROWTH: 1.12,
  T_START: 200, T_PLATO: 242, T_RAMP: 30, T_DRIFT: 1.5, PILA_POW: 0.5,
  PICK_D0: 2, PICK_STEP: 2.35,
  PICK_YARUS: [1, 8, 15, 22, 29, 36, 44, 52, 60, 68, 76, 84, 92, 100, 108, 116]
    .concat(Array.from({ length: 60 }, (_, i) => 124 + i * 8)),
  DIGGER: 0.55, BLOCK_W: 7,
  // ЯРУСЫ ОДИНАКОВЫЕ: два ряда блоков, один ярус — один уровень зданий (два зала).
  // Схема «1→2→3 ряда с двухэтажным залом на глубине» отвергнута на плейтесте:
  // двухэтажность не читалась, а ждать три яруса до первой стройки было долго.
  // CALIB — точка калибровки: hp = REF × T × ROWS / CALIB, поэтому время на ОДИН
  // блок не зависит от числа рядов, меняется только длина яруса.
  ROWS: 2, CALIB: 3,
  FACE_W: 0.12,
  // Камня за пробой поднято со 100: при двух слотах на ярусе прежнего хватало
  // на 0.4 комнаты, и плашки «+» стояли пустыми часами. Теперь на 0.63.
  STONE0: 150, GOLD0: 0.55, ORE_RATE: 0.08,
  C_ROOM: 240, C_PICK: 1100, C_GEAR: 900, GEAR_COST_STEP: 1.5, GEAR_STEP: 1.15,
  C_CART: 600, CART_COST_STEP: 1.5, CART_MAX: 5,
  ROOM_LVL_MAX: 5, ROOM_LVL_MULT: 1.55, ROOM_LVL_COST: 1.9, C_ROOM_LVL: 420,
  IMMIGRATE: 60, POP_CAP: 24,
  UPTIME_FULL: 0.75, LEVEL_MAX: 10, LEVEL_STEP: 0.08,
  WORK_SPAN: 300, SLEEP_BED: 90, SLEEP_FLOOR: 210, DRINK_SPAN: 30,
  MOOD_SPAN: 900, MOOD_LO: 0.70, MOOD_HI: 1.30,
  FAT_SLEEP: 85, MOOD_DRINK: 25,
  WALK: 30, SHAFT_SPEED: 2.6,   // по стволу быстрее: это лифт, иначе дварфы из верхних
                                // залов шли к глубокому забою полминуты и он пустовал
  MIN_DIGGERS: 2,
  // КРЕПЬ: забой не дальше стольких ярусов от самой глубокой комнаты. Введена после
  // плейтеста betav1 — «дварфы убегают вниз, а зданиям вечно есть место где-то ниже».
  // Симулятор: обязательный зал съедает 72% камня со своих пробоев.
  SUPPORT_SPAN: 4,
  // Клапан от тупика: камень падает только с пробоя, а крепь пробой запрещает.
  // Если игрок растратил камень, не поставив зал, — застрял бы навсегда. Поэтому
  // запертые дварфы «разбирают завал»: приносят камень понемногу.
  SCAV: 1.0,
  MUSH_RATE: 0.12, ALE_IN: 3, ALE_RATE: 0.06, SMELT_TIME: 40, INGOT_MULT: 2.5,
  // Эля за секунду питья. Выведено из симулятора: цикл настроения ~705 с, из них
  // 30 с в таверне, расход 0.004/с на дварфа → 0.1/с пока пьёт. Было «1 единица
  // в секунду» — вдесятеро больше, и одна пивоварня не могла напоить никого.
  ALE_DRINK: 0.1,
  STORE0: 900, STORE_STEP: 0.75,
  OFF_DIG: 0.02, OFF_PROD: 0.35, OFF_PROD_STEP: 1.12, OFF_PROD_MAX: 0.75,
  OFF_WINDOW: 8 * 3600, OFF_WINDOW_STEP: 2 * 3600, OFF_CAP: 24 * 3600,
  CARAVAN_EVERY: 600, CARAVAN_CD: 60,
  // Пока фургон у ворот, цена продажи выше — иначе таймер каравана чисто
  // декоративный: продать можно в любой момент, и «3:22» на кнопке ничего
  // не значит. Теперь прибытие — событие, которого есть смысл ждать.
  CARAVAN_BONUS: 1.25,
  // Раж v2 бьёт и по дварфам: в идл-игре с двумя дюжинами копателей ×5 только
  // к тапу игрока к середине игры не значил ничего, и rewarded обесценивался.
  RAGE_TIME: 60, RAGE_MULT: 5,
  // Ежедневный вход: золото масштабируется глубиной, самоцветы — константа

  DAILY: [{ g: 60 }, { gem: 4 }, { g: 90 }, { gem: 6 }, { g: 140 }, { gem: 8 }, { g: 200, gem: 10 }],
  // Вехи: маленькая награда самоцветами за естественные рубежи — глубина в
  // метрах, размер колонии, первая таверна и плавильня. Не механика, а
  // отметка на пути: тост, фанфара, +самоцветы. Старый сейв догоняет по одной.
  MILES: [['m100', 3], ['m200', 4], ['m400', 6], ['m800', 8], ['p6', 3], ['p12', 5], ['p24', 8], ['tav', 4], ['smelt', 5]],
  // Самоцветы покупают ровно то же, что и реклама. Без этого они копились впустую:
  // единственная валюта в игре, у которой не было ни одного стока.
  GEM_INSTANT: 6, GEM_RAGE: 4, GEM_DWARF: 10,

  // упирается в койки. Теперь их четыре — койка, найм, каверна, реклама/самоцветы.
  C_HIRE: 350, HIRE_STEP: 1.10,   // наём у каравана за золото, дорожает с населением
  // Шанс найти заблудившегося в каверне. На 0.16 каверны стали ГЛАВНЫМ источником
  // колонии и обесценили и койки, и найм — оставляю приятной редкостью.
  CAVE_DWARF: 0.06,
  INTER_CD: 180,
  SAVE_V: 1,
};

// Глубокие границы растянуты под укороченный ярус: иначе именованные пласты
// выгорали за пять дней. Ранние оставлены на месте — первый штрек нужен в первые
// три минуты, а растянув и их, я отодвинул его на четвёртую.
const STRATA = [
  { from: 1,   ore: -1, rock: '#5d4028', dark: '#3a2718', hall: '#7a5636', oreCol: '#8a6a3a' },
  { from: 6,   ore: 1,  rock: '#a89e84', dark: '#6e6550', hall: '#c4bba2', oreCol: '#c07a3a' },
  { from: 18,  ore: 2,  rock: '#76737f', dark: '#4b4954', hall: '#918e9c', oreCol: '#b9c0c8' },
  { from: 36,  ore: 3,  rock: '#454250', dark: '#2a2833', hall: '#5e5a6c', oreCol: '#e2e9f0' },
  { from: 60,  ore: 4,  rock: '#382e4a', dark: '#211a2e', hall: '#4e4166', oreCol: '#7fd8e8' },
  { from: 92,  ore: 5,  rock: '#472d3a', dark: '#2b1a23', hall: '#613e50', oreCol: '#8ef08e' },
  { from: 140, ore: 5,  rock: '#272031', dark: '#15111c', hall: '#3a3049', oreCol: '#8ef08e' },
];
const stratumIdx = n => { let i = 0; STRATA.forEach((s, j) => { if (n >= s.from) i = j; }); return i; };
const stratum = n => STRATA[stratumIdx(n)];

/* ── формулы ── */
const E = n => Math.pow(CFG.GROWTH, n - 1);
const pickTier = n => { let t = 0; CFG.PICK_YARUS.forEach((y, i) => { if (n >= y) t = i; }); return t; };
const pickStart = n => CFG.PICK_YARUS[pickTier(n)];
const pickDmg = t => CFG.PICK_D0 * Math.pow(CFG.PICK_STEP, t);
const rowsOf = () => CFG.ROWS;
const slotsOf = () => 2;
const expFace = n => Math.max(2, Math.min(CFG.BLOCK_W, Math.round(2 + n / 8)));
const expLevel = n => Math.min(CFG.LEVEL_MAX, 1 + n / 15);
const levelM = l => 1 + CFG.LEVEL_STEP * (l - 1);
const dwarfM = n => CFG.UPTIME_FULL * levelM(expLevel(n)) * 1.03;
const REF = n => pickDmg(pickTier(n)) * (1 + CFG.FACE_W * (expFace(n) - 1) * dwarfM(n));
function Tcurve(n) {
  const k = Math.min(1, (n - 1) / (CFG.T_RAMP - 1));
  const base = CFG.T_START + (CFG.T_PLATO - CFG.T_START) * k;
  const drift = 1 + (CFG.T_DRIFT - 1) * Math.max(0, n - CFG.T_RAMP) / 90;
  return base * drift * Math.pow(CFG.GROWTH, (n - pickStart(n)) * CFG.PILA_POW);
}
const hpOf = n => REF(n) * Tcurve(n) * CFG.ROWS / CFG.CALIB;

let st = null;

const BLOCK = 16, SURFACE_H = 44;

/* ── ГСЧ на сейве, чтобы дварфы не «перерождались» ── */
const rnd = () => { st.seed = (st.seed * 1664525 + 1013904223) % 4294967296; return st.seed / 4294967296; };

/* roomList зовут десятки раз за кадр (правила дварфов, availableRooms, HUD),
   а он каждый раз пересобирал массив из Object.keys. Кэш на кадр: комнаты
   внутри кадра не появляются, а lvl виден через ссылку на тот же объект.
   Ключ кэша — номер кадра плюс число комнат, чтобы стройка была видна сразу. */
let _rlF = -1, _rlN = -1, _rl = [];
const roomList = () => {
  const keys = Object.keys(st.rooms);
  if (_rlF === frame && _rlN === keys.length) return _rl;
  _rlF = frame; _rlN = keys.length;
  return _rl = keys.map(k => ({ key: k, y: +k.split(':')[0], slot: +k.split(':')[1], r: st.rooms[k] }));
};
const roomsOf = t => roomList().filter(o => o.r.t === t);

const bedsTotal = () => roomsOf('bed').reduce((a, o) => a + 2 * o.r.lvl, 0);

const gearM = () => Math.pow(CFG.GEAR_STEP, st.gear);
const offProd = () => Math.min(CFG.OFF_PROD_MAX, CFG.OFF_PROD * Math.pow(CFG.OFF_PROD_STEP, st.cart));

const worldTop = n => (n - 1) * CFG.ROWS * BLOCK;
const yarusH = () => CFG.ROWS * BLOCK;
const worldBottom = () => worldTop(st.yarus) + yarusH(st.yarus);
const rowY = () => worldTop(st.yarus) + st.row * BLOCK;
const colX = c => L.x0 + c * BLOCK + 1;      // спрайт 14 px в блоке 16
const blockHp = (n, type) => blockHpBase(n) * BTYPE[type];

function makeDwarf() {
  const ru = T === I18N.ru;
  const ti = Math.floor(rnd() * TRAITS.length);
  return {
    n1: Math.floor(rnd() * N1.length), n2: Math.floor(rnd() * N2.length), sr: Math.floor(rnd() * SUR.length),
    ti, c: Math.floor(rnd() * HAIR_N), lvl: 1, xp: 0, mood: 70 + rnd() * 20, fat: rnd() * 20,
    x: 0, y: 0, task: null, moving: false,

}
function addDwarf() {
  const d = makeDwarf();
  d.x = L.shaftX + 8; d.y = worldTop(Math.max(1, st.yarus - 1));
  st.dwarves.push(d); dirty = true;
