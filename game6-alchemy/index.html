  x.drawImage(src, 1, 1);

  const solid = (i, j) => i >= 0 && j >= 0 && i < w && j < h && a[(j * w + i) * 4 + 3] > 0;

  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++)

const FONT = {};
const FONT_H = 7, SPACE_W = 3, LETTER_SP = 1;
function buildFont() {
  for (const ch in GLYPHS) {
    const rows = GLYPHS[ch].split('|');
    if (rows.length !== FONT_H) continue;
    let lo = 5, hi = -1;
    for (let c = 0; c < 5; c++) for (let r = 0; r < FONT_H; r++)
      if (rows[r][c] === '#') { if (c < lo) lo = c; if (c > hi) hi = c; }
    if (hi < 0) { FONT[ch] = { rows: [], w: SPACE_W }; continue; }
    FONT[ch] = { rows: rows.map(r => r.slice(lo, hi + 1)), w: hi - lo + 1 };
  }
  FONT[' '] = { rows: [], w: SPACE_W };
}
function textW(s) {
  s = String(s).toUpperCase();
  let w = 0;
  for (const ch of s) { const g = FONT[ch] || FONT[' ']; w += g.w + LETTER_SP; }
  return Math.max(0, w - LETTER_SP);
}
function paintText(s, x, y, col) {
  ctx.fillStyle = col;
  let cx = x;
  for (const ch of String(s).toUpperCase()) {
    const g = FONT[ch] || FONT[' '];
    for (let r = 0; r < g.rows.length; r++) {
      const row = g.rows[r];
      for (let c = 0; c < row.length; c++) if (row[c] === '#') ctx.fillRect(cx + c, y + r, 1, 1);
    }
    cx += g.w + LETTER_SP;
  }
}
function text(s, x, y, col, shadow = '#160f1f') {
  x = Math.round(x); y = Math.round(y);
  if (shadow) paintText(s, x + 1, y + 1, shadow);
  paintText(s, x, y, col);
}
const textC = (s, cx, y, col, sh) => text(s, Math.round(cx - textW(s) / 2), y, col, sh);
const textR = (s, rx, y, col, sh) => text(s, Math.round(rx - textW(s)), y, col, sh);
function fitText(s, maxW) {
  s = String(s);
  if (textW(s) <= maxW) return s;
  while (s.length > 1 && textW(s + '.') > maxW) s = s.slice(0, -1);
  return s + '.';
}
function wrapText(s, maxW) {
  const words = String(s).split(' '), lines = [];
  let cur = '';
  for (const wd of words) {
    const t = cur ? cur + ' ' + wd : wd;
    if (textW(t) > maxW && cur) { lines.push(cur); cur = wd; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

  // иначе двое одинаковых в очереди читаются клонами
  const shade = (hex, k) => {
    const n = parseInt(hex.slice(1), 16);
    const ch = i => Math.max(0, Math.min(255, Math.round(((n >> i) & 255) * k)));

/* ═══════════════ Звук: shared/sfx.js ═══════════════
   Точечные эффекты вызываются по месту событий; здесь — музыка и эмбиент.
   Ночь — лидийский mood «alchemy», день — «dawn», под всем тлеет очаг.
   Разблокировку AudioContext по первому жесту библиотека делает сама.       */
function applyAudioPhase() {
  if (state.muted) return;
  SFX.music.start(state.phase === 'day' ? 'dawn' : 'alchemy', state.phase === 'day' ? .6 : .45);
  if (!SFX.amb.playing()) SFX.amb.start('hearth');
}

/* ═══════════════ Состояние ═══════════════ */
const now = () => Date.now();
const state = {
  coins: 0,
  known: BASE.slice(),                 // порядок открытия; базовые всегда первыми
  slots: [null, null],
  brew: null,                          // {id, t0, sec}
  shelves: [                           // прототип: две полки
    { potion: null, n: 0, t0: 0 },
    { potion: null, n: 0, t0: 0 },
  ],
  hand: [],                            // готовые склянки у прилавка, максимум 4
  phase: 'night',                      // ночью варим, днём продаём
  shift: false,                        // = (phase === 'day')
  shiftT0: 0,
  day: 1,
  plan: [],                            // план завтрашнего дня: кто придёт и за чем
  planIdx: 0,
  queue: [],                           // {cid, want:[{id,n}], phrase, t0}
  nextCome: 0,
  report: null,                        // отчёт смены
  stat: null,                          // накопление за смену
  muted: false,
  tried: new Set(),                    // испробованные пары «a|b» — гасим их в палитре
  lastMix: null,                       // {a, b, r} для строки состава
  palScroll: 0,
  toast: null,
  lastSeen: 0,                         // для попапа «пока тебя не было»
};
const SHELF_CAP = 5, HAND_CAP = 4, QUEUE_MAX = 5;
// цены полок подобраны симулятором (docs/superpowers/sim/alchemy-economy.js)
const SHELF_PRICES = [1000, 5000, 11000, 22000];

/* ═══════════════ Сейв и оффлайн ═══════════════
   Вся логика на Date.now(), поэтому оффлайн бесплатен: полки досчитывают
   склянки по таймстампам сами, как только состояние загружено. Сейв —
   раз в пять секунд из кадра и при уходе со вкладки. ?reset=1 стирает. */
const SAVE_KEY = 'alchemy_proto_v3';
let lastSave = 0;
function saveGame() {
  try {
    const s = { ...state, tried: [...state.tried], toast: null, lastSeen: now() };
    localStorage.setItem(SAVE_KEY, JSON.stringify(s));
  } catch (e) {}
}
function loadGame() {
  try {
    if (/[?&]reset=1/.test(location.search)) { localStorage.removeItem(SAVE_KEY); return false; }
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    Object.assign(state, s, { tried: new Set(s.tried || []), toast: null });
    const before = state.shelves.reduce((a, sh) => a + sh.n, 0);
    tickShelves();                                // полки наварили пока нас не было
    const made = state.shelves.reduce((a, sh) => a + sh.n, 0) - before;
    const away = now() - (s.lastSeen || now());
    if (away > 60000 && made > 0) say('Полки наварили ' + made + ' склянок.', 3500);
    else if (away > 60000) say('С возвращением. Ночь ' + state.day + '.', 2500);
    // день, истёкший без игрока, закрывается сам — отчёт увидим сразу
    if (state.phase === 'day' && now() - state.shiftT0 >= DAY_SEC * 1000) {
      state.stat = state.stat || { sold: 0, coins: 0, found: 0, left: 0, missed: 0 };
      closeDay();
    }
    return true;
  } catch (e) { return false; }
}
addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
addEventListener('pagehide', saveGame);

function say(s, ms = 1600) { state.toast = { s, until: now() + ms }; }
function stockOf(id) {
  let n = state.hand.filter(x => x === id).length;
  state.shelves.forEach(s => { if (s.potion === id) n += s.n; });
  return n;
}
function takeStock(id, count) {
  for (const s of state.shelves) {
    while (count > 0 && s.potion === id && s.n > 0) { s.n--; count--; }
  }
  for (let i = state.hand.length - 1; i >= 0 && count > 0; i--)
    if (state.hand[i] === id) { state.hand.splice(i, 1); count--; }
  return count === 0;
}
function addVial(id) {
  const sh = state.shelves.find(s => s.potion === id && s.n < SHELF_CAP);
  if (sh) { sh.n++; return 'полка'; }
  if (state.hand.length < HAND_CAP) { state.hand.push(id); return 'прилавок'; }
  return null;
}

/* ═══════════════ Смешивание: бросок в котёл ═══════════════
   Тап по палитре — элемент летит дугой в котёл. Первый остаётся плавать
   («основа»), второй запускает реакцию: котёл бурлит ~0.6 с и выдаёт
   результат — вспышку с искрами или серый пшик. Тап по котлу выплёскивает
   основу. Никаких слотов-ячеек: котёл и есть интерфейс.                  */
let flash = null;
let flyers = [], sparks = [], puffs = [], wisps = [], blips = [], coinsFly = [];
let reacting = null;                              // {a, b, t0}
const GOLD = ['#fff6dd', '#ffd54a', '#e08a1c'];
const SPLASH = ['#a9dcf5', '#6fc9dc', '#3f8ecc'];
const potMouth = () => ({ x: L.cau.x + (L.cau.w >> 1), y: L.cau.y + 3 });
function addFlyer(id, x0, y0, cb) {
  const m = potMouth();
  flyers.push({ id, x0, y0, x1: m.x, y1: m.y, t: 0, dur: .32, cb });
}
function addSparks(x, y, cols) {
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2, sp = 16 + Math.random() * 30;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 22, t: 0, life: .35 + Math.random() * .3, cols });
  }
}
function addPuff(x, y) {
  for (let i = 0; i < 7; i++)
    puffs.push({ x: x + ((Math.random() * 14) | 0) - 7, y: y - ((Math.random() * 4) | 0), t: 0, life: .5 + Math.random() * .3 });
}
function addBlips(n) {
  for (let i = 0; i < n; i++)
    blips.push({ dx: ((Math.random() * (L.cau.w - 16)) | 0) + 8 - (L.cau.w >> 1), age: -((Math.random() * 5) | 0) });
}
function addCoinFly(x0, y0, n) {                  // дуга монет от покупателя к кошельку
  for (let i = 0; i < n; i++) coinsFly.push({ x0, y0, t: -i * .07, dur: .45 });
}
function pullBase() {                             // выплеснуть основу из котла
  if (!state.slots[0] || reacting || flyers.length) return;
  const m = potMouth();
  addSparks(m.x, m.y, SPLASH);
  SFX.water({ v: .6, d: .35 });
  state.slots[0] = null;
}
function throwElement(id, x0, y0) {
  if (ui || state.report || reacting || flyers.length) return;
  SFX.tap({ v: .7 });
  if (!state.slots[0]) addFlyer(id, x0, y0, () => { state.slots[0] = id; state.lastMix = null; addBlips(3); SFX.water({ v: .45, d: .3 }); });
  // повторный тап по той же ячейке снимает основу — это основной способ передумать
  else if (state.slots[0] === id) pullBase();
  else addFlyer(id, x0, y0, () => { addBlips(10); SFX.spell({ v: .5 }); reacting = { a: state.slots[0], b: id, t0: now() }; });
}
function resolveMix(a, b) {
  const k = key2(a, b), r = RMAP[k];
  state.tried.add(k);
  state.lastMix = { a, b, r: r || null };
  const m = potMouth();
  if (!r) { addPuff(m.x, m.y - 4); SFX.drop({ v: .8 }); return; }
  const isNew = !state.known.includes(r);
  if (isNew) {
    state.known.push(r);
    flash = { id: r, t: 0 };
    addSparks(m.x, m.y - 2, GOLD);
    SFX.reveal();
    if (state.stat) state.stat.found++;
  }
  // таймер варки только у зелий: ингредиент — знание, оно появляется мгновенно
  if (!isPotion(r)) return;
  /* Днём склянки не варятся — открывать можно, производить нельзя. Симулятор
     показал: пока днём можно сварить заказ при клиенте, весь идл-контур (полки,
     вместимость, подмастерья) экономически мёртв. День живёт ночным запасом. */
  if (state.phase === 'day') { say('Днём торгуем. Склянки ждут ночи.', 2000); return; }
  if (state.brew) { say('Котёл занят — ' + EL[r].n + ' в другой раз.'); return; }
  const room = state.shelves.some(s => s.potion === r && s.n < SHELF_CAP) || state.hand.length < HAND_CAP;
  if (!room) { say('Некуда ставить: полки и прилавок полны.'); return; }
  state.brew = { id: r, t0: now(), sec: brewSec(r) };
}
// обёртка для скриптовых проверок: кладёт пару и разрешает её мгновенно
function tryMix() {
  const [a, b] = state.slots;
  if (!a || !b) return;
  state.slots = [a, null];
  resolveMix(a, b);
}
function tickBrew() {
  if (!state.brew) return;
  if (now() - state.brew.t0 < state.brew.sec * 1000) return;
  const id = state.brew.id;
  state.brew = null;
  if (!isPotion(id)) { say(EL[id].n + ' — не товар, но рецепт записан.'); return; }
  const where = addVial(id);
  if (where) SFX.bell({ v: .3 }); else SFX.error({ v: .5 });
  say(where ? EL[id].n + ' → ' + where : 'Некуда ставить: всё занято.');
}
function tickShelves() {
  const t = now();
  for (const s of state.shelves) {
    if (!s.potion || s.n >= SHELF_CAP) { if (s.potion) s.t0 = t; continue; }
    const per = shelfSec(s.potion) * 1000;
    while (s.n < SHELF_CAP && t - s.t0 >= per) { s.n++; s.t0 += per; }
  }
}

/* ═══════════════ День и ночь ═══════════════
   Ночь без таймера: варим и исследуем. День ровно DAY_SEC секунд, на закате
   закрывается сам. План следующего дня составляется на закате и виден всю
   ночь — кто в прогнозе, тот и придёт, ничего сверх плана.                 */
const DAY_SEC = 180, PLAN_MIN = 4, PLAN_MAX = 6;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function makePlan() {
  const openPot = POTIONS.filter(p => state.known.includes(p));
  state.plan = []; state.planIdx = 0;
  if (!openPot.length) return;
  // спрос растёт с ассортиментом — лавка становится известнее (вывод симулятора:
  // при постоянных 4–6 покупателях апгрейды перестают окупаться на второй ступени)
  const n = PLAN_MIN + Math.floor(openPot.length / 3) + Math.floor(Math.random() * (PLAN_MAX - PLAN_MIN + 1));
  let prev = null;                       // два одинаковых подряд читаются клонами
  for (let i = 0; i < n; i++) {
    let cands = CUSTOMERS.filter(c => c.pref.some(p => openPot.includes(p)));
    if (!cands.length) cands = CUSTOMERS;
    const fresh = cands.filter(c => c.id !== prev);
    const c = pick(fresh.length ? fresh : cands);
    prev = c.id;
    const pool = c.pref.filter(p => openPot.includes(p));
    const id = pool.length ? pick(pool) : pick(openPot);
    state.plan.push({ cid: c.id, id, n: 1 + (Math.random() < .3 ? 1 : 0) });
  }
}
// прогноз для прилавка: сколько каких зелий понадобится завтра
function planNeeds() {
  const m = {};
  state.plan.forEach(p => { m[p.id] = (m[p.id] || 0) + p.n; });
  return Object.entries(m);
}
function openDay() {
  if (!POTIONS.some(p => state.known.includes(p))) { say('Нечего продавать — открой зелье.', 2200); return; }
  if (!state.plan.length) makePlan();
  state.phase = 'day'; state.shift = true; state.shiftT0 = now();
  state.queue = []; state.planIdx = 0; state.nextCome = now() + 1500;
  state.stat = { sold: 0, coins: 0, found: 0, left: 0, missed: 0 };
  fade = { from: 'night', t0: now() };
  SFX.open(); applyAudioPhase(); saveGame();
  say('Рассвет. Лавка открыта.');
}
function closeDay() {
  // упущенная выгода: и те, кто стоял в очереди, и те, кто не успел прийти
  let missed = 0, left = state.queue.length;
  state.queue.forEach(q => q.want.forEach(w => { missed += priceOf(w.id) * w.n; }));
  for (let i = state.planIdx; i < state.plan.length; i++) {
    left++; missed += priceOf(state.plan[i].id) * state.plan[i].n;
  }
  state.stat.left = left; state.stat.missed = missed;
  state.stat.day = state.day;
  // необслуженные уходят — видимо, а не исчезают
  if (L) state.queue.forEach((q, i) => leavers.push({ cid: q.cid, v: q.v, x: L.cnt.x + 3 + i * 13, t0: now() }));
  state.phase = 'night'; state.shift = false; state.queue = [];
  state.day++;
  makePlan();                                   // прогноз на завтра — сразу
  state.stat.next = planNeeds();
  state.report = state.stat; state.stat = null;
  fade = { from: 'day', t0: now() };
  SFX.close(); applyAudioPhase(); saveGame();
}
function spawnFromPlan() {
  if (state.queue.length >= QUEUE_MAX || state.planIdx >= state.plan.length) return;
  const p = state.plan[state.planIdx++];
  const line = pick(EL[p.id].req || CMAP[p.cid].come) + (p.n > 1 ? ' ' + p.n + ' ШТ.' : '');
  state.queue.push({ cid: p.cid, v: (Math.random() * 3) | 0, want: [{ id: p.id, n: p.n }], phrase: line, t0: now() });
}
const spawnCustomer = spawnFromPlan;            // имя для скриптовых проверок
function tickQueue() {
  if (state.phase !== 'day') return;
  if (now() - state.shiftT0 >= DAY_SEC * 1000) { closeDay(); return; }
  if (now() >= state.nextCome) {
    spawnFromPlan();
    state.nextCome = now() + (8000 + Math.random() * 7000);
  }
}
const openShift = openDay, closeShift = closeDay;
function serve(i) {
  const c = state.queue[i];
  if (!c) return;
  const ok = c.want.every(w => stockOf(w.id) >= w.n);
  if (!ok) { say('Этого нет в наличии.'); SFX.error({ v: .6 }); return; }
  let sum = 0;
  c.want.forEach(w => { takeStock(w.id, w.n); sum += priceOf(w.id) * w.n; });
  if (c.cid === 'witch') sum = Math.round(sum * 1.5);       // ведьма платит больше
  state.coins += sum;
  state.stat.sold += c.want.reduce((a, w) => a + w.n, 0);
  state.stat.coins += sum;
  const nCoins = Math.min(6, 2 + ((sum / 25) | 0));
  addCoinFly(L.cnt.x + 3 + i * 13 + 6, L.cnt.y - 6, nCoins);
  SFX.coins({ n: nCoins });
  leavers.push({ cid: c.cid, v: c.v, x: L.cnt.x + 3 + i * 13, t0: now() });   // уходит вправо
  state.queue.splice(i, 1);
  // надбавку ведьмы показываем словами, иначе ×1.5 остаётся невидимым правилом
  say(c.cid === 'witch' ? 'Ведьма платит щедро: +' + sum : pick(CMAP[c.cid].thanks) + ' +' + sum);
}

/* ═══════════════ Рисование ═══════════════ */
let hits = [], animT = 0, F4 = 0, F8 = 0, prevF8 = -1;

function panel(x, y, w, h) {

  ctx.fillStyle = '#e8b04b';                       // латунные гвоздики по углам
  ctx.fillRect(x + 1, y + 1, 1, 1); ctx.fillRect(x + w - 2, y + 1, 1, 1);

const BTN = {
  green: ['#3fae52', '#237a32', '#6ed67f'], gold: ['#c8951e', '#8a6412', '#f0d060'],
  grey: ['#5b5566', '#3d3947', '#807a8c'], purple: ['#7a4ab0', '#4e2b73', '#a273d8'],
};
function button(x, y, w, h, label, kind, fn) {
  const c = BTN[kind] || BTN.grey;
  slab(x, y, w, h, c[0], c[1], c[2]);
  const lb = fitText(label, w - 6);
  text(lb, x + Math.floor((w - textW(lb)) / 2), y + Math.floor((h - FONT_H) / 2), fn ? '#ffffff' : '#b8b2c4');
  if (fn) pushHit(x, y, w, h, fn);

function meter(x, y, w, p, col) {
  p = Math.max(0, Math.min(1, p));

  if (f > 0) { ctx.fillStyle = col; ctx.fillRect(x + 1, y + 1, f, 1); }
}

/* Комната запекается в оффскрин один раз на размер: кирпич с вариацией,
   виньетка и свет — дизерингом (альфы по канону нет), пол с волокнами,
   очаг под котлом. В кадре остаётся один drawImage, анимация — поверх. */
let roomBufs = {};
// две палитры комнаты: фаза меняет материалы, а не накладывает фильтр
const PH = {
  night: { wall: '#241a35', br: ['#3d2d52', '#342647', '#2e2244'], top: '#3f3057',
           floor: '#55402c', ftop: '#6b5038', seam: '#463421', plank: '#42311f',
           fib: ['#5e4830', '#4a3725'], vig: '#1a1226', vigA: 5, vigB: 11,
           wl: ['#43305c', '#3b2a50'], fl: ['#6b4d33', '#5e4530'], win: 'window' },
  day:   { wall: '#4a3a66', br: ['#69538c', '#5d4880', '#564178'], top: '#7460a0',
           floor: '#7a5c3c', ftop: '#96714c', seam: '#68503a', plank: '#634b33',
           fib: ['#8f6d46', '#6e5438'], vig: '#2e2244', vigA: 3, vigB: 7,
           wl: ['#7d68a8', '#7460a0'], fl: ['#a37f56', '#8f6d46'], win: 'windowDay' },
};
function buildRoom() { roomBufs = { night: bakeRoom('night'), day: bakeRoom('day') }; }
function bakeRoom(phase) {
  const P = PH[phase];
  const cv = document.createElement('canvas'); cv.width = LW; cv.height = LH;
  const rc = cv.getContext('2d');
  let seed = 0x5eed;
  const rr = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const floorY = L.land ? L.y1 - 22 : L.y1 - 16;

  // стена: кладка со случайной тональностью, редкие сколы, светлая грань сверху
  rc.fillStyle = P.wall; rc.fillRect(0, 0, LW, floorY);
  for (let y = L.y0 - 6; y < floorY; y += 6) {
    const off = ((y / 6) | 0) % 2 * 8;
    for (let x = off - 16; x < LW; x += 16) {
      const v = rr();
      rc.fillStyle = v < .12 ? P.br[0] : v < .82 ? P.br[1] : P.br[2];
      rc.fillRect(x, y, 15, 5);
      rc.fillStyle = P.top; rc.fillRect(x, y, 15, 1);
      if (v > .93) { rc.fillStyle = P.wall; rc.fillRect(x + 3 + ((rr() * 8) | 0), y + 2, 2, 1); }
    }
  }
  // пол: доски, стыки, волокна, плинтусная тень
  rc.fillStyle = P.floor; rc.fillRect(0, floorY, LW, L.y1 - floorY);
  rc.fillStyle = P.ftop; rc.fillRect(0, floorY, LW, 1);
  rc.fillStyle = P.vig; rc.fillRect(0, floorY - 1, LW, 1);
  const seamY = floorY + ((L.y1 - floorY) >> 1);
  rc.fillStyle = P.seam; rc.fillRect(0, seamY, LW, 1);
  for (let x = 0; x < LW; x += 11) {
    rc.fillStyle = P.plank;
    rc.fillRect(x, floorY + 1, 1, seamY - floorY - 1);
    rc.fillRect(x + 5, seamY + 1, 1, L.y1 - seamY - 1);
  }
  for (let i = 0; i < LW / 3; i++) {
    rc.fillStyle = rr() < .5 ? P.fib[0] : P.fib[1];
    rc.fillRect((rr() * LW) | 0, floorY + 2 + ((rr() * (L.y1 - floorY - 3)) | 0), 1 + ((rr() * 3) | 0), 1);
  }
  // виньетка: углы и кромки темнее, две плотности дизеринга
  for (let y = L.y0; y < L.y1; y++) for (let x = 0; x < LW; x++) {
    const e = Math.min(x, LW - 1 - x, (y - L.y0) * 2, (L.y1 - y) * 3);
    if ((e < P.vigA && (x + y) % 2 === 0) || (e < P.vigB && (x + y) % 4 === 0)) {
      rc.fillStyle = P.vig; rc.fillRect(x, y, 1, 1);
    }
  }
  if (L.win) rc.drawImage(SPRITES[P.win], L.win.x, L.win.y);
  /* Дневной свет — вертикальный шафт из окна, а не радиальное пятно: радиальное
     на манхэттенской метрике давало ромб из диагоналей и читалось глитчем. */
  if (phase === 'day' && L.win) {
    const wx = L.win.x + 1, ww = SW(P.win) - 2;
    const top = L.win.y + SH(P.win) - 1;
    for (let y = top; y < L.y1; y++) {
      const k = (y - top) / (L.y1 - top);            // чем ниже, тем реже точки
      const drift = Math.round(k * 6);               // луч уходит вправо
      const wall = y < floorY;
      for (let x = wx + drift; x < wx + ww + drift; x++) {
        if (x < 0 || x >= LW) continue;
        const edge = Math.min(x - (wx + drift), wx + ww + drift - 1 - x);
        const dense = k < .35 && edge > 1 ? 2 : k < .7 ? 4 : 8;
        if ((x + y) % dense) continue;
        rc.fillStyle = wall ? (k < .35 ? '#8a76b4' : '#7d68a8') : (k < .7 ? '#b08c60' : '#a37f56');
        rc.fillRect(x, y, 1, 1);
      }
    }
  }
  // очаг: камни под котлом
  const hx = L.cau.x + (L.cau.w >> 1), hy = L.y1 - 2;
  rc.fillStyle = '#2e2a38';
  for (let i = -3; i <= 3; i++) rc.fillRect(hx + i * 5 - 2, hy - 2 + (Math.abs(i) > 1 ? 0 : 1), 4, 2);
  rc.fillStyle = '#3a3542';
  for (let i = -2; i <= 2; i++) rc.fillRect(hx + i * 5, hy - 3, 3, 2);
  // свет: плотность дизеринга падает с расстоянием. Ночью — очаг и свечи,
  // днём — очаг и прохладный поток из окна.
  const lights = [{ x: hx, y: L.y1 - 8, r: 30, w: P.wl, f: P.fl }];
  if (phase === 'night') (L.candles || []).forEach(c => lights.push({ x: c.x + 2, y: c.y, r: 16, w: P.wl, f: P.fl }));
  for (const li of lights) {
    for (let y = Math.max(L.y0, li.y - li.r); y < Math.min(L.y1, li.y + li.r); y++)
      for (let x = Math.max(0, li.x - li.r); x < Math.min(LW, li.x + li.r); x++) {
        const d = Math.abs(x - li.x) + Math.abs(y - li.y) * 1.5;
        const wall = y < floorY;
        if (d < li.r * .45 && (x + y) % 2 === 0) rc.fillStyle = wall ? li.w[0] : li.f[0];
        else if (d < li.r && (x + y) % 4 === 0) rc.fillStyle = wall ? li.w[1] : li.f[1];
        else continue;
        rc.fillRect(x, y, 1, 1);
      }

  (L.clutter || []).forEach(cl => {
    if (cl.bracket) {                             // bx растягивает полочку влево — под свечу
      rc.fillStyle = '#4a3624';
      rc.fillRect(cl.x - 1 + (cl.bx || 0), cl.y + SH(cl.s) - 1, SW(cl.s) + 2 - (cl.bx || 0), 2);
    }
    rc.drawImage(SPRITES[cl.s], cl.x, cl.y);
  });

}
/* Смена фазы — дизер-переход, а не мгновенная подмена и не альфа (канон):

}
function drawRoom() {

  });

  if (!meteor && Math.random() < .0025) meteor = { x: 2 + Math.random() * 10, y: 1 + Math.random() * 3, t0: now() };
  if (meteor) {
    const k = (now() - meteor.t0) / 450;
    if (k >= 1) meteor = null;
    else {
      const mx = L.win.x + Math.round(meteor.x + k * 10), my = L.win.y + Math.round(meteor.y + k * 5);
      for (let i = 0; i < 3; i++) {
        const px = mx - i, py = my - (i >> 1);
        if (px > L.win.x && px < L.win.x + 25 && py > L.win.y && py < L.win.y + 9) {

const SHELF_SHOWN = 4;
function drawShelves() {

  const rowH = Math.floor((s.h - 11) / shown);
  for (let i = 0; i < shown; i++) {

    ctx.fillStyle = '#5a4230'; ctx.fillRect(s.x + 2, baseY, s.w - 4, 2);
    ctx.fillStyle = '#3a2a1c'; ctx.fillRect(s.x + 2, baseY + 2, s.w - 4, 1);
    const sh = state.shelves[i];
    if (!sh) {                                    // доска под апгрейд — покупается тапом
      const price = SHELF_PRICES[Math.min(SHELF_PRICES.length - 1, i - 2)];

      text(fitText('+ ПОЛКА ' + price, s.w - 10), s.x + 5, cy + 1, can ? '#8ee0a0' : '#6a5a82');
      pushHit(s.x, ry, s.w, rowH, () => {

        state.coins -= price;
        state.shelves.push({ potion: null, n: 0, t0: 0 });
        SFX.coins({ n: 4 }); say('Новая полка. Назначь зелье.'); saveGame();
      });
      continue;
    }
    if (sh.potion) {
      const shown = Math.min(sh.n, Math.max(1, Math.floor((s.w - 30) / 7)));
      for (let k = 0; k < shown; k++) {
        const vx = s.x + 4 + k * 7;
        spr('sm_' + sh.potion, vx, cy);

        if (state.phase === 'night' && (F4 + k * 2 + i) % 5 === 0) {
          ctx.fillStyle = EL[sh.potion].p[2];

        }

      const nx = s.x + 6 + shown * 7;
      const nmax = (s.x + s.w - 4 - textW(cnt)) - nx - 3;
      if (nmax > 8) text(fitText(EL[sh.potion].n, nmax), nx, cy + 1, '#e8dcf5');
      textR(cnt, s.x + s.w - 4, cy + 1, '#9a86b5');

        const per = shelfSec(sh.potion) * 1000;
        meter(s.x + 3, ry, s.w - 6, ((now() - sh.t0) % per) / per, '#5fc9a8');
      }
    } else {
      text('ПУСТО — ТАП', s.x + 5, cy + 1, '#6a5a82');
    }

  }

function drawFx(dt) {
  flyers.forEach(f => { f.t += dt; });
  const done = flyers.filter(f => f.t >= f.dur);
  flyers = flyers.filter(f => f.t < f.dur);
  done.forEach(f => f.cb());
  for (const f of flyers) {
    const k = f.t / f.dur;
    const x = Math.round(f.x0 + (f.x1 - f.x0) * k);
    const y = Math.round(f.y0 + (f.y1 - f.y0) * k - 16 * Math.sin(Math.PI * k));
    spr('el_' + f.id, x - 6, y - 6);
  }
  sparks = sparks.filter(s => (s.t += dt) < s.life);
  for (const s of sparks) {
    const k = s.t / s.life;
    ctx.fillStyle = s.cols[Math.min(s.cols.length - 1, (k * s.cols.length) | 0)];
    ctx.fillRect(Math.round(s.x + s.vx * s.t), Math.round(s.y + s.vy * s.t + 60 * s.t * s.t), 1, 1);
  }
  puffs = puffs.filter(p => (p.t += dt) < p.life);
  for (const p of puffs) {
    const k = p.t / p.life;
    ctx.fillStyle = k < .4 ? '#c4c0cf' : k < .75 ? '#8b8798' : '#565266';
    const sz = k < .5 ? 2 : 1;
    ctx.fillRect(Math.round(p.x + ((p.x % 2) ? 3 : -3) * k), Math.round(p.y - 10 * k), sz, sz);
  }
  for (const w of wisps) {
    ctx.fillStyle = w.age < 3 ? '#c9c2d8' : w.age < 6 ? '#948aa8' : '#655a7d';
    ctx.fillRect(w.x, w.y, w.age < 4 ? 2 : 1, w.age < 4 ? 2 : 1);
  }
  coinsFly = coinsFly.filter(c => (c.t += dt) < c.dur);
  for (const c of coinsFly) {
    if (c.t < 0) continue;
    const k = c.t / c.dur;
    ctx.drawImage(SPRITES.coin, Math.round(c.x0 + (7 - c.x0) * k),
                  Math.round(c.y0 + (6 - c.y0) * k - 18 * Math.sin(Math.PI * k)));
  }
}

function tickFx() {

function drawCounter() {
  const c = L.cnt;

     уходят вправо за 0,45 с — очередь живёт, а не телепортируется. */
  const ease = k => 1 - (1 - k) * (1 - k);
  const posX = (i, q) => {
    const slot = c.x + 3 + i * 13, k = Math.min(1, (now() - q.t0) / 400);
    return Math.round(slot + (LW - slot) * (1 - ease(k)));
  };

  });

    if (c.x + 3 + i * 13 + 12 > c.x + c.w) return;

  ctx.fillStyle = '#8a6640'; ctx.fillRect(c.x + 1, c.y + 1, c.w - 2, 2);
  ctx.fillStyle = '#2f2013'; ctx.fillRect(c.x + 1, c.y + c.h - 2, c.w - 2, 1);
  ctx.fillStyle = '#3d2b1a'; ctx.fillRect(c.x + 2, c.y + c.h, c.w - 4, 1);   // тень на полу

  // пузыри и зоны тапа — поверх стойки
  state.queue.forEach((q, i) => {
    const cx = posX(i, q);
    if (c.x + 3 + i * 13 + 12 > c.x + c.w) return;
    if (i === 0 && now() - q.t0 > 400) {
      // пузырь: только иконки — заказ понятен без чтения
      const iw = q.want.length * 13 + 6;
      const bx = Math.min(cx - 2, c.x + c.w - iw), by = c.y - cusH - 16;
      ctx.fillStyle = '#160f1f'; ctx.fillRect(bx, by, iw, 15);
      ctx.fillStyle = '#f0e6d2'; ctx.fillRect(bx + 1, by + 1, iw - 2, 13);
      ctx.fillRect(bx + 4, by + 15, 3, 2);
      q.want.forEach((w, k) => {
        ctx.drawImage(SPRITES['el_' + w.id], bx + 3 + k * 13, by + 2, 12, 12);
        if (w.n > 1) text('×' + w.n, bx + 3 + k * 13 + 6, by + 8, '#2f2340', null);
      });
    }
    pushHit(cx - 1, c.y - cusH, 14, cusH + 4, () => serve(i));
  });

  // реплика первого в очереди — строкой на стойке, не в пузыре
  const inner = c.w - 6;
  if (state.queue.length) {
    const q = state.queue[0];
    const lines = wrapText(q.phrase, inner);
    if (L.land || lines.length === 1) text(fitText(q.phrase, inner), c.x + 3, c.y + 4, '#f0e6d2');
    else { text(fitText(lines[0], inner), c.x + 3, c.y + 1, '#f0e6d2'); text(fitText(lines[1] || '', inner), c.x + 3, c.y + 8, '#f0e6d2'); }
  } else if (state.phase === 'day') {
    text('ЖДЁМ ПОКУПАТЕЛЕЙ', c.x + 3, c.y + 4, '#c9b0a0');
  } else {

    else {
      text('ЗАВТРА:', c.x + 3, c.y + 4, '#e8b04b');
      let nx = c.x + 5 + textW('ЗАВТРА:');
      needs.forEach(([id, n]) => {
        if (nx + 12 > c.x + c.w - 2) return;
        const have = stockOf(id) >= n;
        spr('sm_' + id, nx, c.y + 3);
        text(String(n), nx + 6, c.y + 4, have ? '#8ee0a0' : '#e0a08e');   // хватает ли запаса
        nx += 6 + textW(String(n)) + 4;
      });
    }
  }

  // готовые склянки у прилавка
  state.hand.forEach((id, k) => {
    const hx = c.x + c.w - 11 - k * 7, hy = c.y - 8;     // стоят НА стойке, а не висят
    if (hx < c.x + 2) return;
    spr('sm_' + id, hx, hy);
    if (state.phase === 'night' && (F4 + k * 3) % 5 === 0) {   // светятся, как и на полках
      ctx.fillStyle = EL[id].p[2]; ctx.fillRect(hx - 1, hy + 4, 1, 1); ctx.fillRect(hx + 5, hy + 3, 1, 1);
    }
  });

  // вывеска смены — сама кнопка: висит на верёвочках и переключает фазу

  ctx.fillRect(bx + 2, by - 2, 1, 2); ctx.fillRect(bx + bw - 3, by - 2, 1, 2);

         () => { state.phase === 'day' ? closeDay() : openDay(); });

function drawPalette() {
  const py = L.y1;
  ctx.fillStyle = '#1c1528'; ctx.fillRect(0, py, LW, LH - py);
  ctx.fillStyle = '#55446e'; ctx.fillRect(0, py, LW, 1);

  const rest = restList();
  const g = L.palGrid;
  const maxScroll = Math.max(0, Math.ceil(rest.length / g.cols) - g.rows);
  state.palScroll = Math.max(0, Math.min(maxScroll, state.palScroll));
  drawMixLine(py + 1, maxScroll > 0 ? 22 : 0);
  if (maxScroll > 0) {
    if (state.palScroll > 0) button(LW - 21, py + 1, 9, 7, '-', 'grey', () => state.palScroll--);
    if (state.palScroll < maxScroll) button(LW - 11, py + 1, 9, 7, '+', 'grey', () => state.palScroll++);
  }

  BASE.forEach((id, i) => palCell(L.palBase.x + i * L.PITCH, L.palBase.y, id, true));
  ctx.fillStyle = '#8a6640'; ctx.fillRect(L.spine.x, L.spine.y, L.spine.w, L.spine.h);

  const first = state.palScroll * g.cols;
  for (let k = 0; k < g.cols * g.rows; k++) {
    const idx = first + k;
    if (idx >= rest.length) break;
    palCell(g.x + (k % g.cols) * L.PITCH, g.y + Math.floor(k / g.cols) * L.PITCH, rest[idx], false);
  }
}

  // фраза не влезает в строку, поэтому переносим по словам — до двух строк
  const s = state.toast.s, maxW = LW - 8;
  const lines = textW(s) <= maxW ? [s] : wrapText(s, maxW).slice(0, 2);
  const w = Math.min(maxW, Math.max(...lines.map(textW)) + 8);
  const h = 4 + lines.length * 8;
  const x = Math.floor((LW - w) / 2), y = L.y0 + 1;
  slab(x, y, w, h, '#e8d8b0', '#c9b688', '#f4ead0');   // пергаментная записка
  lines.forEach((ln, i) => textC(fitText(ln, w - 6), LW / 2, y + 2 + i * 8, '#3a2a1c', null));
}
function drawFlash() {
  if (!flash) return;
  flash.t++;
  if (flash.t > 90) { flash = null; return; }
  const e = EL[flash.id];
  const w = Math.min(LW - 14, Math.max(textW(e.n), textW('НОВАЯ ЗАПИСЬ В ЖУРНАЛЕ')) + 30);
  const x = Math.floor((LW - w) / 2), y = L.y0 + 20;
  // пергаментная карточка с золотой рамкой; рамка мерцает по кадровому счётчику
  ctx.fillStyle = F4 % 2 ? '#e8b04b' : '#f0d060'; ctx.fillRect(x - 2, y - 2, w + 4, 32);
  ctx.fillStyle = '#3a2a1c'; ctx.fillRect(x - 1, y - 1, w + 2, 30);
  ctx.fillStyle = '#e8d8b0'; ctx.fillRect(x, y, w, 28);
  ctx.fillStyle = '#f4ead0'; ctx.fillRect(x, y, w, 1);
  ctx.drawImage(SPRITES['el_' + flash.id], x + 4, y + 7, 14, 14);
  text('НОВАЯ ЗАПИСЬ В ЖУРНАЛЕ', x + 22, y + 4, '#8a6412', null);
  text(fitText(e.n, w - 26), x + 22, y + 14, '#3a2a1c', null);
}

/* ── оверлеи ── */
let ui = null;                                    // null, 'journal', 'shelf' или 'report'
function dim() { ctx.fillStyle = ditherPat; ctx.fillRect(0, 0, LW, LH); }
/* ── Журнал алхимика: пергамент, корешок, закладки-ярлычки ── */
const TABS = [
  { k: 'base', n: 'ОСНОВЫ', s: 'ОСН', col: '#c85a3a', ids: () => BASE },
  { k: 'ing',  n: 'ИНГРЕД.', s: 'ИНГР', col: '#3a8ac8', ids: () => Object.keys(EL).filter(id => !BASE.includes(id) && !isPotion(id)) },
  { k: 'pot',  n: 'ЗЕЛЬЯ',  s: 'ЗЕЛ', col: '#5fc95a', ids: () => POTIONS },
];
let jTab = 0, jPick = null;
const recipeOf = id => RECIPES.find(r => r[2] === id);
function drawJournal() {
  dim();
  const w = Math.min(LW - 6, 210), h = Math.min(LH - 16, 158);
  const x = Math.floor((LW - w) / 2), y = Math.floor((LH - h) / 2);
  // страницы пергамента и тёмный корешок
  ctx.fillStyle = '#3a2a1c'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#e8d8b0'; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
  ctx.fillStyle = '#d0bd93'; ctx.fillRect(x + 2, y + 2, w - 4, 1);
  const twoPage = w >= 150;
  if (twoPage) { ctx.fillStyle = '#3a2a1c'; ctx.fillRect(x + Math.floor(w / 2) - 1, y + 2, 2, h - 4); }
  textC('ЖУРНАЛ АЛХИМИКА', x + w / 2, y + 5, '#5a4230', null);

  // закладки: ярлычки торчат из края книги
  const tw = Math.floor((w - 8) / TABS.length);
  TABS.forEach((t, i) => {
    const tx = x + 4 + i * tw, ty = y + 13;
    ctx.fillStyle = '#3a2a1c'; ctx.fillRect(tx, ty, tw - 2, 10);
    ctx.fillStyle = i === jTab ? t.col : '#a89878'; ctx.fillRect(tx + 1, ty + 1, tw - 4, 8);
    const lbl = textW(t.n) <= tw - 6 ? t.n : t.s;
    textC(fitText(lbl, tw - 6), tx + (tw - 2) / 2, ty + 2, i === jTab ? '#f0e6d2' : '#3a2a1c', null);
    pushHit(tx, ty, tw - 2, 10, () => { jTab = i; jPick = null; });
  });

  const ids = TABS[jTab].ids();
  const openN = ids.filter(id => state.known.includes(id)).length;
  text(openN + ' ИЗ ' + ids.length, x + 5, y + 26, '#7a6a4a', null);

  // левая страница — оглавление; сетка не перетекает через корешок
  const pageW = twoPage ? Math.floor(w / 2) - 1 : w;
  const cols = Math.max(3, Math.floor((pageW - 10) / 18));
  const gy = y + 35, gBot = y + h - (twoPage ? 16 : (jPick && isPotion(jPick) ? 54 : 28));
  const rows = Math.max(1, Math.floor((gBot - gy) / 18));
  ids.forEach((id, i) => {
    if (i >= cols * rows) return;
    const cx = x + 5 + (i % cols) * 18, cy = gy + Math.floor(i / cols) * 18;
    const open = state.known.includes(id);
    ctx.fillStyle = '#a89878'; ctx.fillRect(cx, cy, 16, 16);
    ctx.fillStyle = open ? '#e8d8b0' : '#c0b090'; ctx.fillRect(cx + 1, cy + 1, 14, 14);
    if (open) spr('el_' + id, cx + 2, cy + 2);
    else textC('?', cx + 8, cy + 5, '#8a7a5a', null);
    if (jPick === id) { ctx.fillStyle = TABS[jTab].col; ctx.fillRect(cx, cy, 16, 1); ctx.fillRect(cx, cy + 15, 16, 1); }
    if (open) pushHit(cx, cy, 16, 16, () => { jPick = jPick === id ? null : id; });
  });

  // правая страница — страница выбранного элемента (в портрете её место внизу)
  const drawPage = (px, py, pw) => {
    if (!jPick) { text('ТАП ПО ЗАПИСИ —', px, py, '#a89878', null); text('ОТКРОЕТСЯ СТРАНИЦА', px, py + 8, '#a89878', null); return; }
    ctx.drawImage(SPRITES['el_' + jPick], px, py, 24, 24);      // целый множитель ×2
    // название переносим по словам, а не обрезаем: «ЭЛИКСИР ЗРЕНИЯ» должен читаться целиком
    wrapText(EL[jPick].n, pw - 30).slice(0, 2).forEach((ln, k) => text(ln, px + 28, py + 3 + k * 9, '#3a2a1c', null));
    const r = recipeOf(jPick);
    let ly = py + 28;
    wrapText(r ? EL[r[0]].n + ' + ' + EL[r[1]].n : 'БАЗОВЫЙ ЭЛЕМЕНТ', pw).slice(0, 2)
      .forEach(ln => { text(ln, px, ly, '#7a6a4a', null); ly += 9; });
    ly += 2;
    if (isPotion(jPick)) {
      text('ЦЕНА ' + priceOf(jPick), px, ly, '#8a6412', null); ly += 9;
      text('ВАРКА ' + brewSec(jPick) + ' С', px, ly, '#8a6412', null); ly += 9;
      const sh = state.shelves.find(s => s.potion === jPick);
      text(sh ? 'НА ПОЛКЕ ' + sh.n + '/' + SHELF_CAP : 'НЕ НА ПОЛКЕ', px, ly, '#7a6a4a', null); ly += 11;
    }
    const uses = RECIPES.filter(q => (q[0] === jPick || q[1] === jPick) && state.known.includes(q[2]));
    text('ВХОДИТ В:', px, ly, '#5a4230', null); ly += 9;
    if (!uses.length) text('ПОКА НЕИЗВЕСТНО', px, ly, '#a89878', null);
    uses.slice(0, 4).forEach(q => { text(fitText('— ' + EL[q[2]].n, pw), px, ly, '#7a6a4a', null); ly += 8; });
  };
  if (twoPage) drawPage(x + Math.floor(w / 2) + 5, gy, pageW - 10);
  else {
    const pot = jPick && isPotion(jPick);
    const ly = y + h - (pot ? 52 : 26);
    ctx.fillStyle = '#d0bd93'; ctx.fillRect(x + 3, ly - 2, w - 6, 1);
    if (jPick) {
      const r = recipeOf(jPick);
      text(fitText(EL[jPick].n, w - 10), x + 5, ly, '#3a2a1c', null);
      text(fitText(r ? EL[r[0]].n + ' + ' + EL[r[1]].n : 'БАЗОВЫЙ ЭЛЕМЕНТ', w - 10), x + 5, ly + 8, '#7a6a4a', null);
      if (pot) {              // одностраничный режим терял цену, варку и полку
        text(fitText('ЦЕНА ' + priceOf(jPick) + '  ВАРКА ' + brewSec(jPick) + ' С', w - 10), x + 5, ly + 17, '#8a6412', null);
        const sh = state.shelves.find(s => s.potion === jPick);
        text(sh ? 'НА ПОЛКЕ ' + sh.n + '/' + SHELF_CAP : 'НЕ НА ПОЛКЕ', x + 5, ly + 26, '#7a6a4a', null);
      }
    } else text('ТАП ПО ЗАПИСИ — РЕЦЕПТ', x + 5, ly + 4, '#a89878', null);
  }
  textR(jTab + 1 + ' / ' + TABS.length, x + w - 5, y + 26, '#a89878', null);
  /* Подсказка за rewarded — главный рекламный слот по спеке. Логика та же,
     что фронт в валидаторе дерева: неиспробованная пара известных с новым
     результатом, раскрытая наполовину. Здесь заглушка без рекламы. */
  button(x + 4, y + h - 13, 68, 11, 'ПОДСКАЗКА', 'purple', () => {
    const ks = state.known, cands = [];
    for (let i = 0; i < ks.length; i++) for (let j = i + 1; j < ks.length; j++) {
      const k = key2(ks[i], ks[j]), r = RMAP[k];
      if (r && !state.tried.has(k) && !state.known.includes(r)) cands.push([ks[i], ks[j]]);
    }
    if (!cands.length) { say('Подсказывать нечего — всё открыто.'); return; }
    const [a, b] = pick(cands);
    const kind = BASE.includes(b) ? 'из основ' : isPotion(b) ? 'из зелий' : 'из ингредиентов';
    SFX.spell({ v: .5 }); say('Попробуй ' + EL[a].n + ' с чем-то ' + kind + '.', 3200);
    ui = null; jPick = null;
  });
  button(x + w - 60, y + h - 13, 56, 11, 'ЗАКРЫТЬ', 'grey', () => { ui = null; jPick = null; SFX.close({ v: .5 }); });
}
let shelfIdx = 0;
function assignShelf(i) {
  const known = POTIONS.filter(p => state.known.includes(p));
  if (!known.length) { say('Сначала открой зелье.'); return; }
  shelfIdx = i; ui = 'shelf';
}
function drawShelfPick() {
  dim();
  const known = POTIONS.filter(p => state.known.includes(p));
  const w = Math.min(LW - 8, 170), rowsH = known.length * 15 + 32;
  const h = Math.min(LH - 16, rowsH);
  const x = Math.floor((LW - w) / 2), y = Math.floor((LH - h) / 2);
  slab(x, y, w, h, '#3a2b4d', '#241b33', '#55446e');
  textC('НА ПОЛКУ ' + (shelfIdx + 1), x + w / 2, y + 4, '#ffe066');
  known.forEach((id, i) => {
    const ry = y + 14 + i * 15;
    if (ry + 13 > y + h - 14) return;
    slab(x + 3, ry, w - 6, 13, '#4a3560', '#2e2040', '#63487d');
    spr('sm_' + id, x + 6, ry + 2);
    text(fitText(EL[id].n, w - 60), x + 14, ry + 3, '#f0e6d2');
    textR(shelfSec(id) + 'С', x + w - 6, ry + 3, '#9a86b5');
    pushHit(x + 3, ry, w - 6, 13, () => {
      const sh = state.shelves[shelfIdx];
      sh.potion = id; sh.n = 0; sh.t0 = now(); ui = null;
      SFX.select(); say(EL[id].n + ' на полке.');
    });
  });
  button(x + Math.floor((w - 60) / 2), y + h - 13, 60, 11, 'ОТМЕНА', 'grey', () => { ui = null; });
}
function drawReport() {
  dim();
  const r = state.report;
  const needs = r.next || [];
  const w = Math.min(LW - 8, 168), h = 104;
  const x = Math.floor((LW - w) / 2), y = Math.floor((LH - h) / 2);
  slab(x, y, w, h, '#3a2b4d', '#241b33', '#55446e');
  textC('ЗАКАТ. ДЕНЬ ' + r.day + ' СВЕДЁН', x + w / 2, y + 4, '#ffe066');
  const rows = [
    ['ПРОДАНО', r.sold], ['ВЫРУЧКА', r.coins],
    ['ОТКРЫТО', r.found], ['УШЛО НИ С ЧЕМ', r.left],
  ];
  rows.forEach(([k, v], i) => {
    text(k, x + 5, y + 15 + i * 9, '#c9b8e0');
    textR(String(v), x + w - 5, y + 15 + i * 9, '#f0e6d2');
  });
  // упущенная выгода — единственное «наказание» за незаготовленную ночь
  if (r.missed > 0) {
    text('УПУЩЕНО', x + 5, y + 51, '#e0a08e');
    textR('~' + r.missed, x + w - 5, y + 51, '#e0a08e');
  }
  // прогноз на завтра: кто в нём, тот и придёт
  ctx.fillStyle = '#55446e'; ctx.fillRect(x + 4, y + 61, w - 8, 1);
  text('ЗАВТРА ЖДУТ', x + 5, y + 64, '#e8b04b');
  let nx = x + 7 + textW('ЗАВТРА ЖДУТ');
  needs.forEach(([id, n]) => {
    if (nx + 12 > x + w - 4) return;
    spr('sm_' + id, nx, y + 63);
    text(String(n), nx + 6, y + 64, '#f0e6d2');
    nx += 6 + textW(String(n)) + 4;
  });
  // «×2» одноразовый: повторные тапы удваивали бы выручку экспоненциально
  if (!r.doubled) button(x + 4, y + h - 26, w - 8, 11, '×2 ЗА РЕКЛАМУ', 'purple', () => {
    state.coins += r.coins; r.coins *= 2; r.doubled = true;
    SFX.coins({ n: 6 }); say('Заглушка: выручка удвоена.');
  });
  else button(x + 4, y + h - 26, w - 8, 11, 'ВЫРУЧКА УДВОЕНА', 'grey', null);
  button(x + Math.floor((w - 70) / 2), y + h - 13, 70, 11, 'В НОЧЬ', 'green', () => { state.report = null; });
}

/* ═══════════════ Ввод: волочение и «тап-тап» ═══════════════ */
let drag = null, downAt = null;
function toLogical(e) {
  const r = screenCv.getBoundingClientRect();
  return { x: Math.floor((e.clientX - r.left) / r.width * LW), y: Math.floor((e.clientY - r.top) / r.height * LH) };
}
function cellAt(p) {                              // ячейка палитры под точкой
  const bb = L.palBase;
  if (p.x >= bb.x && p.y >= bb.y && p.y < bb.y + L.CELL) {
    const c = Math.floor((p.x - bb.x) / L.PITCH);
    if (c >= 0 && c < 4) return BASE[c];
  }
  const g = L.palGrid;
  if (p.x < g.x || p.y < g.y) return null;
  const col = Math.floor((p.x - g.x) / L.PITCH), row = Math.floor((p.y - g.y) / L.PITCH);
  if (col >= g.cols || row >= g.rows) return null;
  const rest = restList();
  const idx = (state.palScroll + row) * g.cols + col;
  return idx < rest.length ? rest[idx] : null;
}
function overCauldron(p) {
  const c = L.cau;
  return p.x >= c.x - 8 && p.x < c.x + c.w + 8 && p.y >= c.y - 24 && p.y < c.y + c.h + 4;
}
screenCv.addEventListener('pointerdown', e => {
  const p = toLogical(e);
  downAt = p;
  if (!ui && !state.report) {
    const id = cellAt(p);
    if (id) { drag = { id, x: p.x, y: p.y, moved: false }; return; }
    if (p.y >= L.y1) drag = { id: null, x: p.x, y: p.y, moved: false };   // свайп палитры
  }
});
screenCv.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = toLogical(e);
  if (Math.abs(p.x - drag.x) > 2 || Math.abs(p.y - drag.y) > 2) drag.moved = true;
  drag.x = p.x; drag.y = p.y;
});
screenCv.addEventListener('pointerup', e => {
  const p = toLogical(e);
  let handled = false;
  if (drag) {
    const swipe = () => {                         // свайп по палитре листает её
      if (!downAt || p.y < L.y1 - 4) return;
      const d = L.land ? downAt.x - p.x : downAt.y - p.y;
      if (Math.abs(d) > 8) state.palScroll += d > 0 ? 1 : -1;
    };
    if (drag.id) {                                // тап-тап или волочение элемента
      handled = true;
      if (drag.moved && overCauldron(p)) throwElement(drag.id, p.x, p.y);
      else if (!drag.moved) throwElement(drag.id, drag.x, drag.y - 6);
      else swipe();                               // жест обычно начинается с ячейки
    } else if (drag.moved) {
      handled = true;
      swipe();
    }
    drag = null;                                  // пустой тап падает дальше, к кнопкам
  }
  if (!handled) {
    for (let i = hits.length - 1; i >= 0; i--) {
      const h = hits[i];
      if (p.x >= h.x && p.x < h.x + h.w && p.y >= h.y && p.y < h.y + h.h) { h.fn(); break; }
    }
  }
  downAt = null;
});
screenCv.addEventListener('pointercancel', () => { drag = null; downAt = null; });
document.addEventListener('contextmenu', e => e.preventDefault());

/* ═══════════════ Кадр ═══════════════ */
let lastT = 0;
function frame(t) {
  const dt = Math.min((t - lastT) / 1000, .05); lastT = t; animT += dt;
  if (LW < 1 || LH < 1 || !L) { requestAnimationFrame(frame); return; }
  F4 = Math.floor(animT * 4); F8 = Math.floor(animT * 8);
  if (F8 !== prevF8) { prevF8 = F8; tickFx(); }

  // реакция в котле разрешается после бурления
  if (reacting && now() - reacting.t0 > 620) { const rx = reacting; reacting = null; resolveMix(rx.a, rx.b); }
  tickBrew(); tickShelves(); tickQueue();
  if (now() - lastSave > 5000) { lastSave = now(); saveGame(); }

  hits = [];
  ctx.clearRect(0, 0, LW, LH);
  drawRoom();
  drawShelves();
  drawCauldron();
  drawCounter();
  drawPalette();
  drawFx(dt);
  drawHUD();
  drawToast();
  drawFlash();
  if (state.report) drawReport();
  else if (ui === 'journal') drawJournal();
  else if (ui === 'shelf') drawShelfPick();
  if (drag && drag.id && drag.moved) ctx.drawImage(SPRITES['el_' + drag.id], drag.x - 6, drag.y - 6, 12, 12);

  sctx.drawImage(buf, 0, 0, LW, LH, 0, 0, LW * S, LH * S);
  requestAnimationFrame(frame);
}

/* ═══════════════ Запуск ═══════════════ */
buildFont();
buildSprites();
resize();
buildDither();
buildHolePats();
if (!loadGame()) { makePlan(); say('Ночь. Брось два элемента в котёл.', 3000); }
else if (!state.plan.length) makePlan();
coinsShown = state.coins;
applyAudioPhase();
requestAnimationFrame(t => { lastT = t; frame(t); });
</script>
