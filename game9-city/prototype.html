<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Удачный Квартал — прототип</title>
<!--
  Прототип партии: четыре города, общий кубик, витрина из шести позиций, три ИИ.
  Правила в rules.js, числа в economy.js — те же, что прогнаны симулятором на 5000 партий.
  Интерфейс сознательно held до минимума: это проверка ощущения хода, а не вёрстка релиза.
-->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script src="vendor/sfx.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#cfd6dd;color:#26313a;
            font:14px/1.35 system-ui,-apple-system,'Segoe UI',sans-serif;
            -webkit-user-select:none;user-select:none;touch-action:manipulation}
  /* Размер канваса задаётся ТОЛЬКО отсюда: renderer.setSize(W,H,false) меняет буфер под dpr
     и намеренно не трогает style. Без явных 100% браузер взял бы ширину из атрибута
     canvas.width (это replaced-элемент), и при dpr≠1 сцена вылезла бы за экран. */
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

  #players{position:fixed;top:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 130px)}
  .chip{background:rgba(255,255,255,.82);border-radius:10px;padding:5px 9px;display:flex;gap:7px;
        align-items:center;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);opacity:.72}
  .chip.on{opacity:1;outline:2px solid #26313a}
  .chip.me b{color:#2c6e4b}
  .chip .coins{font-weight:700;font-variant-numeric:tabular-nums}
  .chip .coins:after{content:' ¤'}
  .chip .mons{letter-spacing:1px;color:#8a7a52}

  #topright{position:fixed;top:8px;right:8px;display:flex;gap:6px}
  #topright button{min-height:34px;padding:0 10px;border:0;border-radius:9px;background:rgba(255,255,255,.85);
                   font:inherit;font-size:12px;font-weight:600;cursor:pointer}

  #msg{position:fixed;left:50%;transform:translateX(-50%);top:52px;background:rgba(38,49,58,.86);color:#fff;
       padding:7px 14px;border-radius:11px;font-size:13px;white-space:nowrap;max-width:92vw;overflow:hidden;
       text-overflow:ellipsis;pointer-events:none}

  /* Панель строительства: в портрете полоса снизу, в альбоме колонка справа.
     Резерв под неё заложен в кадрирование камеры (render3d.fit). */
  #panel{position:fixed;left:0;right:0;bottom:0;padding:8px;display:flex;gap:8px;align-items:flex-end;
         background:linear-gradient(to top,rgba(207,214,221,.96),rgba(207,214,221,0))}
  #shop{display:flex;gap:6px;overflow-x:auto;flex:1;padding-bottom:2px}
  .card{flex:0 0 auto;width:92px;min-height:74px;border:0;border-radius:11px;background:#fbfaf7;
        display:grid;grid-template-areas:'num cost' 'nm nm' 'pay pay';grid-template-columns:1fr auto;
        gap:2px;padding:7px 8px;text-align:left;font:inherit;cursor:pointer;position:relative;
        box-shadow:0 2px 8px rgba(0,0,0,.12);border-top:4px solid #9aa7b1}
  .card.промысел{border-top-color:#7d9b6c}
  .card.мастерская{border-top-color:#c19159}
  .card.рынок{border-top-color:#b4715f}
  .card.mon{border-top-color:#8a7a52;background:#f4efe2}
  .card .num{grid-area:num;font-weight:700;font-size:13px}
  .card .cost{grid-area:cost;font-weight:700;font-size:13px}
  .card .cost:after{content:'¤'}
  .card .nm{grid-area:nm;font-size:12px;line-height:1.15}
  .card .pay{grid-area:pay;font-size:11px;opacity:.65}
  .card .cnt{position:absolute;right:6px;bottom:5px;font-size:10px;opacity:.5}
  .card.off{opacity:.42;cursor:default}
  .card.sel{outline:3px solid #2c6e4b}

  #actions{display:flex;flex-direction:column;gap:6px}
  #roll{min-height:52px;min-width:112px;border:0;border-radius:12px;background:#26313a;color:#fff;
        font:inherit;font-weight:700;font-size:15px;cursor:pointer}
  #roll:disabled{opacity:.4;cursor:default}
  #roll.ready{background:#2c6e4b}
  #skip{min-height:34px;border:0;border-radius:9px;background:rgba(255,255,255,.85);font:inherit;
        font-size:12px;font-weight:600;cursor:pointer}

  body.landscape #panel{left:auto;top:0;bottom:0;width:292px;flex-direction:column;align-items:stretch;
                        justify-content:flex-end;padding:52px 8px 8px;
                        background:linear-gradient(to left,rgba(207,214,221,.96),rgba(207,214,221,0))}
  body.landscape #shop{flex-direction:column;overflow-y:auto;overflow-x:hidden}
  body.landscape .card{width:auto}
  body.landscape #actions{flex-direction:row}
  body.landscape #roll{flex:1}

  #pops{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .pop{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:16px;
       text-shadow:0 1px 3px rgba(255,255,255,.7);animation:rise 1.1s ease-out forwards}
  .pop.gain{color:#2c6e4b}
  .pop.loss{color:#a5342c}
  .pop.foe{color:#5c6b76;font-size:13px;opacity:.85}
  @keyframes rise{from{opacity:0;translate:0 6px}15%{opacity:1}to{opacity:0;translate:0 -34px}}

  #over{position:fixed;inset:0;background:rgba(38,49,58,.82);color:#fff;display:grid;place-content:center;
        gap:14px;text-align:center;padding:24px}
  /* Обязательно: display:grid выше по приоритету, чем [hidden]{display:none} из стилей
     браузера, и без этой строки экран победы висит поверх доски всю партию. */
  #over[hidden]{display:none}
  #over h1{font-size:26px}
  #over p{font-size:14px;opacity:.85;max-width:420px}
  #again{justify-self:center;min-height:46px;padding:0 22px;border:0;border-radius:11px;background:#fff;
         color:#26313a;font:inherit;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="players"></div>
<div id="topright">
  <button id="rotate">повернуть</button>
  <button id="mute">звук ♪</button>
</div>
<div id="msg"></div>

<div id="panel">
  <div id="shop"></div>
  <div id="actions">
    <button id="roll" disabled>Бросить</button>
    <button id="skip" hidden>Пропустить</button>
  </div>
</div>

<div id="pops"></div>

<div id="over" hidden>
  <h1 id="over-title"></h1>
  <p id="over-sub"></p>
  <button id="again">Ещё партия</button>
</div>

<!-- Модуль с importmap с диска (file://) не грузится — объясняем, а не показываем пустоту. -->
<script>
if (location.protocol === 'file:') {
  document.body.innerHTML =
    '<div style="position:fixed;inset:0;display:grid;place-content:center;gap:10px;text-align:center;' +
    'padding:24px;font:15px/1.5 system-ui,sans-serif;color:#26313a;background:#cfd6dd">' +
    '<b style="font-size:18px">Прототип открыт с диска</b>' +
    '<div>three.js подключён как ES-модуль — по протоколу <code>file://</code> браузер его не грузит.</div>' +
    '<div>Запустите сервер и откройте по http:<br>' +
    '<code style="display:inline-block;margin-top:6px;padding:6px 10px;background:#fff;border-radius:6px">' +
    'node serve.js 8783</code><br>' +
    '<a href="http://localhost:8783/game9-city/prototype.html">localhost:8783/game9-city/prototype.html</a></div></div>';
}
</script>
<script type="module" src="proto.js"></script>
</body>
</html>
