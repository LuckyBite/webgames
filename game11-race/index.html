<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ковровые Гонки</title>
<!--
  Ковровые Гонки, игра №11. v2: три ковра-карты, гараж, онлайн с лобби, призраки.
  Гонщик описан полем ctrl:
    'human' — своя машинка, физика считается здесь;
    'bot'   — бот, его считает ведущий комнаты (или мы сами в одиночной игре);
    'net'   — чужая машинка, позы приходят по сети и интерполируются.
  Онлайн: свой сервер server/server.js (лобби + пересылка), см. NET.md.
  Призраки: асинхронный мультиплеер Яндекса (ysdk.multiplayer.sessions), локально — свой рекорд.
-->
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#b98d5f;overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font:700 15px/1.25 'Trebuchet MS','Arial Rounded MT Bold',system-ui,sans-serif;color:#2b2540}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  button{font:inherit;cursor:pointer;border:0;color:inherit}
  input{font:inherit;-webkit-user-select:text;user-select:text}
  .hide{display:none!important}

  #hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;display:flex;gap:7px;flex-wrap:wrap;
       pointer-events:none;max-width:calc(100% - 140px)}
  .pill{background:rgba(255,255,255,.9);border-radius:14px;padding:5px 12px;box-shadow:0 3px 0 rgba(43,37,64,.18);
        font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:baseline;gap:2px}
  #hPos b{font-size:24px;line-height:1}
  #hPos small,#hLap small{opacity:.6;font-size:12px}
  #tr{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:5}
  #tr .row{display:flex;gap:8px}
  .ibtn{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.9);box-shadow:0 3px 0 rgba(43,37,64,.18);
        display:grid;place-items:center;font-size:20px}
  #mini{width:118px;height:86px;border-radius:12px;background:rgba(255,255,255,.55);box-shadow:0 3px 0 rgba(43,37,64,.12)}

  #big{position:fixed;left:0;right:0;top:28%;text-align:center;font-size:min(22vw,120px);color:#fff;pointer-events:none;
       text-shadow:0 6px 0 #e8433a,0 10px 18px rgba(0,0,0,.25);letter-spacing:2px;opacity:0;transition:opacity .2s}
  #big.small{font-size:min(10vw,58px)}
  #toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(43,37,64,.88);
         color:#fff;padding:9px 16px;border-radius:14px;font-size:14px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:20;
         max-width:90vw;text-align:center}

  .tbtn{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));width:min(24vw,110px);height:min(24vw,110px);border-radius:50%;
        background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.55);display:grid;place-items:center;
        pointer-events:none;font-size:40px;color:rgba(255,255,255,.9);transition:background .08s}
  .tbtn.on{background:rgba(255,255,255,.55)}
  #tL{left:14px}#tR{right:14px}

  /* экраны меню: в портрете карточка снизу, машинка на витрине видна сверху;
     в альбоме карточка справа, машинка слева */
  .ov{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:14px;
      padding-bottom:max(14px,env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(43,37,64,.4),rgba(43,37,64,0) 55%)}
  .ov.center{align-items:center;background:radial-gradient(ellipse at center,rgba(43,37,64,.1),rgba(43,37,64,.5))}
  @media (min-aspect-ratio:5/4){ .ov:not(.center){justify-content:flex-end;align-items:center;padding-right:72px;background:linear-gradient(to left,rgba(43,37,64,.35),rgba(43,37,64,0) 60%)} }
  .card{background:#fffaf0;border-radius:24px;padding:16px 18px;max-width:420px;width:100%;text-align:center;
        max-height:calc(100% - 4px);overflow:auto;box-shadow:0 8px 0 rgba(43,37,64,.25),0 20px 40px rgba(0,0,0,.25)}
  h1{font-size:clamp(28px,7.5vw,42px);line-height:1;color:#e8433a;text-shadow:0 4px 0 #f5c02c;letter-spacing:1px;margin-bottom:4px}
  h2{font-size:26px;color:#2f7de1;margin-bottom:8px}
  .sub{opacity:.7;font-size:14px;margin-bottom:10px}
  .lbl{font-size:12px;opacity:.6;margin:8px 0 6px;text-transform:uppercase;letter-spacing:.5px}
  .rowb{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .chip{min-height:44px;padding:6px 12px;border-radius:14px;background:#efe6d6;box-shadow:0 3px 0 rgba(43,37,64,.15);font-size:14px}
  .chip.on{background:#2b2540;color:#fff}
  .maps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
  .map{border-radius:14px;background:#efe6d6;padding:5px 4px 6px;box-shadow:0 3px 0 rgba(43,37,64,.15);font-size:13px;min-height:44px}
  .map canvas{display:block;width:100%;height:46px;border-radius:9px;margin-bottom:3px}
  .map.on{outline:3px solid #2b2540}
  .sw{width:42px;height:42px;border-radius:50%;box-shadow:0 4px 0 rgba(0,0,0,.2),inset 0 -6px 0 rgba(0,0,0,.15);
      border:4px solid #fff;outline:3px solid transparent;transition:transform .1s}
  .sw.on{outline-color:#2b2540;transform:scale(1.12)}
  .big{display:block;width:100%;min-height:54px;border-radius:18px;background:#3cb371;color:#fff;font-size:22px;
       box-shadow:0 6px 0 #26875a;margin-top:8px;letter-spacing:.5px}
  .big:active{transform:translateY(4px);box-shadow:0 2px 0 #26875a}
  .big.alt{background:#2f7de1;box-shadow:0 6px 0 #1d5aa8;font-size:18px;min-height:48px}
  .big.org{background:#ff8a2a;box-shadow:0 6px 0 #c4621a;font-size:18px;min-height:48px}
  .big.gray{background:#9a93a8;box-shadow:0 6px 0 #6f6880;font-size:17px;min-height:46px}
  .big:disabled{opacity:.45}
  .two{display:flex;gap:8px}.two>*{flex:1}
  .hint{font-size:12px;opacity:.6;margin-top:10px}
  .best{font-size:14px;color:#b0731a;margin-top:8px;min-height:18px}
  .name{width:100%;min-height:44px;border-radius:14px;border:3px solid #efe6d6;padding:6px 12px;text-align:center;font-size:17px;background:#fff}
  ul.list{list-style:none;text-align:left;margin:4px 0 6px}
  ul.list li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;font-variant-numeric:tabular-nums}
  ul.list li.me{background:#fff0c4}
  ul.list .pl{width:30px;font-size:20px;text-align:center}
  ul.list .dot{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);flex:none}
  ul.list .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  ul.list .go{min-height:40px;padding:4px 14px;border-radius:12px;background:#3cb371;color:#fff}
  .empty{opacity:.55;font-size:14px;padding:10px}
  .code{font-size:34px;letter-spacing:6px;color:#2b2540}
  .status{font-size:13px;opacity:.65;min-height:18px;margin-bottom:4px}
  #resNote{color:#b0731a;min-height:20px;margin-bottom:4px}
  .three{display:flex;gap:8px}.three>*{flex:1;padding:0 4px}

  /* кооператив: карточки игроков */
  .prow{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:14px;background:#f6efe2;margin-bottom:6px}
  .prow .pn{flex:1;text-align:left;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow .sw{width:34px;height:34px;border-width:3px;flex:none}
  .prow .chip{min-height:38px;padding:4px 9px;font-size:13px;flex:none}
  .prow .dev{min-width:84px}
  .prow .dev.wait{background:#ffe7a8}

  /* тач-кнопки игроков в кооперативе: у каждого пара в своём углу */
  .tz{position:fixed;display:flex;gap:10px;pointer-events:none;z-index:4}
  .tz b{width:min(17vw,84px);height:min(17vw,84px);border-radius:50%;display:grid;place-items:center;font-size:30px;
        color:#fff;background:rgba(255,255,255,.18);border:4px solid var(--c);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:background .08s}
  .tz b.on{background:var(--c)}
  .tz.p0{left:12px;bottom:max(12px,env(safe-area-inset-bottom))}
  .tz.p1{right:12px;bottom:max(12px,env(safe-area-inset-bottom))}
  /* верхние пары для тех, кто сидит напротив: перевёрнуты, стоят под плашками HUD и под мини-картой */
  .tz.p2{left:12px;top:calc(max(10px,env(safe-area-inset-top)) + 96px);transform:rotate(180deg)}
  .tz.p3{right:12px;top:calc(max(10px,env(safe-area-inset-top)) + 160px);transform:rotate(180deg)}
  .pill .pd{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:5px;align-self:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
  #hud.coop .pill{padding:4px 9px;font-size:13px}
  #hud.coop .pill b{font-size:18px}

  @media (max-height:480px){
    .card{padding:10px 14px;max-width:480px}
    h1{font-size:28px}.sub{display:none}.lbl{margin:4px 0}.map canvas{height:32px}
    .sw{width:36px;height:36px}.big{min-height:44px;font-size:18px;margin-top:6px}.big.alt,.big.org,.big.gray{min-height:42px}
    .hint{display:none}ul.list li{padding:2px 10px}h2{margin-bottom:2px;font-size:22px}.chip{min-height:40px}
    /* «Вместе» в альбоме на телефоне: игроки в две колонки, кнопки в ряд, всё без прокрутки */
    #coop .card{max-width:720px}
    #cPlayers{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
    #cCount{margin-bottom:4px!important}
    .prow{margin-bottom:5px;padding:3px 5px}.prow .sw{width:30px;height:30px}.prow .chip{min-height:36px}
    #cBtns{display:flex;gap:8px}#cBtns>*{flex:1}#cBtns .big.gray{flex:.6}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <div class="pill" id="hPos"></div>
  <div class="pill" id="hLap"></div>
  <div id="hCoop" style="display:contents"></div>
  <div class="pill" id="hTime"></div>
</div>
<div id="tr">
  <div class="row">
    <button class="ibtn" id="bSnd" aria-label="sound">🔊</button>
    <button class="ibtn hide" id="bPause" aria-label="pause">⏸</button>
  </div>
  <canvas id="mini" class="hide"></canvas>
</div>
<div id="big"></div>
<div id="toast"></div>
<div class="tbtn hide" id="tL">◀</div>
<div class="tbtn hide" id="tR">▶</div>
<div id="tzs"></div>

<!-- главное меню -->
<div class="ov" id="menu">
  <div class="card">
    <h1 data-t="title"></h1>
    <div class="sub" data-t="sub"></div>
    <div class="maps" id="maps"></div>
    <button class="big" id="bPlay" data-t="play"></button>
    <div class="three">
      <button class="big alt" id="bOnline" data-t="online"></button>
      <button class="big alt" id="bCoop" data-t="coop" style="background:#9b59d0;box-shadow:0 6px 0 #6e3a9c"></button>
      <button class="big org" id="bGarage" data-t="garage"></button>
    </div>
    <div class="best" id="mBest"></div>
    <div class="hint" id="mHint"></div>
  </div>
</div>

<!-- гараж -->
<div class="ov hide" id="garage">
  <div class="card">
    <h2 data-t="garage"></h2>
    <input class="name" id="gName" maxlength="14" autocomplete="off" spellcheck="false">
    <div class="lbl" data-t="body"></div>
    <div class="rowb" id="gBody"></div>
    <div class="lbl" data-t="paint"></div>
    <div class="rowb" id="gColor"></div>
    <div class="lbl" data-t="acc"></div>
    <div class="rowb" id="gAcc"></div>
    <button class="big" id="bGarageOk" data-t="done"></button>
  </div>
</div>

<!-- кооператив на одном экране -->
<div class="ov hide" id="coop">
  <div class="card">
    <h2 data-t="coopTitle"></h2>
    <div class="rowb" id="cCount" style="margin-bottom:8px"></div>
    <div id="cPlayers"></div>
    <div class="maps" id="cMaps"></div>
    <div id="cBtns">
      <button class="big" id="bCoopGo" data-t="play2"></button>
      <button class="big gray" id="bBack2" data-t="back"></button>
    </div>
    <div class="hint" data-t="coopHint"></div>
  </div>
</div>

<!-- онлайн-лобби -->
<div class="ov hide" id="lobby">
  <div class="card">
    <h2 data-t="online"></h2>
    <div class="status" id="lStatus"></div>
    <div class="status hide" id="lHost" style="-webkit-user-select:text;user-select:text;opacity:.9"></div>
    <div id="lList">
      <ul class="list" id="lRooms"></ul>
      <button class="big" id="bQuick" data-t="quick"></button>
      <div class="two">
        <button class="big alt" id="bCreate" data-t="create"></button>
        <button class="big gray" id="bBack1" data-t="back"></button>
      </div>
      <div class="two" style="margin-top:8px">
        <input class="name" id="lCode" inputmode="numeric" maxlength="4" autocomplete="off">
        <button class="big alt" id="bJoin" data-t="join" style="margin-top:0"></button>
      </div>
    </div>
    <div id="lRoom" class="hide">
      <div class="lbl" data-t="roomCode"></div>
      <div class="code" id="lCodeShow"></div>
      <div class="maps" id="lMaps"></div>
      <ul class="list" id="lPlayers"></ul>
      <button class="big" id="bReady"></button>
      <button class="big alt" id="bStart" data-t="start"></button>
      <button class="big gray" id="bLeave" data-t="leave"></button>
    </div>
  </div>
</div>

<div class="ov center hide" id="pauseOv">
  <div class="card">
    <h2 data-t="paused"></h2>
    <button class="big" id="bResume" data-t="resume"></button>
    <button class="big gray" id="bQuit" data-t="toMenu"></button>
  </div>
</div>

<div class="ov center hide" id="resOv">
  <div class="card">
    <h2 id="resTitle"></h2>
    <div id="resNote"></div>
    <ul class="list" id="resList"></ul>
    <button class="big" id="bAgain" data-t="again"></button>
    <button class="big gray" id="bMenu" data-t="toMenu"></button>
  </div>
</div>

<!-- sdk.js: только для Яндекс Игр -->
<script src="vendor/sfx.js"></script>
<script type="module">
import * as THREE from 'three';

// Адрес сервера онлайна для релиза. Пусто = онлайн выключен вне localhost.
// Переопределяется параметром ?server=wss://host/ws
const NET_SERVER = '';

/* ═══════════════ тексты ═══════════════ */
const I18N = {
  ru: { title: 'Ковровые Гонки', sub: 'Игрушечные машинки гоняют по ковру', play: 'Гонка с ботами', online: 'Онлайн', garage: 'Гараж',
        paused: 'Пауза', resume: 'Продолжить', toMenu: 'В меню', again: 'Ещё заезд', lap: 'Круг', go: 'Газ!',
        lastLap: 'Последний круг!', finish: 'Финиш!', best: 'Рекорд на этой карте', newBest: 'Новый рекорд!',
        places: ['🥇', '🥈', '🥉', '4'], win: 'Победа!', place: n => n + ' место', done: 'Готово',
        body: 'Кузов', paint: 'Цвет', acc: 'Штучка', bodies: ['Малыш', 'Пикап', 'Болид'], accs: ['Ключик', 'Флажок', 'Мигалка', 'Корона'],
        maps: ['Городок', 'Космос', 'Ферма'],
        hintKeys: 'Стрелки или A и D: руль. Вниз или S: тормоз. Газ жмётся сам.',
        hintTouch: 'Касайся слева и справа, чтобы рулить. Двумя пальцами сразу: тормоз.',
        names: ['Ты', 'Жучок', 'Ракета', 'Пончик', 'Шмель', 'Бублик'], racer: 'Гонщик', ghost: 'Твой рекорд',
        quick: 'Быстрая игра', create: 'Создать комнату', join: 'Войти', back: 'Назад', codePh: 'Код', roomCode: 'Код комнаты',
        ready: 'Я готов', notReady: 'Не готов', start: 'Старт!', leave: 'Выйти из комнаты', waitHost: 'Ведущий запустит гонку',
        noRooms: 'Пока никого. Создай комнату и позови друга.', connecting: 'Подключаемся...', connected: 'На связи', hostHint: u => 'С телефона в этой же Wi-Fi сети: ' + u, shareHint: u => 'Ссылка для друзей: ' + u,
        offline: 'Сервер онлайна недоступен', host: 'ведущий', bot: 'бот', toRoom: 'В комнату',
        errs: { full: 'Комната заполнена', nf: 'Нет такой комнаты', started: 'Там уже едут', notready: 'Не все готовы' },
        lost: 'Связь пропала, доезжаем с ботами', playerLeft: n => n + ' вышел, его ведёт бот', waitAll: 'Ждём остальных',
        coop: 'Вместе', coopTitle: 'На одном экране', play2: 'Поехали!', player: n => 'Игрок ' + n, nPlayers: n => n + ' игрока',
        coopHint: 'Газ жмётся сам. Тормоз: кнопка вниз или обе стрелки сразу. Геймпад: нажми любую кнопку, и он достанется игроку.',
        devs: { arrows: '← → ↓', wasd: 'A D S', ijkl: 'J L K', numpad: 'Num 4 6 5', touch: '👆 экран', pad: n => '🎮 ' + n },
        padJoined: (p, n) => 'Геймпад ' + p + ' у игрока ' + n, finishName: n => n + ' на финише!', lapName: (n, l, last) => n + ': ' + (last ? 'последний круг!' : 'круг ' + l),
        winner: n => 'Первое место: ' + n },
  en: { title: 'Carpet Racers', sub: 'Toy cars racing across the rug', play: 'Race the bots', online: 'Online', garage: 'Garage',
        paused: 'Paused', resume: 'Resume', toMenu: 'Menu', again: 'Race again', lap: 'Lap', go: 'Go!',
        lastLap: 'Final lap!', finish: 'Finish!', best: 'Best on this map', newBest: 'New record!',
        places: ['🥇', '🥈', '🥉', '4'], win: 'You win!', place: n => ['', '1st', '2nd', '3rd', '4th'][n] + ' place', done: 'Done',
        body: 'Body', paint: 'Color', acc: 'Topper', bodies: ['Buggy', 'Pickup', 'Racer'], accs: ['Key', 'Flag', 'Siren', 'Crown'],
        maps: ['Town', 'Space', 'Farm'],
        hintKeys: 'Arrows or A and D to steer. Down or S to brake. Gas is automatic.',
        hintTouch: 'Touch left or right side to steer. Two fingers to brake.',
        names: ['You', 'Bug', 'Rocket', 'Donut', 'Bumble', 'Bagel'], racer: 'Racer', ghost: 'Your best',
        quick: 'Quick play', create: 'Create room', join: 'Join', back: 'Back', codePh: 'Code', roomCode: 'Room code',
        ready: 'Ready', notReady: 'Not ready', start: 'Start!', leave: 'Leave room', waitHost: 'The host starts the race',
        noRooms: 'Nobody here yet. Create a room and invite a friend.', connecting: 'Connecting...', connected: 'Online', hostHint: u => 'From a phone on the same Wi-Fi: ' + u, shareHint: u => 'Link for friends: ' + u,
        offline: 'Online server is unavailable', host: 'host', bot: 'bot', toRoom: 'Back to room',
        errs: { full: 'Room is full', nf: 'No such room', started: 'Race already started', notready: 'Not everyone is ready' },
        lost: 'Connection lost, finishing with bots', playerLeft: n => n + ' left, a bot took over', waitAll: 'Waiting for others',

        coopHint: 'Gas is automatic. Brake: the down key or both arrows at once. Gamepad: press any button to give it to a player.',

        winner: n => 'First place: ' + n },
};
let T = I18N.ru;
const IS_TOUCH = matchMedia('(pointer:coarse)').matches;
const $ = id => document.getElementById(id);
function setLang(l) {
  const ru = ['ru', 'be', 'kk', 'uk', 'uz'].includes(String(l || '').slice(0, 2));
  T = ru ? I18N.ru : I18N.en;

const PARTS = [];

  const m = new THREE.Mesh(GEO.part, new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, depthWrite: false }));
  m.visible = false; scene.add(m);

let partCur = 0;
function emit(x, y, z, color, vx, vy, vz, life, size, g = 1) {
  const p = PARTS[partCur = (partCur + 1) % PARTS.length];
  p.m.position.set(x, y, z); p.m.material.color.set(color); p.m.visible = true;
  Object.assign(p, { vx, vy, vz, life, max: life, size, g, spin: (Math.random() - .5) * 10 });

function updateParts(dt) {

    p.life -= dt; if (p.life <= 0) { p.m.visible = false; continue; }

/* ═══════════════ гонщики ═══════════════ */
let racers = [], me = null, raceT = 0, state = 'menu', paused = false, stateT = 0, online = false;

  const lat = slot % 2 ? 2.3 : -2.3;

// одиночная гонка: три бота впереди, игрок на последнем месте решётки
function setupSolo() {
  clearRacers(); online = false;

  const names = [1, 2, 3, 4, 5].sort(() => rnd() - .5);
  for (let slot = 0; slot < 4; slot++) {

}

  const skills = [.94, .965, .985].sort(() => rnd() - .5);
  const names = [1, 2, 3, 4, 5].sort(() => rnd() - .5);
  const nb = 4 - n;
  for (let slot = 0; slot < 4; slot++) {
    const pi = slot - nb;                       // номер игрока или <0 для бота
    let c;
    if (pi >= 0) {
      const name = pi === 0 && save.name ? save.name : T.player(pi + 1);
      c = newRacer(slot, 'human', save.coop.cars[pi], name, 1, name);
      addHuman(c, pi, save.coop.devs[pi]);
      // цветное кольцо под машинкой игрока: на общем плане видно, где чья
      const ring = new THREE.Mesh(GEO.ring, new THREE.MeshBasicMaterial({ color: c.color, transparent: true, opacity: .75, depthWrite: false }));
      ring.rotation.x = -Math.PI / 2; ring.position.y = .06; ring.renderOrder = 1; c.root.add(ring); c.ring = ring;

/* управление: человек или бот; 'net' не управляется, его позы приходят по сети */
function control(c) {
  if (c.ctrl === 'human') { const d = readDev(c.dev, c.player); c.inS = d.s; c.inG = 1; c.inB = d.b; }

  for (const o of racers) {
    if (o === c) continue;
    const ahead = (o.idx - c.idx + N) % N;
    if (ahead > 0 && ahead * SP < 7 && Math.abs(o.lat - c.lane) < 2) {
      c.laneT = clamp(o.lat > 0 ? o.lat - 2.7 : o.lat + 2.7, -RW * .36, RW * .36);
    }
  }
  c.lane += (c.laneT - c.lane) * Math.min(1, STEP * 1.6);
  const look = Math.round((4.5 + sp * .42) / SP);
  const t = (c.idx + look) % N;
  const tx = SX[t] + NX[t] * c.lane, tz = SZ[t] + NZ[t] * c.lane;
  const d = wrapA(Math.atan2(tx - c.x, tz - c.z) - c.h);
  c.inS = clamp(-d * 2.6, -1, 1);

  c.inG = c.vF < vT ? 1 : 0; c.inB = c.vF > vT + 3 ? 1 : 0;

    if (c.unstick > 0) { c.unstick -= STEP; c.inG = 0; c.inB = 1; c.inS = -c.inS; return; }
    c.stuckT = sp < 2 ? c.stuckT + STEP : 0;

}

/* ═══════════════ сеть ═══════════════ */
// Клиент сервера server/server.js. Каждый шлёт позы своих машинок 15 раз в секунду,
// чужие рисуются с отставанием INTERP мс и плавно интерполируются между пакетами.
const INTERP = 120;
const Net = {
  ws: null, id: null, room: null, rooms: [], status: 'off', host: null, slots: null,
  url() {
    const q = new URLSearchParams(location.search).get('server');
    if (q) return q;
    const same = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
    if (location.port === '8786') return same;                       // страницу отдаёт сам сервер онлайна
    if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return `ws://${location.hostname}:8786`;
    // игра открыта с ноутбука по Wi-Fi (192.168.*, 10.*, 172.16–31.*, имя.local): сервер онлайна живёт там же
    if (/^(192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)|\.local$/.test(location.hostname)) return `ws://${location.hostname}:8786`;
    if (NET_SERVER) return NET_SERVER;
    // открыто через туннель с ноутбука: игра и онлайн на одном адресе
    return /^https?:$/.test(location.protocol) ? same : '';
  },
  connect() {
    if (this.ws && this.ws.readyState <= 1) return;
    const url = this.url();
    if (!url) { this.status = 'off'; lobbyUi(); return; }
    this.status = 'connecting'; lobbyUi();
    let ws;
    try { ws = new WebSocket(url); } catch (e) { this.status = 'off'; lobbyUi(); return; }
    this.ws = ws;
    const fail = setTimeout(() => { if (ws.readyState !== 1) { try { ws.close(); } catch (e) {} } }, 5000);
    ws.onopen = () => { clearTimeout(fail); this.status = 'on'; this.send({ t: 'hello', name: myName(), car: save.car }); lobbyUi(); };
    ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (x) { return; } this.on(m); };
    ws.onclose = () => {
      clearTimeout(fail);
      const wasRacing = online && state !== 'menu';
      this.ws = null; this.status = 'off'; this.room = null; this.id = null;
      if (wasRacing) netLost(); else lobbyUi();
    };
  },
  send(m) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(m)); },
  on(m) {
    switch (m.t) {
      case 'welcome': this.id = m.id; this.lan = m.lan || null; lobbyUi(); break;
      case 'rooms': this.rooms = m.list; lobbyUi(); break;
      case 'room': {
        const prevHost = this.room?.host;
        this.room = m; this.host = m.host;
        if (online && state !== 'menu') roomChangedMidRace(m, prevHost);
        else if (m.map !== MI) { save.map = m.map; buildMap(m.map); showcase(); }
        lobbyUi();
        break;
      }
      case 'left': this.room = null; lobbyUi(); break;
      case 'err': toast(T.errs[m.e] || m.e); break;
      case 'start': startOnline(m); break;
      case 'pose': if (online) for (const p of m.p) { const c = racers[p[0]]; if (c && c.ctrl === 'net') { c.buf.push({ t: performance.now(), d: p }); if (c.buf.length > 12) c.buf.shift(); } } break;
      case 'fin': if (online) { const c = racers[m.s]; if (c && c.ctrl === 'net') { c.finished = true; c.time = m.time; } } break;
    }
  },
};

  let d;
  if (rt >= z.t) {                                     // пакеты запаздывают: чуть продлеваем по скорости

// кто-то вышел посреди гонки: его машинку и ботов ушедшего ведущего забирает новый ведущий
function roomChangedMidRace(room, prevHost) {
  const ids = new Set(room.players.map(p => p.id));
  for (const c of racers) {
    if (c.ctrl !== 'net' || ids.has(c.owner)) continue;
    if (c.pid && !ids.has(c.pid) && c.pid !== Net.id) toast(T.playerLeft(c.name));
    if (room.host === Net.id) { c.ctrl = 'bot'; c.owner = Net.id; c.skill = .95; c.buf = []; c.mid = c.idx < N * .5; }
    else c.owner = room.host;

  cam.aspect = w / h; cam.updateProjectionMatrix();
  miniBase = null;
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (state === 'race' || state === 'count') setPaused(true); YSDK.gameplayStop(); }
});

/* ═══════════════ старт ═══════════════ */
function migrate(d) {
  // сейв v1: best был числом, color лежал отдельно
  const s = Object.assign({}, save, d || {});
  if (!Array.isArray(s.best)) s.best = [typeof s.best === 'number' ? s.best : 0, 0, 0];
  if (!s.car || typeof s.car !== 'object') s.car = { body: 0, color: (d && d.color) | 0, acc: 0 };
  s.car = { body: clamp(s.car.body | 0, 0, 2), color: clamp(s.car.color | 0, 0, 5), acc: clamp(s.car.acc | 0, 0, 3) };
  s.map = clamp(s.map | 0, 0, MAPS.length - 1);
  delete s.color;
  // кооператив: до v3 настроек не было
  const dc = save.coop, c = s.coop && typeof s.coop === 'object' ? s.coop : {};
  s.coop = {
    n: clamp(c.n | 0 || 2, 2, 4),
    cars: [0, 1, 2, 3].map(i => { const v = (c.cars || [])[i] || dc.cars[i]; return { body: clamp(v.body | 0, 0, 2), color: clamp(v.color | 0, 0, 5), acc: clamp(v.acc | 0, 0, 3) }; }),
    devs: [0, 1, 2, 3].map(i => (c.devs || [])[i] || (IS_TOUCH ? 'touch' : dc.devs[i])),
  };
  if (!c.cars) s.coop.cars[0] = { ...s.car };          // первый игрок по умолчанию едет на своей машинке из гаража
  fixCoopColors(s.coop);
  return s;
}
(async () => {
  setLang(navigator.language);
  resize();
  await YSDK.init();
  setLang(YSDK.lang);
  save = migrate(await YSDK.loadData());
  Sound.setMuted(!!save.muted); syncSnd();
  buildMap(save.map); showcase(); buildMenuUi();
  tick(0);
  requestAnimationFrame(t => { lastT = t; frame(t); YSDK.gameReady(); inputEnabled = true; });
})();
</script>
